                  <button class="warning" data-action="load-sample" type="button">Загрузить пример</button>
                  <button class="danger" data-action="reset-app" type="button">Полный сброс</button>
                </div>
                <div class="notice info">
                  Для iPhone: сохраните этот HTML-файл в Files или откройте его со статического хостинга. После первого открытия интернет не нужен, пока файл доступен устройству.
                </div>
              </div>
            </div>
          </section>
        `;
      }

      function findExercise(slot, exerciseId) {
        const day = getDayBySlot(Number(slot));
        return day.exercises.find(ex => ex.id === exerciseId);
      }

      function findSet(slot, exerciseId, setId) {
        const exercise = findExercise(slot, exerciseId);
        return exercise?.sets.find(set => set.id === setId);
      }

      function moveItem(array, from, to) {
        if (from === to || from < 0 || to < 0 || from >= array.length || to >= array.length) return;
        const [item] = array.splice(from, 1);
        array.splice(to, 0, item);
      }

      function activateDay(slot) {
        const day = getDayBySlot(Number(slot));
        day.kind = 'workout';
        if (!day.exercises.length) day.exercises.push(makeExercise('Новое упражнение', 3, 10));
        saveState();
        showToast('Тренировочный день создан.');
        render();
      }

      function nearestDateForSlot(slot) {
        const dates = weekDates(0);
        const direct = dates[Number(slot)];
        if (direct >= todayKey()) return direct;
        return weekDates(1)[Number(slot)];
      }

      function handleAction(button) {
        const action = button.dataset.action;
        const slot = Number(button.dataset.slot);
        const dateKey = button.dataset.date;
        const exerciseId = button.dataset.exerciseId;
        const setId = button.dataset.setId;

        if (action === 'set-view') {
          ui.view = button.dataset.view;
          if (ui.view === 'today') ui.selectedDateKey = todayKey();
          render();
          return;
        }
        if (action === 'select-week-date') {
          ui.selectedDateKey = dateKey;
          render();
          return;
        }
        if (action === 'week-prev') { ui.weekOffset -= 1; ui.selectedDateKey = weekDates(ui.weekOffset)[0]; render(); return; }
        if (action === 'week-next') { ui.weekOffset += 1; ui.selectedDateKey = weekDates(ui.weekOffset)[0]; render(); return; }
        if (action === 'week-today') { ui.weekOffset = 0; ui.selectedDateKey = todayKey(); render(); return; }
        if (action === 'select-editor-slot') { ui.editorSlot = slot; render(); return; }
        if (action === 'open-editor-slot') { ui.editorSlot = slot; ui.view = 'editor'; render(); return; }
        if (action === 'open-date-for-slot') { ui.selectedDateKey = nearestDateForSlot(slot); ui.view = 'day'; render(); return; }
        if (action === 'activate-day') { activateDay(slot); return; }

        if (action === 'delete-training-day') {
          if (!confirm('Удалить тренировочный день из шаблона? История уже выполненных тренировок сохранится.')) return;
          const day = getDayBySlot(slot);
          day.kind = 'rest';
          day.exercises = [];
          saveState();
          showToast('День переведён в отдых.');
          render();
          return;
        }

        if (action === 'add-exercise') {
          const day = getDayBySlot(slot);
          day.kind = 'workout';
          day.exercises.push(makeExercise('Новое упражнение', 3, 10));
          saveState();
          render();
          return;
        }

        if (action === 'duplicate-exercise') {
          const day = getDayBySlot(slot);
          const index = day.exercises.findIndex(ex => ex.id === exerciseId);
          if (index === -1) return;
          const copy = clone(day.exercises[index]);
          copy.id = uid('ex');
          copy.name = `${copy.name} копия`;
          copy.sets = copy.sets.map(set => ({ ...set, id: uid('set') }));
          day.exercises.splice(index + 1, 0, copy);
          saveState();
          render();
          return;
        }

        if (action === 'delete-exercise') {
          if (!confirm('Удалить упражнение из шаблона? История уже выполненных тренировок сохранится.')) return;
          const day = getDayBySlot(slot);
          day.exercises = day.exercises.filter(ex => ex.id !== exerciseId);
          saveState();
          render();
          return;
        }

        if (action === 'move-exercise') {
          const day = getDayBySlot(slot);
          const index = day.exercises.findIndex(ex => ex.id === exerciseId);
          const direction = button.dataset.direction === 'up' ? -1 : 1;
          moveItem(day.exercises, index, index + direction);
          saveState();
          render();
          return;
        }

        if (action === 'add-set') {
          const exercise = findExercise(slot, exerciseId);
          if (!exercise) return;
          const last = exercise.sets[exercise.sets.length - 1];
          exercise.sets.push(last ? { ...clone(last), id: uid('set') } : makeSet());
          saveState();
          render();
          return;
        }

        if (action === 'duplicate-set') {
          const exercise = findExercise(slot, exerciseId);
          const index = exercise?.sets.findIndex(set => set.id === setId) ?? -1;
          if (!exercise || index === -1) return;
          exercise.sets.splice(index + 1, 0, { ...clone(exercise.sets[index]), id: uid('set') });
          saveState();
          render();
          return;
        }

        if (action === 'delete-set') {
          const exercise = findExercise(slot, exerciseId);
          if (!exercise) return;
          if (exercise.sets.length <= 1 && !confirm('Это последний подход. Удалить его?')) return;
          exercise.sets = exercise.sets.filter(set => set.id !== setId);
          saveState();
          render();
          return;
        }

        if (action === 'move-set') {
          const exercise = findExercise(slot, exerciseId);
          if (!exercise) return;
          const index = exercise.sets.findIndex(set => set.id === setId);
          const direction = button.dataset.direction === 'up' ? -1 : 1;
          moveItem(exercise.sets, index, index + direction);
          saveState();
          render();
          return;
        }

        if (action === 'start-workout') {
          ensureSession(dateKey);
          ui.selectedDateKey = dateKey;
          ui.view = dateKey === todayKey() ? 'today' : 'day';
          saveState();
          render();
          return;
        }

        if (action === 'complete-workout') {
          const session = ensureSession(dateKey);
          const progress = sessionProgress(session);
          if (progress.doneSets === 0 && !confirm('Нет выполненных подходов. Всё равно завершить как пропуск/частичную запись?')) return;
          session.status = progress.doneSets >= progress.totalSets && progress.totalSets > 0 ? 'completed' : 'partial';
          session.completedAt = new Date().toISOString();
          if (session.startedAt) session.durationSec = Math.max(0, Math.round((new Date(session.completedAt) - new Date(session.startedAt)) / 1000));
          saveState();
          showToast(session.status === 'completed' ? 'Тренировка выполнена.' : 'Сохранено как частичная тренировка.');
          render();
          return;
        }

        if (action === 'skip-workout') {
          if (!confirm('Отметить тренировку как пропущенную?')) return;
          const session = ensureSession(dateKey);
          session.status = 'skipped';
          session.completedAt = new Date().toISOString();
          saveState();
          render();
          return;
        }

        if (action === 'undo-session') {
          const session = ensureSession(dateKey);
          session.status = 'in_progress';
          session.completedAt = null;
          saveState();
          render();
          return;
        }

        if (action === 'delete-session') {
          if (!confirm('Удалить запись тренировки за эту дату? Шаблон программы не изменится.')) return;
          delete state.sessionsByDateKey[dateKey];
          saveState();
          render();
          return;
        }

        if (action === 'mark-all') {
          const session = ensureSession(dateKey);
          const value = button.dataset.value === 'true';
          session.exercises.forEach(ex => ex.sets.forEach(set => { set.completed = value; }));
          saveState();
          render();
          return;
        }

        if (action === 'export-json') { exportJson(); return; }
        if (action === 'copy-json') { copyJson(); return; }
        if (action === 'pick-import-file') { document.getElementById('importFile')?.click(); return; }
        if (action === 'import-json') { importJsonFromText(); return; }
        if (action === 'restore-backup') { restoreBackup(); return; }
        if (action === 'load-sample') { loadSample(); return; }
        if (action === 'reset-app') { resetApp(); return; }
      }

      function handleFieldChange(input, { renderOnChange = false, immediateSave = true } = {}) {
        const field = input.dataset.field;
        if (!field) return;
        const slot = Number(input.dataset.slot);
        const exerciseId = input.dataset.exerciseId;
        const setId = input.dataset.setId;
        const dateKey = input.dataset.date;
        let shouldRender = false;

        if (field === 'day.title' || field === 'day.notes' || field === 'day.kind') {
          const day = getDayBySlot(slot);
          const prop = field.split('.')[1];
          day[prop] = input.value;
          if (field === 'day.kind' && input.value === 'workout' && !day.exercises.length) day.exercises.push(makeExercise('Новое упражнение', 3, 10));
          shouldRender = field === 'day.kind';
        }

        if (field.startsWith('exercise.')) {
          const exercise = findExercise(slot, exerciseId);
          if (!exercise) return;
          exercise[field.split('.')[1]] = input.value;
          shouldRender = field === 'exercise.category';
        }

        if (field.startsWith('templateSet.')) {
          const set = findSet(slot, exerciseId, setId);
          if (!set) return;
          const prop = field.split('.')[1];
          set[prop] = prop === 'notes' ? input.value : asNumber(input.value, null);
        }

        if (field === 'session.notes') {
          const session = ensureSession(dateKey);
          session.notes = input.value;
        }

        if (field.startsWith('sessionSet.')) {
          const session = ensureSession(dateKey);
          const ex = session.exercises[Number(input.dataset.exIndex)];
          const set = ex?.sets[Number(input.dataset.setIndex)];
          if (!set) return;
          const prop = field.split('.')[1];
          if (prop === 'completed') {
            set.completed = input.checked;
            if (set.completed) {
              set.actualReps = set.actualReps ?? set.targetReps;
              set.actualWeight = set.actualWeight ?? set.targetWeight;
              set.actualDurationMin = set.actualDurationMin ?? set.targetDurationMin;
              set.actualDistanceKm = set.actualDistanceKm ?? set.targetDistanceKm;
            }
            shouldRender = true;
          } else if (prop === 'notes') {
            set.notes = input.value;
          } else {
            set[prop] = asNumber(input.value, null);
          }
          if (session.status === 'completed' || session.status === 'partial' || session.status === 'skipped') {
            session.status = 'in_progress';
            session.completedAt = null;
          }
        }

        if (immediateSave) flushSave({ silent: true });
        else scheduleSave({ silent: true });
        if (shouldRender && renderOnChange) render();
      }

      async function exportJson() {
        state.meta.lastExportAt = new Date().toISOString();
        flushSave({ silent: true });
        render();
        const text = JSON.stringify(state, null, 2);
        const filename = `sport-week-backup-${todayKey()}.json`;
        const file = new File([text], filename, { type: 'application/json' });

        if (navigator.canShare?.({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: 'Sport Week Backup', text: 'Резервная копия спортивной программы' });
            showToast('JSON отправлен в системное меню iOS.');
            return;
          } catch (error) {
            if (error?.name === 'AbortError') return;
          }
        }

        try {
          const blob = new Blob([text], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = filename;
          link.rel = 'noopener';
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1500);
          showToast('JSON экспортирован. Если Safari не скачал файл — скопируйте текст ниже.');
        } catch (error) {
          selectExportBox();
          showToast('Скачивание недоступно. Выделил JSON — скопируйте вручную.');
        }
      }

      async function copyJson() {
        const text = JSON.stringify(state, null, 2);
        try {
          if (!navigator.clipboard?.writeText) throw new Error('Clipboard API недоступен');
          await navigator.clipboard.writeText(text);
          showToast('JSON скопирован в буфер.');
        } catch (error) {
          selectExportBox();
          showToast('Выделил JSON. Скопируйте вручную.');
        }
      }

      function selectExportBox() {
        const box = document.getElementById('exportBox');
        box?.focus();
        box?.select();
        box?.setSelectionRange?.(0, box.value.length);
      }

      function importJsonFromText(text) {
        const source = text ?? document.getElementById('importBox')?.value;
        if (!source?.trim()) { showToast('JSON для импорта пустой.'); return; }
        try {
          const imported = normalizeState(JSON.parse(source));
          if (!confirm('Импорт заменит текущую программу и историю. Продолжить?')) return;
          state = imported;
          saveState();
          ui.view = 'today';
          ui.selectedDateKey = todayKey();
          ui.editorSlot = slotIndexForDateKey(todayKey());
          showToast('Импорт завершён.');
          render();
        } catch (error) {
          showToast('Не удалось импортировать JSON. Проверьте файл.');
        }
      }

      function restoreBackup() {
        if (!storageAvailable) { showToast('Backup недоступен без localStorage.'); return; }
        const backup = localStorage.getItem(BACKUP_KEY);
        if (!backup) { showToast('Backup пока не найден.'); return; }
        if (!confirm('Восстановить предыдущую сохранённую версию? Текущее состояние станет backup.')) return;
        importJsonFromText(backup);
      }

      function loadSample() {
        if (!confirm('Загрузить примерную программу? Текущие данные будут заменены.')) return;
        state = defaultState();
        saveState();
        ui.view = 'today';
        ui.selectedDateKey = todayKey();
        ui.editorSlot = slotIndexForDateKey(todayKey());
        render();
      }

      function resetApp() {
        if (!confirm('Полностью сбросить приложение и удалить историю?')) return;
        if (storageAvailable) {
          localStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem(BACKUP_KEY);
        }
        state = defaultState();
        saveState();
        ui.view = 'today';
        ui.selectedDateKey = todayKey();
        ui.editorSlot = slotIndexForDateKey(todayKey());
        render();
      }

      function attachReorderHandlers() {
        const exerciseList = document.getElementById('exercise-editor-list');
        if (exerciseList) {
          enableReorder(exerciseList, '.exercise-editor-card', '.drag-handle', order => {
            const day = getDayBySlot(ui.editorSlot);
            const map = new Map(day.exercises.map(ex => [ex.id, ex]));
            day.exercises = order.map(id => map.get(id)).filter(Boolean);
            saveState({ silent: true });
            render();
          });
        }

        document.querySelectorAll('[data-set-list]').forEach(list => {
          enableReorder(list, '.set-editor-row', '.drag-handle', order => {
            const exercise = findExercise(ui.editorSlot, list.dataset.setList);
            if (!exercise) return;
            const map = new Map(exercise.sets.map(set => [set.id, set]));
            exercise.sets = order.map(id => map.get(id)).filter(Boolean);
            saveState({ silent: true });
            render();
          });
        });
      }

      function enableReorder(container, itemSelector, handleSelector, onOrder) {
        const handles = container.querySelectorAll(handleSelector);
        handles.forEach(handle => {
          handle.addEventListener('pointerdown', event => {
            if (event.button !== undefined && event.button !== 0) return;
            const item = event.target.closest(itemSelector);
            if (!item) return;
            event.preventDefault();
            let dragging = item;
            let rafId = null;
            const pointerId = event.pointerId;
            dragging.classList.add('is-dragging');
            document.body.classList.add('drag-active');
            handle.setPointerCapture?.(pointerId);

            const cleanup = ({ commit = true } = {}) => {
              window.removeEventListener('pointermove', onMove);
              window.removeEventListener('pointerup', onUp);
              window.removeEventListener('pointercancel', onCancel);
              handle.removeEventListener('lostpointercapture', onLostCapture);
              if (rafId) cancelAnimationFrame(rafId);
              if (!dragging) {
                document.body.classList.remove('drag-active');
                return;
              }
              dragging.classList.remove('is-dragging');
              document.body.classList.remove('drag-active');
              const order = Array.from(container.querySelectorAll(itemSelector)).map(node => node.dataset.id).filter(Boolean);
              dragging = null;
              if (commit) onOrder(order);
            };

            const onMove = moveEvent => {
              if (!dragging) return;
              moveEvent.preventDefault();
              const y = moveEvent.clientY;
              if (rafId) cancelAnimationFrame(rafId);
              rafId = requestAnimationFrame(() => {
                rafId = null;
                autoScrollDuringDrag(y);
                const afterElement = getDragAfterElement(container, y, itemSelector, dragging);
                if (afterElement == null) container.appendChild(dragging);
                else container.insertBefore(dragging, afterElement);
              });
            };

            const onUp = () => cleanup({ commit: true });
            const onCancel = () => cleanup({ commit: true });
            const onLostCapture = () => cleanup({ commit: true });

            window.addEventListener('pointermove', onMove, { passive: false });
            window.addEventListener('pointerup', onUp, { once: true });
            window.addEventListener('pointercancel', onCancel, { once: true });
            handle.addEventListener('lostpointercapture', onLostCapture, { once: true });
          });
        });
      }

      function autoScrollDuringDrag(clientY) {
        const margin = 72;
        const maxStep = 18;
        if (clientY < margin) {
          window.scrollBy({ top: -maxStep, behavior: 'auto' });
          return;
        }
        if (window.innerHeight - clientY < margin) {
          window.scrollBy({ top: maxStep, behavior: 'auto' });
        }
      }

      function getDragAfterElement(container, y, itemSelector, dragging) {
        const draggableElements = [...container.querySelectorAll(itemSelector)].filter(element => element !== dragging);
        return draggableElements.reduce((closest, child) => {
          const box = child.getBoundingClientRect();
          const offset = y - box.top - box.height / 2;
          if (offset < 0 && offset > closest.offset) return { offset, element: child };
          return closest;
        }, { offset: Number.NEGATIVE_INFINITY }).element;
      }

      document.addEventListener('click', event => {
        const actionTarget = event.target.closest('[data-action]');
        if (!actionTarget) return;
        event.preventDefault();
        handleAction(actionTarget);
      });

      document.addEventListener('keydown', event => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        const card = event.target.closest('[data-action="select-week-date"], [data-action="select-editor-slot"]');
        if (!card) return;
        event.preventDefault();
        handleAction(card);
      });

      document.addEventListener('change', event => {
        if (event.target.id === 'importFile') {
          const file = event.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => importJsonFromText(String(reader.result || ''));
          reader.readAsText(file);
          event.target.value = '';
          return;
        }
        handleFieldChange(event.target, { renderOnChange: true, immediateSave: true });
      });

      document.addEventListener('input', event => {
        const target = event.target;
        if (!target?.dataset?.field) return;
        if (target.type === 'checkbox' || target.tagName === 'SELECT') return;
        handleFieldChange(target, { renderOnChange: false, immediateSave: false });
      });

      window.addEventListener('pagehide', () => flushSave({ silent: true }));
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') flushSave({ silent: true });
      });

      window.addEventListener('resize', () => {
        clearTimeout(window.__sportResizeTimer);
        window.__sportResizeTimer = setTimeout(render, 150);
      });

      registerServiceWorker();
      state = loadState();
      saveState({ silent: true });
      render();
    })();
  </script>
</body>
</html>
