<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="🏆 Спорт">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="🏆 Спорт">
  <meta name="description" content="Спортивные недели, кнопки-подходы и статистика прогресса.">
  <link rel="manifest" href="manifest.webmanifest?v=1.0.6">
  <link rel="icon" href="icon.svg?v=1.0.6" type="image/svg+xml">
  <link rel="icon" href="icon-192.png?v=1.0.6" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icon-180.png?v=1.0.6">
  <title>🏆 Спорт</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080807;
      --bg-2: #11100e;
      --card: #181612;
      --card-strong: #201c16;
      --field: #211e18;
      --ink: #f7f0e8;
      --muted: #aaa094;
      --line: #393226;
      --soft: #201d17;
      --accent: #d89536;
      --accent-2: #efb156;
      --accent-ink: #fff6e4;
      --done: #86c58a;
      --danger: #df7969;
      --shadow: rgba(0, 0, 0, 0.46);
      --glow: rgba(216, 149, 54, 0.18);
      --overlay: rgba(0, 0, 0, 0.72);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 16px;
    }

    * { box-sizing: border-box; }

    * { -webkit-tap-highlight-color: transparent; }

    ::selection {
      background: color-mix(in srgb, var(--accent) 35%, transparent);
      color: var(--ink);
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 18% -10%, rgba(255, 45, 53, 0.2), transparent 32rem),
        radial-gradient(circle at 100% 6%, rgba(255, 106, 31, 0.12), transparent 24rem),
        linear-gradient(180deg, var(--bg-2), var(--bg));
      color: var(--ink);
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100dvh;
      padding: 6px 8px calc(112px + var(--safe-bottom));
    }

    button, textarea, input, select { font: inherit; }

    button, input, select, textarea { -webkit-appearance: none; appearance: none; }

    button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: color-mix(in srgb, var(--field) 88%, black);
      color: var(--ink);
      padding: 0 9px;
      font-weight: 500;
      letter-spacing: -0.01em;
      touch-action: manipulation;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset;
      user-select: none;
    }

    button:active { transform: scale(0.98); }

    @media (hover: hover) and (pointer: fine) {
      button:hover {
        border-color: color-mix(in srgb, var(--accent) 34%, var(--line));
        background: color-mix(in srgb, var(--field) 92%, var(--accent));
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18), 0 1px 0 rgba(255, 255, 255, 0.04) inset;
      }

      button.dark:hover {
        border-color: var(--accent-2);
        box-shadow: 0 9px 24px var(--glow);
      }

      button.danger:hover {
        border-color: color-mix(in srgb, var(--danger) 46%, var(--line));
        background: color-mix(in srgb, var(--field) 86%, var(--danger));
      }
    }
    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 36%, transparent);
      outline-offset: 2px;
    }
    button.dark {
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 88%, black), var(--accent-2));
      color: var(--accent-ink);
      border-color: color-mix(in srgb, var(--accent) 60%, transparent);
      box-shadow: 0 7px 18px var(--glow);
    }
    button.danger { color: var(--danger); }
    button.small { min-height: 28px; padding: 0 8px; font-size: 0.8rem; }
    button.ghost { background: color-mix(in srgb, var(--soft) 78%, black); }

    select {
      padding-right: 30px;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position:
        calc(100% - 15px) 52%,
        calc(100% - 10px) 52%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }

    input, textarea, select {
      border: 1px solid var(--line);
      outline: 0;
      background: var(--field);
      color: var(--ink);
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
    }

    .app {
      width: min(100%, 760px);
      margin: 0 auto;
      display: grid;
      gap: 6px;
    }

    .week-days {
      display: grid;
      gap: 6px;
    }

    .top {
      position: sticky;
      top: 0;
      z-index: 10;
      margin: -8px -8px 0;
      padding: calc(7px + env(safe-area-inset-top, 0px)) 8px 7px;
      background:
        radial-gradient(circle at 50% -30%, var(--glow), transparent 24rem),
        linear-gradient(180deg, color-mix(in srgb, var(--bg-2) 97%, transparent), color-mix(in srgb, var(--bg-2) 82%, transparent));
      backdrop-filter: blur(20px) saturate(1.2);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
      border-bottom: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
    }

    .top-inner,
    .bottom-inner,
    .bottom-week {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    .top-inner {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 8px;
    }

    .title-row,
    .top-actions,
    .week-row,
    .day-toggle,
    .exercise-head,
    .toolbar,
    .stat-head,
    .stat-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .top-actions { justify-content: flex-end; }

    h1, h2, h3, p { margin: 0; }
    h1 {
      color: var(--muted);
      font-size: 0.82rem;
      letter-spacing: 0.02em;
      font-weight: 500;
      text-transform: uppercase;
    }
    h2 { font-size: 1rem; letter-spacing: -0.02em; font-weight: 600; }
    h3 { font-size: 0.96rem; letter-spacing: -0.02em; font-weight: 600; }

    .top-title {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .top-subtitle {
      color: var(--accent-ink);
      font-size: clamp(1.3rem, 6.6vw, 2.1rem);
      line-height: 0.98;
      letter-spacing: -0.055em;
      font-weight: 550;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 18px var(--glow);
    }

    .muted { color: var(--muted); }
    .tiny { font-size: 0.82rem; line-height: 1.35; }

    .timer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 152px;
      padding: 8px 10px;
      border-radius: 16px;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--card-strong) 88%, var(--accent)), var(--card));
      border: 1px solid color-mix(in srgb, var(--accent) 18%, var(--line));
      box-shadow: 0 7px 20px rgba(0, 0, 0, 0.2), 0 1px 0 rgba(255, 255, 255, 0.04) inset;
    }

    .timer-bar span {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 500;
    }

    .timer-bar strong {
      font-size: 1.28rem;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      text-shadow: 0 0 16px var(--glow);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 8px;
      background: var(--soft);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 500;
      white-space: nowrap;
    }

    .pill.done { background: color-mix(in srgb, var(--done) 17%, var(--card)); color: var(--done); }

    .card {
      border: 1px solid color-mix(in srgb, var(--line) 92%, white);
      border-radius: 18px;
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--card) 92%, white), var(--card));
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22), 0 1px 0 rgba(255, 255, 255, 0.035) inset;
    }

    .day {
      display: grid;
    }

    .day.current {
      border-color: color-mix(in srgb, var(--accent) 72%, var(--line));
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.32), 0 0 0 1px color-mix(in srgb, var(--accent) 22%, transparent) inset;
    }

    .day-toggle {
      width: 100%;
      min-height: 64px;
      padding: 14px;
      border: 0;
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: transparent;
      text-align: left;
    }

    .day-toggle:active { transform: none; }

    .day-title {
      flex: 1 1 auto;
      min-width: 0;
      display: grid;
      gap: 4px;
    }

    .day-toggle h2 {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .day-meta {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 500;
    }

    .day-toggle .chevron {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: color-mix(in srgb, var(--accent) 12%, var(--soft));
      color: var(--accent-ink);
      font-size: 0.95rem;
      transition: transform 0.16s ease, background 0.16s ease;
    }
    .day.open .chevron { transform: rotate(180deg); background: linear-gradient(135deg, var(--accent), var(--accent-2)); }

    .day-body {
      display: grid;
      gap: 10px;
      padding: 0 14px 14px;
      border-top: 1px solid var(--line);
    }

    .day-body-top {
      display: grid;
      gap: 8px;
      padding-top: 12px;
    }

    .progress {
      height: 8px;
      border-radius: 999px;
      background: var(--soft);
      overflow: hidden;
    }

    .progress > i {
      display: block;
      height: 100%;
      width: var(--value, 0%);
      background: linear-gradient(90deg, var(--done), color-mix(in srgb, var(--done) 68%, var(--accent)));
      border-radius: inherit;
      box-shadow: 0 0 16px color-mix(in srgb, var(--done) 34%, transparent);
      transition: width 0.22s ease;
    }

    .exercises {
      display: grid;
      gap: 10px;
    }

    .exercise {
      display: grid;
      gap: 10px;
      padding: 11px;
      border-radius: 18px;
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--field) 84%, white), color-mix(in srgb, var(--field) 72%, var(--soft)));
      border: 1px solid color-mix(in srgb, var(--line) 86%, white);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.16);
    }

    .exercise.done { background: linear-gradient(180deg, color-mix(in srgb, var(--done) 16%, var(--card)), color-mix(in srgb, var(--done) 10%, var(--card))); border-color: color-mix(in srgb, var(--done) 42%, var(--line)); }

    .exercise-name {
      flex: 1 1 160px;
      min-width: 0;
      min-height: 44px;
      border: 0;
      border-bottom: 1px solid color-mix(in srgb, var(--line) 78%, transparent);
      border-radius: 0;
      background: transparent;
      padding: 0 2px;
      font-weight: 500;
      letter-spacing: -0.015em;
      box-shadow: none;
    }

    .exercise-name:focus {
      border-color: var(--accent);
      box-shadow: none;
    }

    .unit-select {
      min-height: 44px;
      border: 0;
      border-bottom: 1px solid color-mix(in srgb, var(--line) 78%, transparent);
      border-radius: 0;
      background-color: transparent;
      padding: 0 26px 0 2px;
      font-weight: 500;
      box-shadow: none;
    }

    .unit-select:focus {
      border-color: var(--accent);
      box-shadow: none;
    }

    .exercise-head .remove-exercise {
      min-height: 44px;
      align-self: stretch;
      border-radius: 14px;
    }

    .set-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .set-item {
      display: inline-grid;
      grid-template-columns: auto;
      gap: 6px;
      align-items: center;
      padding: 0;
      border-radius: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .set-item.timed {
      grid-template-columns: auto auto auto;
    }

    .set {
      min-width: 52px;
      min-height: 40px;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--line) 84%, white);
      background: linear-gradient(180deg, color-mix(in srgb, var(--field) 92%, white), var(--field));
      color: var(--ink);
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .set.done {
      background: var(--done);
      color: #fff;
      border-color: var(--done);
      box-shadow: 0 5px 16px color-mix(in srgb, var(--done) 38%, transparent);
    }

    .empty {
      padding: 10px 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .toolbar { justify-content: flex-start; }

    .add-exercise,
    .make-training {
      width: 100%;
      background: var(--field);
    }

    .bottom-tabs {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      display: grid;
      gap: 8px;
      padding: 10px 12px calc(10px + var(--safe-bottom));
      background:
        radial-gradient(circle at 50% 0, rgba(243, 201, 105, 0.11), transparent 18rem),
        color-mix(in srgb, var(--bg) 94%, transparent);
      backdrop-filter: blur(18px) saturate(1.16);
      -webkit-backdrop-filter: blur(18px) saturate(1.16);
      border-top: 1px solid color-mix(in srgb, var(--line) 90%, transparent);
      box-shadow: 0 -18px 44px rgba(0, 0, 0, 0.36);
    }

    .bottom-week {
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr) 46px;
      gap: 8px;
      align-items: center;
    }

    .bottom-week .pill {
      justify-content: center;
      min-height: 42px;
    }

    .bottom-inner {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .bottom-tabs button {
      min-height: 46px;
      font-size: 1rem;
    }

    .summary {
      display: grid;
      gap: 14px;
    }

    .summary-hero,
    .metric-card,
    .chart-card,
    .empty-hero {
      position: relative;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--line) 82%, var(--accent));
      background:
        radial-gradient(circle at 12% 0, color-mix(in srgb, var(--accent) 20%, transparent), transparent 13rem),
        linear-gradient(180deg, color-mix(in srgb, var(--card-strong) 88%, white), var(--card));
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.28), 0 1px 0 rgba(255, 255, 255, 0.04) inset;
    }

    .summary-hero {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 16px;
      align-items: center;
      min-height: 186px;
      padding: 16px;
      border-radius: 28px;
    }

    .activity-ring {
      --value: 0;
      width: 138px;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      padding: 12px;
      background:
        conic-gradient(var(--done) calc(var(--value) * 1%), color-mix(in srgb, var(--line) 68%, black) 0),
        radial-gradient(circle, color-mix(in srgb, var(--accent) 24%, transparent), transparent 64%);
      box-shadow: 0 0 34px color-mix(in srgb, var(--done) 20%, transparent);
    }

    .ring-core {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 2px;
      background: linear-gradient(180deg, var(--card), var(--bg));
      border: 1px solid color-mix(in srgb, var(--line) 70%, white);
    }

    .ring-core strong {
      font-size: 2rem;
      letter-spacing: -0.06em;
      font-variant-numeric: tabular-nums;
    }

    .ring-core span,
    .chart-label,
    .bar-note {
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .summary-hero-copy {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .impact-number {
      display: block;
      color: var(--accent-ink);
      font-size: clamp(2.25rem, 13vw, 4.6rem);
      line-height: 0.92;
      letter-spacing: -0.08em;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 28px var(--glow);
    }

    .hero-caption {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .metric-card {
      display: grid;
      gap: 10px;
      min-height: 118px;
      padding: 13px;
      border-radius: 22px;
    }

    .metric-card strong {
      font-size: 1.85rem;
      letter-spacing: -0.06em;
      line-height: 0.98;
      font-variant-numeric: tabular-nums;
    }

    .metric-meter,
    .rank-meter,
    .unit-meter {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: color-mix(in srgb, var(--line) 70%, black);
    }

    .metric-meter i,
    .rank-meter i,
    .unit-meter i {
      display: block;
      width: var(--value, 0%);
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--done));
      box-shadow: 0 0 18px var(--glow);
      transition: width 0.22s ease;
    }

    .chart-grid {
      display: grid;
      gap: 12px;
    }

    .chart-card,
    .empty-hero {
      display: grid;
      gap: 14px;
      padding: 14px;
      border-radius: 24px;
    }

    .chart-card.wide { min-height: 220px; }

    .chart-title {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 10px;
    }

    .month-bars {
      min-height: 156px;
      display: flex;
      align-items: end;
      gap: 8px;
      padding: 8px 2px 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .month-bar {
      flex: 1 0 42px;
      min-width: 42px;
      height: 148px;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 7px;
      align-items: end;
    }

    .month-bar i {
      width: 100%;
      min-height: 8px;
      height: var(--value, 0%);
      border-radius: 999px 999px 7px 7px;
      background: linear-gradient(180deg, var(--accent-2), var(--accent));
      box-shadow: 0 0 20px var(--glow);
      transition: height 0.22s ease;
    }

    .month-bar b,
    .weekday-bar b {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 500;
      text-align: center;
      white-space: nowrap;
    }

    .rank-list,
    .unit-list {
      display: grid;
      gap: 10px;
    }

    .rank-row,
    .unit-row {
      display: grid;
      gap: 7px;
    }

    .rank-top,
    .unit-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
    }

    .rank-top strong,
    .unit-top strong {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rank-top span,
    .unit-top span {
      color: var(--muted);
      font-weight: 500;
      font-size: 0.86rem;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .weekday-bars {
      min-height: 136px;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 7px;
      align-items: end;
    }

    .weekday-bar {
      height: 128px;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 7px;
      align-items: end;
    }

    .weekday-bar i {
      width: 100%;
      min-height: 8px;
      height: var(--value, 0%);
      border-radius: 999px 999px 7px 7px;
      background: linear-gradient(180deg, var(--done), color-mix(in srgb, var(--done) 48%, var(--accent)));
      opacity: var(--alpha, 1);
      transition: height 0.22s ease, opacity 0.22s ease;
    }

    .empty-hero {
      min-height: 220px;
      place-items: center;
      text-align: center;
    }

    .sheet {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 40;
      background: var(--overlay);
      padding: 16px 16px calc(16px + var(--safe-bottom));
      align-items: end;
    }

    .sheet.show { display: grid; }

    .sheet-card {
      width: min(100%, 760px);
      max-height: min(76dvh, 620px);
      margin: 0 auto;
      border-radius: 24px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--card) 92%, white), var(--card));
      border: 1px solid var(--line);
      padding: 14px;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 10px;
      box-shadow: 0 18px 60px rgba(0,0,0,0.42);
    }

    .json-box {
      width: 100%;
      min-height: 220px;
      max-height: 100%;
      border-radius: 14px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.78rem;
      line-height: 1.45;
      white-space: pre;
      resize: vertical;
      overflow: auto;
    }

    .toast {
      position: fixed;
      left: 14px;
      right: 14px;
      bottom: calc(142px + var(--safe-bottom));
      z-index: 50;
      padding: 12px 14px;
      border-radius: 16px;
      background: var(--accent);
      color: var(--accent-ink);
      opacity: 0;
      transform: translateY(14px);
      pointer-events: none;
      transition: 0.18s ease;
      text-align: center;
      font-weight: 600;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    @supports not (color: color-mix(in srgb, white, black)) {
      .top, .bottom-tabs { background: var(--bg); }
      .exercise { background: var(--soft); }
    }

    @media (max-width: 520px) {
      .top-inner {
        grid-template-columns: 1fr;
        align-items: stretch;
      }

      .timer-bar {
        min-width: 0;
      }
    }

    @media (max-width: 420px) {
      body { padding-inline: 6px; }
      h1 { font-size: 0.78rem; }
      .top { margin-inline: -6px; padding-inline: 6px; }
      .top-subtitle { font-size: clamp(1.22rem, 8vw, 1.72rem); }
      .top-actions button { min-height: 38px; padding-inline: 12px; }
      .day-toggle { padding: 13px 12px; }
      .day-body { padding-inline: 12px; }
      .exercise { padding: 10px; border-radius: 16px; }
      .exercise-head { display: grid; grid-template-columns: 1fr auto; }
      .exercise-name { grid-column: 1 / -1; width: 100%; }
      .unit-select { min-width: 0; }
      .exercise-head .remove-exercise { min-height: 44px; }
      .toolbar button { flex: 1 1 120px; min-height: 38px; }
      .set-row { display: grid; grid-template-columns: 1fr; }
      .set-item { display: grid; grid-template-columns: 1fr; width: 100%; border-radius: 0; }
      .set-item.timed { grid-template-columns: minmax(44px, auto) 1fr minmax(44px, auto); }
      .set { width: 100%; min-height: 44px; }
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .summary-hero { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 12px; }
      .summary-hero-copy { justify-items: center; }
      .hero-caption { justify-content: center; }
      .activity-ring { width: 116px; }
    }

    @media (max-width: 340px) {
      .bottom-tabs { padding-inline: 8px; }
      .bottom-inner,
      .bottom-week { gap: 6px; }
      .bottom-week { grid-template-columns: 42px minmax(0, 1fr) 42px; }
      .bottom-tabs button { font-size: 0.9rem; padding-inline: 6px; }
      .bottom-inner { grid-template-columns: 1fr; }
      .bottom-tabs button { min-height: 42px; }
      .summary-grid { grid-template-columns: 1fr; }
    }

    @media (min-width: 720px) {
      body { padding-top: 18px; }
      .day-body { padding: 0 16px 16px; }
      .week-days { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .day.open { grid-column: 1 / -1; }
      .summary-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .chart-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .chart-card.wide { grid-column: 1 / -1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main id="app" class="app"></main>
  <div id="sheet" class="sheet" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'sport-notes.state.v5';
      const OLD_KEYS = ['sport-notes.state.v4', 'sport-notes.state.v3', 'sport-notes.state.v2'];
      const OLD_KEY = 'sport-week-planner.state.v1';
      const SHORT = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
      let state;
      let view = 'week';
      let weekOffset = 0;
      let openDateKey = todayKey();
      let saveTimer = null;
      let toastTimer = null;
      let timerStartedAt = null;
      let timerInterval = null;
      let longPressTimer = null;
      let longPressTarget = null;
      let longPressStartX = 0;
      let longPressStartY = 0;
      let ignoreNextClick = false;

      function uid() {
        return `${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
      }

      function todayKey() {
        return toDateKey(new Date());
      }

      function toDateKey(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
      }

      function parseDateKey(key) {
        const [y, m, d] = String(key).split('-').map(Number);
        return new Date(y, m - 1, d);
      }

      function addDays(date, days) {
        const copy = new Date(date);
        copy.setDate(copy.getDate() + days);
        return copy;
      }

      function startOfWeek(date = new Date()) {
        const copy = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        const diff = (copy.getDay() + 6) % 7;
        copy.setDate(copy.getDate() - diff);
        return copy;
      }

      function weekStartKeyForDate(dateKey) {
        return toDateKey(startOfWeek(parseDateKey(dateKey)));
      }

      function weekStartKeyForOffset(offset = 0) {
        const start = startOfWeek(new Date());
        start.setDate(start.getDate() + offset * 7);
        return toDateKey(start);
      }

      function weekDates(startKey) {
        const start = parseDateKey(startKey);
        return Array.from({ length: 7 }, (_, i) => toDateKey(addDays(start, i)));
      }

      function slotForDate(dateKey) {
        return (parseDateKey(dateKey).getDay() + 6) % 7;
      }

      function formatDate(dateKey, long = false) {
        return new Intl.DateTimeFormat('ru-RU', long ? { day: 'numeric', month: 'long' } : { day: 'numeric', month: 'short' }).format(parseDateKey(dateKey));
      }

      function formatCompactDate(dateKey) {
        const date = parseDateKey(dateKey);
        return `${String(date.getDate()).padStart(2, '0')}.${String(date.getMonth() + 1).padStart(2, '0')}`;
      }

      function formatWeekRange(startKey) {
        const dates = weekDates(startKey);
        return `${formatCompactDate(dates[0])}-${formatCompactDate(dates[6])}`;
      }

      function formatMonth(date) {
        return new Intl.DateTimeFormat('ru-RU', { month: 'long', year: 'numeric' }).format(date);
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function clamp(value, min, max) {
        const number = Number(value);
        if (!Number.isFinite(number)) return min;
        return Math.min(max, Math.max(min, number));
      }

      function plural(value, forms) {
        const number = Math.abs(Math.trunc(Number(value) || 0));
        const mod10 = number % 10;
        const mod100 = number % 100;
        if (mod10 === 1 && mod100 !== 11) return forms[0];
        if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return forms[1];
        return forms[2];
      }

      function formatCount(value, forms) {
        return `${formatNumber(value)} ${plural(value, forms)}`;
      }

      function formatDurationShort(value) {
        const total = Math.max(0, Math.round(Number(value) || 0));
        const hours = Math.floor(total / 3600);
        const minutes = Math.floor((total % 3600) / 60);
        const seconds = total % 60;
        if (hours) {
          return `${formatCount(hours, ['час', 'часа', 'часов'])}${minutes ? ` ${formatCount(minutes, ['минута', 'минуты', 'минут'])}` : ''}`;
        }
        if (minutes) {
          return `${formatCount(minutes, ['минута', 'минуты', 'минут'])}${seconds ? ` ${formatCount(seconds, ['секунда', 'секунды', 'секунд'])}` : ''}`;
        }
        return formatCount(seconds, ['секунда', 'секунды', 'секунд']);
      }

      function emptyDay() {
        return { active: false, exercises: [] };
      }

      function emptyWeekDays() {
        return Array.from({ length: 7 }, emptyDay);
      }

      function defaultState() {
        const startKey = weekStartKeyForDate(todayKey());
        return {
          version: 5,
          id: uid(),
          theme: 'dark',
          weeks: { [startKey]: makeWeek(emptyWeekDays()) },
          sessions: {},
          updatedAt: new Date().toISOString()
        };
      }

      function loadState() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) return normalize(JSON.parse(saved));
        } catch (_) {}

        for (const key of OLD_KEYS) {
          try {
            const saved = localStorage.getItem(key);
            if (saved) return normalize(JSON.parse(saved));
          } catch (_) {}
        }

        const migrated = migrateOldState();
        if (migrated) return migrated;

        return defaultState();
      }

      function normalize(raw) {
        const fallback = defaultState();
        const next = raw && typeof raw === 'object' ? raw : fallback;
        const currentWeek = weekStartKeyForDate(todayKey());
        const weeks = cleanWeeks(next.weeks);

        if (!Object.keys(weeks).length) {
          weeks[currentWeek] = makeWeek(next.days || emptyWeekDays());
        }

        return {
          version: 5,
          id: next.id || uid(),
          theme: 'dark',
          weeks,
          sessions: cleanSessions(next.sessions),
          updatedAt: next.updatedAt || new Date().toISOString()
        };
      }

      function cleanWeeks(rawWeeks) {
        const weeks = {};
        if (!rawWeeks || typeof rawWeeks !== 'object' || Array.isArray(rawWeeks)) return weeks;
        Object.entries(rawWeeks).forEach(([startKey, week]) => {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(startKey)) return;
          weeks[startKey] = makeWeek(week?.days || emptyWeekDays());
          weeks[startKey].createdAt = week?.createdAt || weeks[startKey].createdAt;
          weeks[startKey].updatedAt = week?.updatedAt || weeks[startKey].updatedAt;
        });
        return weeks;
      }

      function makeWeek(days) {
        return {
          days: cleanDays(days),
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
      }

      function cleanDays(days) {
        const next = Array.isArray(days) ? days.slice(0, 7) : [];
        while (next.length < 7) next.push(emptyDay());
        return next.map(cleanDay);
      }

      function cleanDay(day) {
        if (typeof day === 'string') {
          const exercises = textToExercises(day);
          return { active: exercises.length > 0, exercises };
        }
        if (!day || typeof day !== 'object') return emptyDay();
        const exercises = (Array.isArray(day.exercises) ? day.exercises : []).map(cleanExercise).filter(Boolean);
        const active = typeof day.active === 'boolean' ? day.active : exercises.length > 0;
        return { active, exercises };
      }

      function cleanExercise(exercise) {
        if (typeof exercise === 'string') return parseLineToExercise(exercise);
        if (!exercise || typeof exercise !== 'object') return null;
        const name = String(exercise.name ?? '').trim();
        let unit = exercise.unit === 'seconds' ? 'seconds' : exercise.unit === 'reps' ? 'reps' : inferUnit(name, exercise.sets);
        let sets = Array.isArray(exercise.sets) ? exercise.sets : [];
        sets = sets.map(value => normalizeSetLabel(value, unit)).filter(Boolean);
        if (!sets.length) sets = [defaultSetValue(unit, name)];
        if (isPlankName(name)) {
          unit = 'seconds';
          sets = [sets[0] || '90'];
        }
        return { name, unit, sets };
      }

      function textToExercises(text) {
        return String(text || '')
          .split('\n')
          .map(line => line.trim())
          .filter(Boolean)
          .map(parseLineToExercise);
      }

      function parseLineToExercise(line) {
        const match = String(line).match(/^(.*?)(?:\s+[—–-]\s+)(.+)$/);
        const name = (match ? match[1] : line).trim();
        const tail = (match ? match[2] : '').trim();
        let unit = inferUnit(name, tail ? [tail] : []);
        let sets = tail ? splitSets(tail).map(value => normalizeSetLabel(value, unit)).filter(Boolean) : [defaultSetValue(unit, name)];
        if (isPlankName(name)) {
          unit = 'seconds';
          sets = [sets[0] || '90'];
        }
        return { name, unit, sets: sets.length ? sets : [defaultSetValue(unit, name)] };
      }

      function splitSets(tail) {
        if (!tail) return ['10'];
        const normalized = tail.replace(/[–—]/g, '-');
        if (!normalized.includes('-')) return [tail.trim()];
        const parts = normalized.split('-').map(v => v.trim()).filter(Boolean);
        if (!parts.length) return [tail.trim()];
        const suffix = tail.match(/\s(сек|с|мин|км|м)$/i)?.[1];
        return parts.map((part, index) => {
          if (index === parts.length - 1 || !suffix || /[а-яa-z]/i.test(part)) return part;
          return `${part} ${suffix}`;
        });
      }

      function inferUnit(name, sets) {
        const text = `${name || ''} ${Array.isArray(sets) ? sets.map(value => typeof value === 'object' ? value.label ?? value.value ?? '' : value).join(' ') : sets || ''}`.toLowerCase();
        if (/планк|вис|статика|сек|\bс\b|мин/.test(text)) return 'seconds';
        return 'reps';
      }

      function normalizeSetLabel(value, unit) {
        const raw = value && typeof value === 'object' ? value.label ?? value.value ?? '' : value;
        const text = String(raw ?? '').trim().replace(',', '.');
        const match = text.match(/\d+(?:\.\d+)?\+?/);
        if (match) return match[0];
        return defaultSetValue(unit, '');
      }

      function defaultSetValue(unit, name) {
        if (unit === 'seconds') return isPlankName(name) ? '90' : '30';
        return '10';
      }

      function isPlankName(name) {
        return /планк/i.test(String(name || ''));
      }

      function isSingleSecondExercise(exercise) {
        return exercise?.unit === 'seconds' && isPlankName(exercise.name);
      }

      function cleanSessions(rawSessions) {
        const sessions = {};
        if (!rawSessions || typeof rawSessions !== 'object' || Array.isArray(rawSessions)) return sessions;
        Object.entries(rawSessions).forEach(([dateKey, session]) => {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(dateKey)) return;
          const done = {};
          const rawDone = session?.done && typeof session.done === 'object' ? session.done : {};
          Object.entries(rawDone).forEach(([key, value]) => {
            if (!/^\d+:\d+$/.test(key) || !value) return;
            done[key] = typeof value === 'object' ? value : true;
          });
          if (Object.keys(done).length) {
            sessions[dateKey] = { done, updatedAt: session?.updatedAt || new Date().toISOString() };
          }
        });
        return sessions;
      }

      function migrateOldState() {
        try {
          const saved = localStorage.getItem(OLD_KEY);
          if (!saved) return null;
          const old = JSON.parse(saved);
          const days = cleanDays(old?.program?.days?.map(oldDayToText));
          const sessions = {};
          Object.entries(old?.sessionsByDateKey || {}).forEach(([dateKey, session]) => {
            const done = {};
            (session?.exercises || []).forEach((ex, exIndex) => {
              (ex?.sets || []).forEach((set, setIndex) => {
                if (set?.completed) {
                  const label = oldSetLabel(set);
                  const unit = /сек|мин/.test(label) ? 'seconds' : 'reps';
                  done[`${exIndex}:${setIndex}`] = makeDonePayload({ name: ex?.name || 'Упражнение', unit }, label);
                }
              });
            });
            if (Object.keys(done).length) sessions[dateKey] = { done, updatedAt: new Date().toISOString() };
          });
          return normalize({ days, sessions });
        } catch (_) {
          return null;
        }
      }

      function oldDayToText(day) {
        if (!day || day.kind !== 'workout') return '';
        return (day.exercises || []).map(ex => {
          const sets = (ex.sets || []).map(oldSetLabel).join('-');
          return `${ex.name || 'Упражнение'}${sets ? ` — ${sets}` : ''}`;
        }).join('\n');
      }

      function oldSetLabel(set) {
        if (set?.targetReps !== null && set?.targetReps !== undefined) return String(set.targetReps);
        if (set?.targetDurationMin !== null && set?.targetDurationMin !== undefined) return `${set.targetDurationMin * 60} сек`;
        if (set?.targetDistanceKm !== null && set?.targetDistanceKm !== undefined) return `${set.targetDistanceKm} км`;
        return '10';
      }

      function applyTheme() {
        document.documentElement.dataset.theme = 'dark';
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#0f0f0e');
      }

      function saveNow() {
        state.updatedAt = new Date().toISOString();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function scheduleSave() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(saveNow, 180);
      }

      function flushSave() {
        clearTimeout(saveTimer);
        saveTimer = null;
        saveNow();
      }

      function getWeek(startKey) {
        if (!state.weeks[startKey]) {
          state.weeks[startKey] = makeWeek(emptyWeekDays());
          scheduleSave();
        }
        return state.weeks[startKey];
      }

      function getExistingWeek(startKey) {
        return state.weeks[startKey] || null;
      }

      function getDay(dateKey) {
        const week = getWeek(weekStartKeyForDate(dateKey));
        const slot = slotForDate(dateKey);
        if (!week.days[slot]) week.days[slot] = emptyDay();
        return week.days[slot];
      }

      function getSession(dateKey) {
        if (!state.sessions[dateKey]) state.sessions[dateKey] = { done: {}, updatedAt: new Date().toISOString() };
        if (!state.sessions[dateKey].done) state.sessions[dateKey].done = {};
        return state.sessions[dateKey];
      }

      function readSession(dateKey) {
        return state.sessions[dateKey] || { done: {} };
      }

      function dayProgress(dateKey) {
        const day = getDay(dateKey);
        if (!day.active && !day.exercises.length) return { total: 0, checked: 0, percent: 0 };
        const done = readSession(dateKey).done;
        let total = 0;
        let checked = 0;
        day.exercises.forEach((ex, exIndex) => ex.sets.forEach((_, setIndex) => {
          total += 1;
          if (done[`${exIndex}:${setIndex}`]) checked += 1;
        }));
        return { total, checked, percent: total ? Math.round((checked / total) * 100) : 0 };
      }

      function isDayComplete(dateKey) {
        const progress = dayProgress(dateKey);
        return progress.total > 0 && progress.checked === progress.total;
      }

      function timerSeconds() {
        return timerStartedAt ? Math.floor((Date.now() - timerStartedAt) / 1000) : 0;
      }

      function formatTimer(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }

      function updateTimerDisplay() {
        const node = document.getElementById('timerDisplay');
        if (node) node.textContent = formatTimer(timerSeconds());
      }

      function startTimer() {
        timerStartedAt = Date.now();
        clearInterval(timerInterval);
        timerInterval = setInterval(updateTimerDisplay, 1000);
        updateTimerDisplay();
      }

      function stopTimer() {
        timerStartedAt = null;
        clearInterval(timerInterval);
        timerInterval = null;
        updateTimerDisplay();
      }

      function render() {
        if (view === 'summary') renderSummary();
        else renderWeek();
        updateTimerDisplay();
      }

      function renderTop(title, subtitle) {
        return `
          <header class="top">
            <div class="top-inner">
              <div class="top-title">
                <h1>${escapeHtml(title)}</h1>
                <strong class="top-subtitle">${escapeHtml(subtitle)}</strong>
              </div>
              <div class="timer-bar" aria-live="polite">
                <span>Секундомер</span>
                <strong id="timerDisplay">${formatTimer(timerSeconds())}</strong>
              </div>
            </div>
          </header>
        `;
      }

      function renderBottomNav() {
        const tabs = `
          <div class="bottom-inner">
            <button class="${view === 'week' ? 'dark' : ''}" data-action="view-week" type="button" aria-current="${view === 'week' ? 'page' : 'false'}">Неделя</button>
            <button class="${view === 'summary' ? 'dark' : ''}" data-action="view-summary" type="button" aria-current="${view === 'summary' ? 'page' : 'false'}">Статистика</button>
            <button data-action="data" type="button" aria-haspopup="dialog">Настройки</button>
          </div>
        `;

        if (view === 'summary') {
          return `
            <nav class="bottom-tabs" aria-label="Разделы">
              ${tabs}
            </nav>
          `;
        }

        return `
          <nav class="bottom-tabs" aria-label="Неделя и разделы">
            <div class="bottom-week">
              <button data-action="prev" type="button" aria-label="Предыдущая неделя">←</button>
              <span class="pill" aria-live="polite">${escapeHtml(formatWeekRange(weekStartKeyForOffset(weekOffset)))}</span>
              <button data-action="next" type="button" aria-label="Следующая неделя">→</button>
            </div>
            ${tabs}
          </nav>
        `;
      }

      function renderWeek() {
        const weekKey = weekStartKeyForOffset(weekOffset);
        const week = getWeek(weekKey);
        const dates = weekDates(weekKey);
        const start = dates[0];
        const end = dates[6];

        if (!dates.includes(openDateKey)) {
          openDateKey = weekOffset === 0 && dates.includes(todayKey()) ? todayKey() : dates[6];
        }
        const visibleDates = [...dates].reverse();

        document.getElementById('app').innerHTML = `
          ${renderTop('🏆 Спорт', `${formatDate(start)} — ${formatDate(end)}`)}
          <section class="week-days">
            ${visibleDates.map(dateKey => renderDay(dateKey, week)).join('')}
          </section>
          ${renderBottomNav()}
        `;
      }

      function renderDay(dateKey, week) {
        const slot = slotForDate(dateKey);
        const day = week.days[slot] || emptyDay();
        const progress = dayProgress(dateKey);
        const isCurrent = dateKey === todayKey();
        const isOpen = dateKey === openDateKey;
        const complete = progress.total && progress.checked === progress.total;
        return `
          <article class="card day ${isCurrent ? 'current' : ''} ${isOpen ? 'open' : 'collapsed'}" data-date="${dateKey}" data-slot="${slot}">
            <button class="day-toggle" data-action="open-day" data-date="${dateKey}" type="button" aria-expanded="${isOpen ? 'true' : 'false'}">
              <span class="day-title">
                <h2>${SHORT[slot]} · ${formatDate(dateKey, true)}</h2>
                <span class="day-meta">${progress.checked}/${progress.total || 0} подходов${complete ? ' · готово' : ''}</span>
              </span>
              <span class="chevron" aria-hidden="true">⌄</span>
            </button>
            ${isOpen ? `
              <div class="day-body">
                ${day.active ? `
                  <div class="day-body-top">
                    <div class="progress" role="progressbar" aria-label="Прогресс дня" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progress.percent}"><i style="--value:${progress.percent}%"></i></div>
                    ${complete ? '<div class="title-row"><span class="pill done">готово</span></div>' : ''}
                  </div>
                  ${day.exercises.length ? `<div class="exercises">${day.exercises.map((ex, exIndex) => renderExercise(dateKey, ex, exIndex)).join('')}</div>` : ''}
                  <button class="add-exercise" data-action="add-exercise" data-date="${dateKey}" type="button">+ упражнение</button>
                  <button class="danger" data-action="set-day-active" data-active="false" data-date="${dateKey}" type="button">Убрать тренировочный день</button>
                ` : `
                  <div class="empty">В этот день нет тренировки.</div>
                  <button class="make-training dark" data-action="set-day-active" data-active="true" data-date="${dateKey}" type="button">Сделать тренировочным</button>
                `}
              </div>
            ` : ''}
          </article>
        `;
      }

      function renderExercise(dateKey, exercise, exIndex) {
        const session = readSession(dateKey);
        const oneSet = isSingleSecondExercise(exercise);
        const allDone = exercise.sets.length > 0 && exercise.sets.every((_, setIndex) => session.done[`${exIndex}:${setIndex}`]);
        return `
          <div class="exercise ${allDone ? 'done' : ''}">
            <div class="exercise-head">
              <input class="exercise-name" data-field="exercise-name" data-date="${dateKey}" data-ex="${exIndex}" value="${escapeHtml(exercise.name)}" placeholder="Название упражнения" aria-label="Название упражнения">
              <select class="unit-select" data-field="exercise-unit" data-date="${dateKey}" data-ex="${exIndex}" aria-label="Единица">
                <option value="reps" ${exercise.unit === 'reps' ? 'selected' : ''}>повторения</option>
                <option value="seconds" ${exercise.unit === 'seconds' ? 'selected' : ''}>секунды</option>
              </select>
              <button class="small danger remove-exercise" data-action="remove-exercise" data-date="${dateKey}" data-ex="${exIndex}" type="button">Удалить</button>
            </div>
            <div class="set-row">
              ${exercise.sets.map((label, setIndex) => renderSet(dateKey, exercise, label, exIndex, setIndex)).join('')}
            </div>
            <div class="toolbar">
              ${oneSet ? '<span class="muted tiny">1 подход · удержи число для правки</span>' : `
                <button class="small" data-action="add-set" data-date="${dateKey}" data-ex="${exIndex}" type="button">+ подход</button>
                <button class="small danger" data-action="remove-set" data-date="${dateKey}" data-ex="${exIndex}" type="button">− подход</button>
                <span class="muted tiny">Удержи подход для правки</span>
              `}
            </div>
          </div>
        `;
      }

      function renderSet(dateKey, exercise, label, exIndex, setIndex) {
        const done = Boolean(readSession(dateKey).done[`${exIndex}:${setIndex}`]);
        const display = formatSetLabel(exercise, label);
        const aria = `Подход ${setIndex + 1}: ${display}. Короткий тап — отметить, удержание — изменить число.`;
        if (exercise.unit === 'seconds') {
          return `
            <span class="set-item timed">
              <button class="small ghost" data-action="adjust-set" data-delta="-10" data-date="${dateKey}" data-ex="${exIndex}" data-set="${setIndex}" type="button">−10</button>
              <button class="set ${done ? 'done' : ''}" aria-label="${escapeHtml(aria)}" aria-pressed="${done ? 'true' : 'false'}" data-action="toggle" data-date="${dateKey}" data-ex="${exIndex}" data-set="${setIndex}" type="button">${done ? '✓ ' : ''}${escapeHtml(display)}</button>
              <button class="small ghost" data-action="adjust-set" data-delta="10" data-date="${dateKey}" data-ex="${exIndex}" data-set="${setIndex}" type="button">+10</button>
            </span>
          `;
        }
        return `
          <span class="set-item">
            <button class="set ${done ? 'done' : ''}" aria-label="${escapeHtml(aria)}" aria-pressed="${done ? 'true' : 'false'}" data-action="toggle" data-date="${dateKey}" data-ex="${exIndex}" data-set="${setIndex}" type="button">${done ? '✓ ' : ''}${escapeHtml(display)}</button>
          </span>
        `;
      }

      function formatSetLabel(exercise, label) {
        const text = String(label || defaultSetValue(exercise.unit, exercise.name));
        return exercise.unit === 'seconds' ? `${text} секунд` : text;
      }

      function renderSummary() {
        const stats = buildSummaryStats();
        document.getElementById('app').innerHTML = `
          ${renderTop('Статистика', 'весь период')}
          <section class="summary">
            ${stats.sets ? renderStatsDashboard(stats) : renderEmptyStats()}
          </section>
          ${renderBottomNav()}
        `;
      }

      function renderStatsDashboard(stats) {
        const topExercise = stats.rows[0]?.name || 'пока нет лидера';
        return `
          <article class="summary-hero">
            <div class="activity-ring" role="img" aria-label="Выполнено ${stats.completionPercent}% запланированных подходов" style="--value:${clamp(stats.completionPercent, 0, 100)}">
              <div class="ring-core">
                <strong>${stats.completionPercent}%</strong>
                <span>выполнено</span>
              </div>
            </div>
            <div class="summary-hero-copy">
              <span class="chart-label">${escapeHtml(stats.periodLabel)}</span>
              <strong class="impact-number">${formatNumber(stats.sets)}</strong>
              <h2>${formatCount(stats.sets, ['выполненный подход', 'выполненных подхода', 'выполненных подходов'])}</h2>
              <div class="hero-caption">
                <span class="pill">${formatCount(stats.workouts, ['тренировка', 'тренировки', 'тренировок'])}</span>
                <span class="pill">лидер: ${escapeHtml(topExercise)}</span>
              </div>
            </div>
          </article>

          <div class="summary-grid">
            ${renderMetricCard('Тренировки', formatNumber(stats.workouts), `${formatCount(stats.activeDays, ['активный день', 'активных дня', 'активных дней'])} в плане`, stats.activeDays ? stats.workouts / stats.activeDays * 100 : 100)}
            ${renderMetricCard('Подходы', formatNumber(stats.sets), `${formatNumber(stats.plannedSets)} в плане`, stats.completionPercent)}
            ${renderMetricCard('Повторения', formatNumber(stats.reps), 'только выполненный объём', stats.maxUnitValue ? stats.reps / stats.maxUnitValue * 100 : 0)}
            ${renderMetricCard('Секунды', formatDurationShort(stats.seconds), 'планка и статические упражнения', stats.maxUnitValue ? stats.seconds / stats.maxUnitValue * 100 : 0)}
          </div>

          <div class="chart-grid">
            ${renderMonthBars(stats.months)}
            ${renderRankList(stats.rows)}
            ${renderUnitList(stats.unitRows)}
            ${renderWeekdayBars(stats.weekdays)}
          </div>
        `;
      }

      function renderEmptyStats() {
        return `
          <article class="empty-hero">
            <div>
              <h2>Статистика пока пустая</h2>
              <p class="muted">Отмечай выполненные подходы в неделе — здесь появятся графики, объём и лидеры.</p>
            </div>
          </article>
        `;
      }

      function renderMetricCard(label, value, note, percent) {
        return `
          <article class="metric-card">
            <span class="chart-label">${escapeHtml(label)}</span>
            <strong>${escapeHtml(value)}</strong>
            <p class="muted tiny">${escapeHtml(note)}</p>
            <div class="metric-meter" role="presentation"><i style="--value:${clamp(percent, 0, 100)}%"></i></div>
          </article>
        `;
      }

      function renderMonthBars(months) {
        if (!months.length) return '';
        return `
          <article class="chart-card wide">
            <div class="chart-title">
              <div>
                <span class="chart-label">Динамика</span>
                <h2>Подходы по месяцам</h2>
              </div>
              <span class="bar-note">скролл вправо</span>
            </div>
            <div class="month-bars">
              ${months.map(month => `
                <div class="month-bar" title="${escapeHtml(month.title)}: ${formatCount(month.sets, ['подход', 'подхода', 'подходов'])}">
                  <i style="--value:${clamp(month.percent, 0, 100)}%"></i>
                  <b>${escapeHtml(month.shortLabel)}</b>
                </div>
              `).join('')}
            </div>
          </article>
        `;
      }

      function renderRankList(rows) {
        const topRows = rows.slice(0, 7);
        if (!topRows.length) return '';
        const max = Math.max(...topRows.map(primaryVolume), 1);
        return `
          <article class="chart-card">
            <div class="chart-title">
              <div>
                <span class="chart-label">Рейтинг</span>
                <h2>Топ упражнений</h2>
              </div>
            </div>
            <div class="rank-list">
              ${topRows.map(row => {
                const percent = primaryVolume(row) / max * 100;
                const variants = row.variants?.size > 1 ? ` · ${row.variants.size} варианта` : '';
                return `
                  <div class="rank-row">
                    <div class="rank-top">
                      <strong>${escapeHtml(row.name)}</strong>
                      <span>${escapeHtml(`${formatUnits(row.units, row.sets)}${variants}`)}</span>
                    </div>
                    <div class="rank-meter" role="presentation"><i style="--value:${clamp(percent, 0, 100)}%"></i></div>
                  </div>
                `;
              }).join('')}
            </div>
          </article>
        `;
      }

      function renderUnitList(unitRows) {
        if (!unitRows.length) return '';
        const max = Math.max(...unitRows.map(row => row.value), 1);
        return `
          <article class="chart-card">
            <div class="chart-title">
              <div>
                <span class="chart-label">Объём</span>
                <h2>По типам нагрузки</h2>
              </div>
            </div>
            <div class="unit-list">
              ${unitRows.map(row => `
                <div class="unit-row">
                  <div class="unit-top">
                    <strong>${escapeHtml(row.label)}</strong>
                    <span>${escapeHtml(row.text)}</span>
                  </div>
                  <div class="unit-meter"><i style="--value:${clamp(row.value / max * 100, 0, 100)}%"></i></div>
                </div>
              `).join('')}
            </div>
          </article>
        `;
      }

      function renderWeekdayBars(weekdays) {
        const max = Math.max(...weekdays.map(day => day.sets), 1);
        return `
          <article class="chart-card">
            <div class="chart-title">
              <div>
                <span class="chart-label">Ритм</span>
                <h2>Нагрузка по дням</h2>
              </div>
            </div>
            <div class="weekday-bars">
              ${weekdays.map(day => `
                <div class="weekday-bar" title="${escapeHtml(day.label)}: ${formatCount(day.sets, ['подход', 'подхода', 'подходов'])}">
                  <i style="--value:${clamp(day.sets / max * 100, 0, 100)}%; --alpha:${day.sets ? 1 : 0.28}"></i>
                  <b>${escapeHtml(day.short)}</b>
                </div>
              `).join('')}
            </div>
          </article>
        `;
      }

      function buildSummaryStats() {
        const rows = new Map();
        const workouts = new Set();
        const months = new Map();
        const weekdays = SHORT.map(short => ({ short, label: short, sets: 0 }));
        let sets = 0;
        let reps = 0;
        let seconds = 0;
        let plannedSets = 0;
        let activeDays = 0;
        let firstDate = null;
        let lastDate = null;

        Object.entries(state.weeks || {}).forEach(([, week]) => {
          (week?.days || []).forEach(day => {
            if (!day?.active) return;
            activeDays += 1;
            (day.exercises || []).forEach(exercise => { plannedSets += exercise.sets?.length || 0; });
          });
        });

        Object.entries(state.sessions || {}).forEach(([dateKey, session]) => {
          const week = getExistingWeek(weekStartKeyForDate(dateKey));
          const day = week?.days?.[slotForDate(dateKey)] || emptyDay();
          const exercises = day.exercises || [];
          let dayDone = false;

          Object.entries(session?.done || {}).forEach(([key, value]) => {
            if (!value) return;
            const [exIndex, setIndex] = key.split(':').map(Number);
            const fallbackExercise = exercises[exIndex];
            const payload = typeof value === 'object' ? value : null;
            const exerciseName = payload?.exercise || fallbackExercise?.name || 'Упражнение';
            const fallbackUnit = fallbackExercise?.unit || (payload?.metric?.unit === 'сек' ? 'seconds' : 'reps');
            const fallbackLabel = fallbackExercise?.sets?.[setIndex] || defaultSetValue(fallbackUnit, exerciseName);
            const label = payload?.label || fallbackLabel;
            const metric = normalizeMetric(payload?.metric || setMetric(label, fallbackUnit));
            const groupName = payload?.group || groupExerciseName(exerciseName);
            const rowKey = groupName.toLowerCase();
            const row = rows.get(rowKey) || makeSummaryRow(groupName);
            const monthKey = dateKey.slice(0, 7);
            const month = months.get(monthKey) || makeMonthRow(monthKey);
            const weekday = weekdays[slotForDate(dateKey)];

            row.sets += 1;
            row.variants.add(exerciseName);
            addMetric(row.units, metric);
            rows.set(rowKey, row);

            month.sets += 1;
            addMetric(month.units, metric);
            months.set(monthKey, month);

            weekday.sets += 1;
            sets += 1;
            if (metric.unit === 'повт') reps += metric.value;
            if (metric.unit === 'сек') seconds += metric.value;
            dayDone = true;
          });

          if (dayDone) {
            workouts.add(dateKey);
            if (!firstDate || dateKey < firstDate) firstDate = dateKey;
            if (!lastDate || dateKey > lastDate) lastDate = dateKey;
          }
        });

        const sortedRows = Array.from(rows.values()).sort((a, b) => primaryVolume(b) - primaryVolume(a) || b.sets - a.sets || a.name.localeCompare(b.name, 'ru'));
        const monthRows = buildMonthSeries(months, firstDate, lastDate);
        const maxMonthSets = Math.max(...monthRows.map(month => month.sets), 1);
        monthRows.forEach(month => { month.percent = month.sets / maxMonthSets * 100; });
        const maxUnitValue = Math.max(reps, seconds, sets, 1);

        return {
          sets,
          reps,
          seconds,
          workouts: workouts.size,
          plannedSets,
          activeDays,
          completionPercent: plannedSets ? Math.min(100, Math.round(sets / plannedSets * 100)) : (sets ? 100 : 0),
          periodLabel: firstDate && lastDate ? `с ${formatDate(firstDate)} по ${formatDate(lastDate)}` : 'нет выполненных подходов',
          rows: sortedRows,
          months: monthRows,
          weekdays,
          maxUnitValue,
          unitRows: buildUnitRows({ sets, reps, seconds })
        };
      }

      function makeSummaryRow(name) {
        return { name, sets: 0, units: {}, variants: new Set() };
      }

      function makeMonthRow(monthKey) {
        return {
          key: monthKey,
          title: monthTitle(monthKey),
          shortLabel: monthShortLabel(monthKey),
          sets: 0,
          units: {},
          percent: 0
        };
      }

      function buildMonthSeries(months, firstDate, lastDate) {
        if (!firstDate || !lastDate) return [];
        const rows = [];
        let cursor = firstDate.slice(0, 7);
        const end = lastDate.slice(0, 7);
        while (cursor <= end) {
          rows.push(months.get(cursor) || makeMonthRow(cursor));
          cursor = nextMonthKey(cursor);
        }
        return rows;
      }

      function nextMonthKey(monthKey) {
        const [year, month] = monthKey.split('-').map(Number);
        const date = new Date(year, month, 1);
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
      }

      function monthTitle(monthKey) {
        const [year, month] = monthKey.split('-').map(Number);
        return formatMonth(new Date(year, month - 1, 1));
      }

      function monthShortLabel(monthKey) {
        const [year, month] = monthKey.split('-').map(Number);
        const label = new Intl.DateTimeFormat('ru-RU', { month: 'short' }).format(new Date(year, month - 1, 1)).replace('.', '');
        return `${label} ${String(year).slice(2)}`;
      }

      function buildUnitRows(stats) {
        const rows = [];
        if (stats.reps) rows.push({ label: 'Повторения', value: stats.reps, text: formatCount(stats.reps, ['повторение', 'повторения', 'повторений']) });
        if (stats.seconds) rows.push({ label: 'Секунды', value: stats.seconds, text: formatDurationShort(stats.seconds) });
        rows.push({ label: 'Подходы', value: stats.sets, text: formatCount(stats.sets, ['подход', 'подхода', 'подходов']) });
        return rows;
      }

      function setMetric(label, unit = 'reps') {
        const text = String(label || '').toLowerCase().replace(',', '.');
        const match = text.match(/\d+(?:\.\d+)?/);
        const value = match ? Number(match[0]) : 0;
        if (unit === 'seconds' || /сек|\bс\b/.test(text)) return { unit: 'сек', value };
        if (/мин/.test(text)) return { unit: 'мин', value };
        if (/км/.test(text)) return { unit: 'км', value };
        if (/\bм\b/.test(text) && !/кг/.test(text)) return { unit: 'м', value };
        return { unit: 'повт', value };
      }

      function normalizeMetric(metric) {
        const value = Number(metric?.value || 0);
        const safeValue = Number.isFinite(value) ? value : 0;
        const unit = metric?.unit || 'повт';
        if (unit === 'seconds' || unit === 'секунды' || unit === 'сек') return { unit: 'сек', value: safeValue };
        if (unit === 'minutes' || unit === 'минуты' || unit === 'мин') return { unit: 'сек', value: safeValue * 60 };
        if (unit === 'reps' || unit === 'повторения' || unit === 'повт') return { unit: 'повт', value: safeValue };
        if (unit === 'km' || unit === 'км') return { unit: 'км', value: safeValue };
        if (unit === 'm' || unit === 'м') return { unit: 'м', value: safeValue };
        return { unit: 'повт', value: safeValue };
      }

      function addMetric(units, metric) {
        if (!metric.value) return;
        units[metric.unit] = (units[metric.unit] || 0) + metric.value;
      }

      function primaryVolume(row) {
        return row.units['повт'] || row.units['сек'] || row.units['км'] || row.units['м'] || row.sets;
      }

      function formatUnits(units, fallbackSets = 0) {
        const order = ['повт', 'сек', 'км', 'м'];
        const parts = order
          .filter(unit => units[unit])
          .map(unit => `${formatNumber(units[unit])} ${unitName(unit, units[unit])}`);
        return parts.length ? parts.join(' + ') : formatCount(fallbackSets, ['подход', 'подхода', 'подходов']);
      }

      function unitName(unit, value) {
        if (unit === 'повт') return plural(value, ['повторение', 'повторения', 'повторений']);
        if (unit === 'сек') return plural(value, ['секунда', 'секунды', 'секунд']);
        if (unit === 'км') return 'км';
        if (unit === 'м') return 'м';
        return unit;
      }

      function groupExerciseName(name) {
        const cleaned = String(name || 'Упражнение')
          .replace(/\s+\+?\d+(?:[,.]\d+)?\s*кг/ig, '')
          .replace(/\s+/g, ' ')
          .trim();
        const lower = cleaned.toLowerCase();
        if (lower.startsWith('подтяг')) return 'Подтягивания';
        if (lower.startsWith('присед')) return 'Приседания';
        if (lower === 'брусья') return 'Брусья';
        return cleaned || 'Упражнение';
      }

      function makeDonePayload(exercise, label) {
        return {
          exercise: exercise?.name || 'Упражнение',
          group: groupExerciseName(exercise?.name),
          label: label || defaultSetValue(exercise?.unit || 'reps', exercise?.name),
          metric: setMetric(label, exercise?.unit),
          completedAt: new Date().toISOString()
        };
      }

      function formatNumber(value) {
        const number = Number(value || 0);
        if (Number.isInteger(number)) return String(number);
        return number.toLocaleString('ru-RU', { maximumFractionDigits: 1 });
      }

      function touchWeek(dateKey) {
        const week = getWeek(weekStartKeyForDate(dateKey));
        week.updatedAt = new Date().toISOString();
        return week;
      }

      function setDayActive(dateKey, active) {
        const day = getDay(dateKey);
        day.active = Boolean(active);
        if (!day.active) {
          delete state.sessions[dateKey];
          stopTimer();
        }
        openDateKey = dateKey;
        touchWeek(dateKey);
        saveNow();
        render();
      }

      function updateExerciseName(dateKey, exIndex, name) {
        const day = getDay(dateKey);
        const exercise = day.exercises[exIndex];
        if (!exercise) return;
        exercise.name = String(name ?? '');
        if (isPlankName(exercise.name)) {
          exercise.unit = 'seconds';
          exercise.sets = [exercise.sets[0] || '90'];
        }
        updateDoneExercise(dateKey, exIndex);
        touchWeek(dateKey);
        scheduleSave();
      }

      function updateExerciseUnit(dateKey, exIndex, unit) {
        const day = getDay(dateKey);
        const exercise = day.exercises[exIndex];
        if (!exercise) return;
        exercise.unit = unit === 'seconds' ? 'seconds' : 'reps';
        exercise.sets = exercise.sets.map(value => normalizeSetLabel(value, exercise.unit));
        if (!exercise.sets.length) exercise.sets = [defaultSetValue(exercise.unit, exercise.name)];
        if (isSingleSecondExercise(exercise)) exercise.sets = [exercise.sets[0] || '90'];
        updateDoneExercise(dateKey, exIndex);
        cleanupSessionForDay(dateKey);
        touchWeek(dateKey);
        saveNow();
        render();
      }

      function updateDoneExercise(dateKey, exIndex) {
        const session = state.sessions[dateKey];
        const exercise = getDay(dateKey).exercises[exIndex];
        if (!session?.done || !exercise) return;
        Object.entries(session.done).forEach(([key, value]) => {
          const [currentEx, setIndex] = key.split(':').map(Number);
          if (currentEx !== exIndex || !value || typeof value !== 'object') return;
          const label = exercise.sets[setIndex] || defaultSetValue(exercise.unit, exercise.name);
          value.exercise = exercise.name || 'Упражнение';
          value.group = groupExerciseName(exercise.name);
          value.label = label;
          value.metric = setMetric(label, exercise.unit);
        });
        session.updatedAt = new Date().toISOString();
      }

      function updateDoneSet(dateKey, exIndex, setIndex) {
        const session = state.sessions[dateKey];
        const key = `${exIndex}:${setIndex}`;
        const value = session?.done?.[key];
        const exercise = getDay(dateKey).exercises[exIndex];
        if (!value || typeof value !== 'object' || !exercise) return;
        const label = exercise.sets[setIndex] || defaultSetValue(exercise.unit, exercise.name);
        value.exercise = exercise.name || 'Упражнение';
        value.group = groupExerciseName(exercise.name);
        value.label = label;
        value.metric = setMetric(label, exercise.unit);
        session.updatedAt = new Date().toISOString();
      }

      function addExercise(dateKey) {
        const day = getDay(dateKey);
        day.active = true;
        day.exercises.push({ name: '', unit: 'reps', sets: ['10'] });
        openDateKey = dateKey;
        touchWeek(dateKey);
        saveNow();
        render();
        setTimeout(() => {
          const inputs = document.querySelectorAll(`input[data-field="exercise-name"][data-date="${dateKey}"]`);
          inputs[inputs.length - 1]?.focus();
        }, 40);
      }

      function removeExercise(dateKey, exIndex) {
        const day = getDay(dateKey);
        if (!day.exercises[exIndex]) return;
        day.exercises.splice(exIndex, 1);
        shiftSessionAfterExerciseRemoval(dateKey, exIndex);
        touchWeek(dateKey);
        saveNow();
        render();
      }

      function shiftSessionAfterExerciseRemoval(dateKey, removedExIndex) {
        const session = state.sessions[dateKey];
        if (!session?.done) return;
        const nextDone = {};
        Object.entries(session.done).forEach(([key, value]) => {
          const [exIndex, setIndex] = key.split(':').map(Number);
          if (exIndex < removedExIndex) nextDone[key] = value;
          if (exIndex > removedExIndex) nextDone[`${exIndex - 1}:${setIndex}`] = value;
        });
        session.done = nextDone;
        session.updatedAt = new Date().toISOString();
        if (!Object.keys(session.done).length) delete state.sessions[dateKey];
      }

      function updateLineSetCount(dateKey, exIndex, delta) {
        const day = getDay(dateKey);
        const exercise = day.exercises[exIndex];
        if (!exercise || isSingleSecondExercise(exercise)) return;
        if (delta > 0) exercise.sets.push(exercise.sets[exercise.sets.length - 1] || defaultSetValue(exercise.unit, exercise.name));
        if (delta < 0 && exercise.sets.length > 1) {
          exercise.sets.pop();
          cleanupSessionForDay(dateKey);
        }
        touchWeek(dateKey);
        saveNow();
        render();
      }

      function setSetValue(dateKey, exIndex, setIndex, value) {
        const day = getDay(dateKey);
        const exercise = day.exercises[exIndex];
        if (!exercise || !(setIndex in exercise.sets)) return;
        exercise.sets[setIndex] = normalizeSetLabel(value, exercise.unit);
        updateDoneSet(dateKey, exIndex, setIndex);
        touchWeek(dateKey);
        saveNow();
        render();
      }

      function adjustSetValue(dateKey, exIndex, setIndex, delta) {
        const day = getDay(dateKey);
        const exercise = day.exercises[exIndex];
        if (!exercise || !(setIndex in exercise.sets)) return;
        const current = Number(String(exercise.sets[setIndex]).match(/\d+(?:\.\d+)?/)?.[0] || 0);
        const next = Math.max(0, current + Number(delta || 0));
        setSetValue(dateKey, exIndex, setIndex, next);
      }

      function editSetValue(target) {
        const dateKey = target.dataset.date;
        const exIndex = Number(target.dataset.ex);
        const setIndex = Number(target.dataset.set);
        const exercise = getDay(dateKey).exercises[exIndex];
        if (!exercise || !(setIndex in exercise.sets)) return;
        const unitLabel = exercise.unit === 'seconds' ? 'секунды' : 'повторения';
        const current = String(exercise.sets[setIndex] || defaultSetValue(exercise.unit, exercise.name));
        const next = prompt(`Сколько ${unitLabel}?`, current);
        if (next === null) return;
        setSetValue(dateKey, exIndex, setIndex, next);
      }

      function cleanupSessionForDay(dateKey) {
        const session = state.sessions[dateKey];
        if (!session?.done) return;
        const day = getDay(dateKey);
        Object.keys(session.done).forEach(key => {
          const [exIndex, setIndex] = key.split(':').map(Number);
          if (!day.active || !day.exercises[exIndex] || !(setIndex in day.exercises[exIndex].sets)) delete session.done[key];
        });
        session.updatedAt = new Date().toISOString();
        if (!Object.keys(session.done).length) delete state.sessions[dateKey];
      }

      function toggleSet(dateKey, exIndex, setIndex) {
        const session = getSession(dateKey);
        const key = `${exIndex}:${setIndex}`;
        const wasDone = Boolean(session.done[key]);
        if (wasDone) {
          delete session.done[key];
          stopTimer();
        } else {
          const exercise = getDay(dateKey).exercises[exIndex];
          const label = exercise?.sets?.[setIndex] || defaultSetValue(exercise?.unit || 'reps', exercise?.name);
          session.done[key] = makeDonePayload(exercise, label);
        }
        session.updatedAt = new Date().toISOString();
        if (!Object.keys(session.done).length) delete state.sessions[dateKey];
        saveNow();

        if (!wasDone && isDayComplete(dateKey)) {
          stopTimer();
          render();
          return;
        }

        render();
        if (!wasDone) startTimer();
      }

      function handleAction(target) {
        const action = target.dataset.action;
        if (action === 'view-week') { view = 'week'; if (weekOffset === 0) openDateKey = todayKey(); render(); return; }
        if (action === 'view-summary') { view = 'summary'; render(); return; }
        if (action === 'prev') { weekOffset -= 1; openDateKey = weekDates(weekStartKeyForOffset(weekOffset))[6]; render(); return; }
        if (action === 'next') { weekOffset += 1; openDateKey = weekDates(weekStartKeyForOffset(weekOffset))[6]; render(); return; }
        if (action === 'open-day') { openDateKey = target.dataset.date; render(); return; }
        if (action === 'set-day-active') { setDayActive(target.dataset.date, target.dataset.active === 'true'); return; }
        if (action === 'data') { openDataSheet(); return; }
        if (action === 'close-sheet') { closeSheet(); return; }
        if (action === 'copy-json') { copyJson(); return; }
        if (action === 'export-json') { exportJson(); return; }
        if (action === 'import-json') { importJson(); return; }
        if (action === 'add-exercise') { addExercise(target.dataset.date); return; }
        if (action === 'remove-exercise') { removeExercise(target.dataset.date, Number(target.dataset.ex)); return; }
        if (action === 'toggle') { toggleSet(target.dataset.date, Number(target.dataset.ex), Number(target.dataset.set)); return; }
        if (action === 'add-set' || action === 'remove-set') {
          updateLineSetCount(target.dataset.date, Number(target.dataset.ex), action === 'add-set' ? 1 : -1);
          return;
        }
        if (action === 'adjust-set') {
          adjustSetValue(target.dataset.date, Number(target.dataset.ex), Number(target.dataset.set), Number(target.dataset.delta));
          return;
        }
        if (action === 'edit-set') {
          editSetValue(target);
        }
      }

      function handleInput(target) {
        const field = target.dataset.field;
        if (field === 'exercise-name') {
          updateExerciseName(target.dataset.date, Number(target.dataset.ex), target.value);
        }
      }

      function handleChange(target) {
        if (target.dataset.field !== 'exercise-unit') return;
        updateExerciseUnit(target.dataset.date, Number(target.dataset.ex), target.value);
      }

      function handleBlur(target) {
        if (target.dataset.field !== 'exercise-name') return;
        flushSave();
        render();
      }

      function openDataSheet() {
        flushSave();
        const sheet = document.getElementById('sheet');
        sheet.innerHTML = `
          <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
            <div class="title-row">
              <h2 id="sheetTitle">JSON</h2>
              <button data-action="close-sheet" type="button" aria-label="Закрыть настройки">Закрыть</button>
            </div>
            <div class="toolbar">
              <button class="dark" data-action="copy-json" type="button">Копировать</button>
              <button data-action="export-json" type="button">Скачать</button>
              <button data-action="import-json" type="button">Импорт</button>
            </div>
            <textarea id="jsonBox" class="json-box">${escapeHtml(JSON.stringify(state, null, 2))}</textarea>
          </div>
        `;
        sheet.classList.add('show');
        sheet.setAttribute('aria-hidden', 'false');
      }

      function closeSheet() {
        const sheet = document.getElementById('sheet');
        sheet.classList.remove('show');
        sheet.setAttribute('aria-hidden', 'true');
      }

      async function copyJson() {
        const text = JSON.stringify(state, null, 2);
        try {
          await navigator.clipboard.writeText(text);
          toast('Скопировано');
        } catch (_) {
          const box = document.getElementById('jsonBox');
          box?.focus();
          box?.select();
          toast('Выделил текст');
        }
      }

      function exportJson() {
        flushSave();
        const text = JSON.stringify(state, null, 2);
        const blob = new Blob([text], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `sport-${todayKey()}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function importJson() {
        const box = document.getElementById('jsonBox');
        try {
          state = normalize(JSON.parse(box.value));
          applyTheme();
          saveNow();
          closeSheet();
          render();
          toast('Импортировано');
        } catch (_) {
          toast('JSON битый');
        }
      }

      function toast(message) {
        const node = document.getElementById('toast');
        node.textContent = message;
        node.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => node.classList.remove('show'), 1600);
      }

      function registerServiceWorker() {
        if (!('serviceWorker' in navigator)) return;
        if (!window.isSecureContext && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js?v=1.0.6', { updateViaCache: 'none' })
            .then(registration => {
              registration.update().catch(() => {});
              if (registration.waiting) registration.waiting.postMessage({ type: 'SKIP_WAITING' });
              registration.addEventListener('updatefound', () => {
                const worker = registration.installing;
                if (!worker) return;
                worker.addEventListener('statechange', () => {
                  if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                    worker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              });
            })
            .catch(() => {});
        });
      }

      function clearLongPress() {
        clearTimeout(longPressTimer);
        longPressTimer = null;
        longPressTarget = null;
      }

      function startLongPress(event) {
        const target = event.target.closest('.set[data-action="toggle"]');
        if (!target) return;
        clearLongPress();
        longPressTarget = target;
        longPressStartX = event.clientX ?? event.touches?.[0]?.clientX ?? 0;
        longPressStartY = event.clientY ?? event.touches?.[0]?.clientY ?? 0;
        longPressTimer = setTimeout(() => {
          if (!longPressTarget) return;
          ignoreNextClick = true;
          editSetValue(longPressTarget);
          clearLongPress();
        }, 520);
      }

      function moveLongPress(event) {
        if (!longPressTarget) return;
        const point = event.touches?.[0] || event;
        const x = point.clientX ?? longPressStartX;
        const y = point.clientY ?? longPressStartY;
        if (Math.abs(x - longPressStartX) > 12 || Math.abs(y - longPressStartY) > 12) clearLongPress();
      }

      document.addEventListener('pointerdown', startLongPress);
      document.addEventListener('pointermove', moveLongPress);
      document.addEventListener('pointerup', clearLongPress);
      document.addEventListener('pointercancel', clearLongPress);
      document.addEventListener('contextmenu', event => {
        if (!event.target.closest('.set[data-action="toggle"]')) return;
        event.preventDefault();
      });

      document.addEventListener('click', event => {
        const target = event.target.closest('[data-action]');
        if (!target) return;
        event.preventDefault();
        if (ignoreNextClick && target.dataset.action === 'toggle') {
          ignoreNextClick = false;
          return;
        }
        handleAction(target);
      });

      document.addEventListener('input', event => handleInput(event.target));
      document.addEventListener('change', event => handleChange(event.target));
      document.addEventListener('blur', event => handleBlur(event.target), true);
      window.addEventListener('pagehide', flushSave);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSave(); });

      registerServiceWorker();
      state = loadState();
      applyTheme();
      getWeek(weekStartKeyForOffset(0));
      saveNow();
      render();
    })();
  </script>
</body>
</html>
