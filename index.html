<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="🏆 Спорт">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="🏆 Спорт">
  <meta name="description" content="Спортивные недели, кнопки-подходы и статистика прогресса.">
  <link rel="manifest" href="manifest.webmanifest?v=1.0.28">
  <link rel="icon" href="icon.svg?v=1.0.28" type="image/svg+xml">
  <link rel="icon" href="icon-192.png?v=1.0.28" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icon-180.png?v=1.0.28">
  <title>🏆 Спорт</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0d;
      --bg-2: #121214;
      --card: #1c1c1e;
      --card-strong: #242428;
      --field: #2c2c2e;
      --ink: #f5f5f7;
      --muted: #a1a1a6;
      --line: #3a3a3c;
      --soft: #171719;
      --accent: #ff6a00;
      --accent-2: #ff8a1f;
      --accent-ink: #fff7f0;
      --done: #34c759;
      --danger: #ff6b5f;
      --shadow: rgba(0, 0, 0, 0.32);
      --glow: rgba(255, 106, 0, 0.18);
      --overlay: rgba(0, 0, 0, 0.62);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --top-safe: env(safe-area-inset-top, 0px);
      --top-clock-size: clamp(2.34rem, 10.4vw, 3.9rem);
      --top-height: calc(var(--top-clock-size) * 0.92 + var(--top-safe) + 24px);
      --top-offset: 0px;
      --bottom-action-height: 44px;
      --bottom-menu-item-size: 42px;
      --swipe-action-size: 48px;
      --swipe-action-width: calc(var(--swipe-action-size) * 2 + 18px);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 16px;
    }

    * { box-sizing: border-box; }

    * { -webkit-tap-highlight-color: transparent; }

    * {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    *::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    ::selection {
      background: color-mix(in srgb, var(--accent) 35%, transparent);
      color: var(--ink);
    }

    html, body {
      margin: 0;
      width: 100%;
      max-width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 20% -14%, rgba(255, 106, 0, 0.16), transparent 30rem),
        radial-gradient(circle at 100% 4%, rgba(255, 138, 31, 0.1), transparent 24rem),
        linear-gradient(180deg, var(--bg-2), var(--bg));
      color: var(--ink);
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100dvh;
      padding: var(--top-height) 10px calc(16px + var(--safe-bottom));
    }

    button, textarea, input, select { font: inherit; }

    button, input, select, textarea { -webkit-appearance: none; appearance: none; }

    button {
      min-height: 44px;
      border: 1px solid color-mix(in srgb, var(--line) 86%, white);
      border-radius: 14px;
      background: color-mix(in srgb, var(--field) 88%, black);
      color: var(--ink);
      padding: 0 14px;
      font-weight: 590;
      letter-spacing: -0.012em;
      touch-action: manipulation;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.035) inset;
      user-select: none;
    }

    button:active { transform: scale(0.98); }

    @media (hover: hover) and (pointer: fine) {
      button:hover {
        border-color: color-mix(in srgb, var(--accent) 34%, var(--line));
        background: color-mix(in srgb, var(--field) 92%, var(--accent));
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18), 0 1px 0 rgba(255, 255, 255, 0.04) inset;
      }

      button.dark:hover {
        border-color: var(--accent-2);
        box-shadow: 0 9px 24px var(--glow);
      }

      button.danger:hover {
        border-color: color-mix(in srgb, var(--danger) 46%, var(--line));
        background: color-mix(in srgb, var(--field) 86%, var(--danger));
      }
    }
    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 36%, transparent);
      outline-offset: 2px;
    }
    button.dark {
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 88%, black), var(--accent-2));
      color: var(--accent-ink);
      border-color: color-mix(in srgb, var(--accent) 60%, transparent);
      box-shadow: 0 7px 18px var(--glow);
    }
    button.danger { color: var(--danger); }
    button.small { min-height: 44px; padding: 0 12px; font-size: 0.86rem; }
    button.ghost { background: color-mix(in srgb, var(--soft) 78%, black); }

    select {
      padding-right: 30px;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position:
        calc(100% - 15px) 52%,
        calc(100% - 10px) 52%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }

    input, textarea, select {
      min-width: 0;
      max-width: 100%;
      border: 1px solid var(--line);
      outline: 0;
      background: var(--field);
      color: var(--ink);
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
    }

    .app {
      width: min(100%, 760px);
      max-width: 100%;
      margin: 0 auto;
      display: grid;
      gap: 10px;
      min-width: 0;
    }

    .week-days {
      display: grid;
      gap: 10px;
      min-width: 0;
    }

    .top {
      position: fixed;
      top: var(--top-offset);
      left: 0;
      right: 0;
      z-index: 10;
      margin: 0;
      padding: calc(7px + var(--top-safe)) 10px 7px;
      background:
        radial-gradient(circle at 50% -30%, var(--glow), transparent 24rem),
        linear-gradient(180deg, color-mix(in srgb, var(--bg-2) 97%, transparent), color-mix(in srgb, var(--bg-2) 82%, transparent));
      backdrop-filter: blur(20px) saturate(1.2);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
      border-bottom: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
    }

    .top-inner {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    .top-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
      padding-inline: 2px;
    }

    .title-row,
    .top-actions,
    .week-row,
    .day-head,
    .exercise-head,
    .toolbar,
    .stat-head,
    .stat-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .top-actions { justify-content: flex-end; }

    h1, h2, h3, p { margin: 0; }
    h1 {
      color: var(--ink);
      font-size: clamp(1.75rem, 7.8vw, 2.9rem);
      line-height: 0.92;
      letter-spacing: -0.075em;
      font-weight: 700;
      text-shadow: 0 0 22px var(--glow);
    }
    h2 { font-size: 1rem; letter-spacing: -0.02em; font-weight: 600; }
    h3 { font-size: 0.96rem; letter-spacing: -0.02em; font-weight: 600; }

    .top-title {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      white-space: nowrap;
      overflow: hidden;
    }

    .top-title h1 {
      flex: 0 0 auto;
    }

    .top-title h1.top-date-title {
      min-height: calc(var(--top-clock-size) * 0.92);
      display: inline-flex;
      align-items: center;
      color: var(--accent);
      font-size: var(--top-clock-size);
      line-height: 0.92;
      letter-spacing: -0.075em;
      font-weight: 300;
      text-shadow: 0 0 22px var(--glow);
    }

    .top-period {
      position: relative;
      min-width: 0;
      display: inline-flex;
      align-items: center;
    }

    .week-picker-button {
      min-width: 0;
      min-height: calc(var(--top-clock-size) * 0.92);
      width: 100%;
      display: inline-flex;
      align-items: center;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      color: var(--accent-ink);
      text-align: left;
      overflow: hidden;
    }

    .week-picker-button:active {
      transform: scale(0.98);
    }

    .week-picker-button:hover {
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    .top-subtitle {
      min-width: 0;
      min-height: calc(var(--top-clock-size) * 0.92);
      display: inline-flex;
      align-items: center;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--accent-ink);
      font-size: clamp(1rem, 4.3vw, 1.36rem);
      line-height: 1;
      letter-spacing: -0.045em;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 18px var(--glow);
    }

    .week-picker-button .top-subtitle {
      min-height: auto;
      font-size: var(--top-clock-size);
      line-height: 0.92;
      letter-spacing: -0.075em;
      font-weight: 300;
      color: var(--accent);
      text-shadow: 0 0 22px var(--glow);
    }

    .week-picker-input {
      position: absolute;
      inset: auto 0 0 auto;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .muted { color: var(--muted); }
    .tiny { font-size: 0.82rem; line-height: 1.35; }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .timer-bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-width: 94px;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    .timer-bar span {
      display: none;
    }

    .timer-bar strong {
      font-size: var(--top-clock-size);
      line-height: 0.92;
      letter-spacing: -0.075em;
      font-variant-numeric: tabular-nums;
      color: var(--done);
      text-shadow: 0 0 22px color-mix(in srgb, var(--done) 28%, transparent);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 8px;
      background: var(--soft);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 500;
      white-space: nowrap;
    }

    .pill.done { background: color-mix(in srgb, var(--done) 17%, var(--card)); color: var(--done); }

    .card {
      max-width: 100%;
      min-width: 0;
      border: 1px solid color-mix(in srgb, var(--line) 88%, white);
      border-radius: 16px;
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--card) 92%, white), var(--card));
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2), 0 1px 0 rgba(255, 255, 255, 0.035) inset;
    }

    .install-card {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-color: color-mix(in srgb, var(--accent) 44%, var(--line));
      background:
        radial-gradient(circle at 0 0, var(--glow), transparent 62%),
        linear-gradient(135deg, color-mix(in srgb, var(--card) 82%, var(--accent)), var(--card));
    }

    .install-copy {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .install-copy strong {
      color: var(--accent-ink);
      font-size: 1rem;
      letter-spacing: -0.025em;
    }

    .install-copy span {
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.3;
    }

    .install-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .install-actions button {
      min-height: 40px;
      padding-inline: 12px;
    }

    .day {
      position: relative;
      display: grid;
      max-width: 100%;
      min-width: 0;
      overflow: hidden;
      touch-action: pan-y;
    }

    .swipe-content {
      position: relative;
      z-index: 2;
      max-width: 100%;
      min-width: 0;
      background: inherit;
      transition: transform 0.18s ease;
      will-change: transform;
    }

    .swipe-open > .swipe-content {
      transform: translateX(calc(-1 * var(--swipe-action-width, 114px)));
    }

    .swiping > .swipe-content {
      transform: translateX(var(--swipe-x, 0px));
      transition: none;
    }

    .swipe-actions {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 1;
      width: var(--swipe-action-width, 114px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px;
      pointer-events: none;
      background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--danger) 20%, var(--soft)));
    }

    .swipe-open > .swipe-actions,
    .swiping > .swipe-actions {
      pointer-events: auto;
    }

    .swipe-action {
      width: var(--swipe-action-size);
      min-width: var(--swipe-action-size);
      height: var(--swipe-action-size);
      min-height: var(--swipe-action-size);
      padding: 0;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 1.18rem;
      font-weight: 650;
      line-height: 1;
    }

    .swipe-action svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .swipe-delete {
      border-color: color-mix(in srgb, var(--danger) 64%, var(--line));
      background: color-mix(in srgb, var(--danger) 78%, black);
      color: #fff;
    }

    .swipe-cancel {
      border-color: color-mix(in srgb, var(--line) 78%, white);
      background: color-mix(in srgb, var(--field) 88%, black);
      color: var(--muted);
    }

    .day > .swipe-content {
      display: grid;
      border-radius: inherit;
    }

    .day.current {
      border-color: color-mix(in srgb, var(--accent) 68%, var(--line));
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28), 0 0 0 1px color-mix(in srgb, var(--accent) 20%, transparent) inset;
    }

    .day-toggle {
      width: 100%;
      min-height: 58px;
      padding: 9px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 0;
      background: transparent;
      color: inherit;
      text-align: left;
    }

    .day .day-head {
      width: 100%;
      flex-wrap: nowrap;
      justify-content: flex-start;
      gap: 7px;
    }

    .day-open-button {
      flex: 1 1 auto;
      min-width: 0;
      max-width: 100%;
      min-height: 48px;
      padding: 0;
      border: 0;
      border-radius: 12px;
      background: transparent;
      box-shadow: none;
      text-align: left;
      display: grid;
      align-items: center;
    }

    .day-open-button:active { transform: none; }

    .day-date-wrap {
      position: relative;
      flex: 0 0 44px;
      width: 44px;
      min-height: 48px;
      border-radius: 14px;
    }

    .day-date {
      width: 100%;
      min-height: 48px;
      display: grid;
      place-items: center;
      padding: 5px 4px;
      border-radius: inherit;
      background: color-mix(in srgb, var(--field) 72%, black);
      border: 1px solid color-mix(in srgb, var(--line) 82%, white);
      box-shadow: 0 1px 0 rgba(255,255,255,0.035) inset;
      text-align: center;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }

    .day-date-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      color-scheme: dark;
      font-size: 16px;
    }

    .day-date-wrap:focus-within .day-date {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent), 0 1px 0 rgba(255,255,255,0.035) inset;
    }

    .day-date b,
    .day-date em {
      color: var(--muted);
      font-size: 0.62rem;
      line-height: 1;
      font-style: normal;
      font-weight: 650;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .day-date strong {
      color: var(--accent);
      font-size: 1.34rem;
      line-height: 0.95;
      letter-spacing: -0.055em;
      font-weight: 750;
    }

    .day.complete .day-date strong {
      color: var(--done);
    }

    .day-title {
      min-width: 0;
      display: grid;
      gap: 3px;
    }

    .day-title h2 {
      color: var(--accent);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .day.complete .day-title h2 {
      color: var(--done);
    }

    .day-meta {
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .day-status {
      flex: 0 0 auto;
      min-width: 42px;
      justify-content: center;
      color: var(--accent-ink);
      background: color-mix(in srgb, var(--accent) 17%, var(--soft));
      font-variant-numeric: tabular-nums;
    }

    .day-status.done {
      background: color-mix(in srgb, var(--done) 17%, var(--card));
      color: var(--done);
    }

    .add-day-card {
      display: grid;
      gap: 12px;
      padding: 14px;
    }

    .add-day-head {
      display: grid;
      gap: 4px;
    }

    .add-day-head h2 {
      color: var(--accent-ink);
    }

    .add-day-form {
      display: grid;
      gap: 10px;
    }

    .add-day-fields {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }

    .add-day-field,
    .add-day-date {
      min-height: 50px;
      width: 100%;
      border-radius: 16px;
      padding: 0 14px;
      font-size: 1rem;
      letter-spacing: -0.015em;
    }

    .add-day-date {
      padding: 0 10px;
      color-scheme: dark;
      font-variant-numeric: tabular-nums;
    }

    .add-day-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      align-items: center;
    }

    .add-day-actions button {
      width: 100%;
    }

    .add-day-actions button:only-child {
      grid-column: 1 / -1;
    }

    .add-day-card > button {
      width: 50%;
      justify-self: end;
    }

    .empty-week-card {
      display: grid;
      gap: 12px;
      padding: 16px;
    }

    .empty-week-card h2 {
      color: var(--accent-ink);
    }

    .empty-week-card p {
      color: var(--muted);
      line-height: 1.42;
    }

    .day-body {
      display: grid;
      gap: 8px;
      padding: 0 10px 10px;
      border-top: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
    }

    .day-body-top {
      display: grid;
      gap: 6px;
      padding-top: 8px;
    }

    .progress {
      height: 6px;
      border-radius: 999px;
      background: var(--soft);
      overflow: hidden;
    }

    .progress > i {
      display: block;
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent-2) 42%, var(--done) 58%, var(--done) 100%);
      border-radius: inherit;
      box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 30%, transparent);
      clip-path: inset(0 calc(100% - var(--value, 0%)) 0 0 round 999px);
      transition: clip-path 0.22s ease;
    }

    .exercises {
      display: grid;
      gap: 6px;
    }

    .exercise {
      position: relative;
      max-width: 100%;
      min-width: 0;
      overflow: hidden;
      border-radius: 15px;
      touch-action: pan-y;
    }

    .exercise > .swipe-content {
      display: grid;
      gap: 6px;
      padding: 7px;
      border-radius: inherit;
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--field) 84%, white), color-mix(in srgb, var(--field) 72%, var(--soft)));
      border: 1px solid color-mix(in srgb, var(--line) 86%, white);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.16);
    }

    .exercise.done > .swipe-content { background: linear-gradient(180deg, color-mix(in srgb, var(--done) 16%, var(--card)), color-mix(in srgb, var(--done) 10%, var(--card))); border-color: color-mix(in srgb, var(--done) 42%, var(--line)); }

    .exercise-name {
      flex: 1 1 160px;
      width: 100%;
      min-width: 0;
      min-height: 32px;
      border: 0;
      border-bottom: 1px solid color-mix(in srgb, var(--line) 72%, transparent);
      border-radius: 0;
      background: transparent;
      padding: 0 2px;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: -0.015em;
      box-shadow: none;
    }

    .exercise-name:focus {
      border-color: var(--accent);
      box-shadow: none;
    }

    .set-row {
      --set-gap: clamp(3px, 1.15vw, 7px);
      --set-control-size: clamp(28px, 8.2vw, 36px);
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: var(--set-gap);
      overflow: visible;
      padding-bottom: 0;
      max-width: 100%;
      min-width: 0;
    }

    .set-item {
      flex: 1 1 0;
      min-width: 0;
      display: inline-grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 6px;
      align-items: center;
      padding: 0;
      border-radius: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .set-control {
      flex: 0 0 var(--set-control-size);
      width: var(--set-control-size);
      min-width: 0;
      min-height: var(--set-control-size);
      height: var(--set-control-size);
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      color: var(--muted);
      font-size: clamp(1rem, 4.7vw, 1.25rem);
      line-height: 1;
    }

    .set-control.dark,
    .set-control.dark:hover,
    .set-control:hover,
    .set-control:focus-visible {
      outline: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
      color: var(--muted);
    }

    .set-control:disabled {
      opacity: 0.32;
      cursor: default;
    }

    .set {
      width: 100%;
      min-width: 0;
      min-height: var(--set-control-size);
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--accent) 82%, var(--line));
      background: linear-gradient(180deg, color-mix(in srgb, var(--field) 92%, white), var(--field));
      color: #fff;
      padding: 0 clamp(4px, 1.8vw, 12px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: clamp(1.08rem, 4.62vw, 1.32rem);
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .set.done {
      background: var(--done);
      color: #fff;
      border-color: var(--done);
      box-shadow: 0 5px 16px color-mix(in srgb, var(--done) 38%, transparent);
    }

    .empty {
      padding: 10px 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .toolbar { justify-content: flex-start; }

    .add-exercise,
    .add-day-button {
      width: 50%;
      justify-self: end;
      margin-left: auto;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 88%, black), var(--accent-2));
      color: var(--accent-ink);
      border-color: color-mix(in srgb, var(--accent) 60%, transparent);
      box-shadow: 0 7px 18px var(--glow);
    }

    .add-exercise {
      min-height: 38px;
      padding: 0 10px;
      border-radius: 12px;
      font-size: 0.88rem;
    }

    .week-bottom-row .add-day-button {
      flex: 1 1 0;
      width: auto;
      max-width: none;
      height: var(--bottom-action-height);
      min-height: var(--bottom-action-height);
      margin-left: 0;
    }

    .make-training {
      width: 100%;
      background: var(--field);
    }

    .week-bottom-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: end;
      gap: 12px;
      max-width: 100%;
      min-width: 0;
    }

    .bottom-menu {
      position: relative;
      flex: 1 1 0;
      display: grid;
      width: auto;
      max-width: none;
      height: var(--bottom-action-height);
      min-width: 0;
    }

    .bottom-menu button {
      min-width: 0;
      height: var(--bottom-action-height);
      min-height: var(--bottom-action-height);
      padding: 0;
      display: grid;
      place-items: center;
      box-shadow: 0 7px 18px rgba(0, 0, 0, 0.2), 0 1px 0 rgba(255, 255, 255, 0.05) inset;
    }

    .bottom-menu svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .bottom-menu-toggle {
      grid-area: 1 / 1;
      width: 100%;
      border-radius: 14px;
      background: color-mix(in srgb, var(--field) 88%, black);
      color: var(--ink);
      border-color: color-mix(in srgb, var(--line) 86%, white);
      font-size: 1.16rem;
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
      transition: opacity 0.14s ease, transform 0.14s ease, background 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
    }

    .bottom-menu.open .bottom-menu-toggle {
      opacity: 0;
      transform: scale(0.98);
      pointer-events: none;
    }

    .bottom-menu-items {
      grid-area: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: stretch;
      gap: 6px;
      width: 100%;
      height: var(--bottom-action-height);
      opacity: 0;
      visibility: hidden;
      transform: scale(0.96);
      pointer-events: none;
      transition: opacity 0.14s ease, transform 0.14s ease, visibility 0s linear 0.14s;
    }

    .bottom-menu.open .bottom-menu-items {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
      pointer-events: auto;
      transition-delay: 0s;
    }

    .bottom-menu-items button {
      flex: 1 1 0;
      width: auto;
      height: var(--bottom-action-height);
      min-height: var(--bottom-action-height);
      border-radius: 12px;
      background: color-mix(in srgb, var(--field) 88%, black);
      color: var(--ink);
      border-color: color-mix(in srgb, var(--line) 86%, white);
      font-size: 1.06rem;
    }

    .bottom-menu-items button.dark {
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 88%, black), var(--accent-2));
      color: var(--accent-ink);
      border-color: color-mix(in srgb, var(--accent) 58%, transparent);
    }

    .summary {
      display: grid;
      gap: 14px;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      padding-top: 14px;
      overflow: hidden;
    }

    .stats-overview,
    .chart-card,
    .empty-hero {
      position: relative;
      overflow: hidden;
      min-width: 0;
      max-width: 100%;
      border: 1px solid color-mix(in srgb, var(--line) 70%, var(--accent));
      background:
        radial-gradient(circle at 10% -8%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 15rem),
        linear-gradient(180deg, color-mix(in srgb, var(--card-strong) 92%, white), var(--card));
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.34), 0 1px 0 rgba(255, 255, 255, 0.05) inset;
    }

    .chart-label,
    .bar-note,
    .stats-score-label,
    .stat-number-card span:first-child {
      color: color-mix(in srgb, var(--muted) 86%, white);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.105em;
    }

    .stats-overview {
      display: grid;
      gap: 15px;
      padding: 18px;
      border-radius: 30px;
      background:
        linear-gradient(118deg, rgba(255, 106, 0, 0.18), transparent 34%),
        radial-gradient(circle at 86% 10%, rgba(255, 138, 31, 0.25), transparent 11rem),
        linear-gradient(180deg, #242428, #141416 84%);
    }

    .stats-overview::before {
      content: "";
      position: absolute;
      inset: -34% -20% auto 48%;
      height: 72%;
      transform: rotate(-18deg);
      background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.16) 0 8px, transparent 8px 18px);
      opacity: 0.46;
      pointer-events: none;
    }

    .stats-overview::after {
      content: "";
      position: absolute;
      inset: auto -20% -36% 18%;
      height: 62%;
      background: radial-gradient(circle, rgba(52, 199, 89, 0.2), transparent 68%);
      pointer-events: none;
    }

    .stats-overview > *,
    .chart-card > *,
    .empty-hero > * {
      position: relative;
      z-index: 1;
    }

    .stats-overview-head,
    .chart-title {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 12px;
      min-width: 0;
      max-width: 100%;
    }

    .stats-hero-copy,
    .chart-title > div {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .stats-overview-head h2,
    .chart-title h2 {
      overflow-wrap: anywhere;
    }

    .stats-hero-copy p {
      margin: 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.36;
      overflow-wrap: anywhere;
    }

    .stats-period,
    .bar-note {
      justify-self: end;
      max-width: 48vw;
      padding: 7px 9px;
      border: 1px solid color-mix(in srgb, var(--line) 76%, var(--accent));
      border-radius: 999px;
      background: color-mix(in srgb, var(--soft) 74%, transparent);
      color: var(--muted);
      line-height: 1.15;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .stats-period {
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      font-size: 0.72rem;
      text-transform: none;
      letter-spacing: 0;
      white-space: nowrap;
      overflow-wrap: normal;
    }

    .stats-hero-score {
      display: grid;
      gap: 10px;
      min-width: 0;
      padding: 14px;
      border: 1px solid color-mix(in srgb, var(--accent) 44%, var(--line));
      border-radius: 24px;
      background:
        linear-gradient(135deg, rgba(255, 106, 0, 0.2), rgba(52, 199, 89, 0.08)),
        color-mix(in srgb, var(--soft) 86%, transparent);
    }

    .stats-score-top,
    .stats-progress-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .stats-score-badge {
      flex: 0 0 auto;
      padding: 6px 9px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--done) 18%, transparent);
      color: var(--done);
      font-size: 0.76rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .stats-hero-score strong {
      color: var(--ink);
      font-size: clamp(4.35rem, 17vw, 7.4rem);
      line-height: 0.78;
      letter-spacing: -0.105em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 18px 44px rgba(0, 0, 0, 0.4), 0 0 26px rgba(255, 106, 0, 0.18);
    }

    .stats-hero-score strong small {
      font-size: 0.34em;
      letter-spacing: -0.08em;
    }

    .stats-score-status {
      color: color-mix(in srgb, var(--muted) 82%, white);
      font-size: 0.84rem;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .stats-progress {
      display: grid;
      gap: 8px;
      min-width: 0;
      padding-top: 2px;
    }

    .stats-progress-top {
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.3;
    }

    .stats-progress-top strong {
      color: var(--done);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .stats-progress-meter {
      height: 9px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
    }

    .stats-progress-meter i {
      display: block;
      width: var(--value, 0%);
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--done));
      box-shadow: 0 0 22px var(--glow);
      transition: width 0.22s ease;
    }

    .stats-overview-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
      min-width: 0;
    }

    .stat-number-card {
      position: relative;
      display: grid;
      align-content: start;
      gap: 7px;
      min-width: 0;
      padding: 12px 10px;
      border: 1px solid color-mix(in srgb, var(--line) 66%, var(--accent));
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.055), transparent),
        color-mix(in srgb, var(--field) 54%, transparent);
    }

    .stat-number-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 12px;
      right: 12px;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), transparent);
    }

    .stat-number-card strong,
    .unit-value,
    .weekday-chip strong {
      color: var(--ink);
      line-height: 0.95;
      letter-spacing: -0.055em;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .stat-number-card strong {
      font-size: clamp(1.55rem, 6.6vw, 2.5rem);
    }

    .stat-number-card em {
      min-width: 0;
      color: var(--muted);
      font-size: 0.72rem;
      font-style: normal;
      line-height: 1.22;
      overflow-wrap: anywhere;
    }

    .chart-grid {
      display: grid;
      gap: 12px;
      min-width: 0;
      max-width: 100%;
    }

    .chart-card,
    .empty-hero {
      display: grid;
      gap: 14px;
      padding: 15px;
      border-radius: 26px;
    }

    .chart-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 16px;
      right: 16px;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), rgba(255, 255, 255, 0.08), transparent);
    }

    .chart-card.wide { min-height: 0; }

    .month-bars {
      min-height: 150px;
      display: grid;
      grid-template-columns: repeat(var(--month-count, 1), minmax(0, 1fr));
      align-items: end;
      gap: 7px;
      min-width: 0;
      max-width: 100%;
      padding: 2px 0 0;
    }

    .month-bar {
      min-width: 0;
      height: 142px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 7px;
      align-items: end;
    }

    .month-bar span {
      color: color-mix(in srgb, var(--ink) 88%, var(--muted));
      font-size: 0.7rem;
      font-weight: 800;
      line-height: 1;
      text-align: center;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .month-bar i {
      width: 100%;
      min-height: 8px;
      height: var(--value, 0%);
      border-radius: 999px 999px 8px 8px;
      background: linear-gradient(180deg, var(--accent-2), var(--accent));
      box-shadow: 0 0 22px var(--glow);
      transition: height 0.22s ease;
    }

    .month-bar.empty i {
      background: color-mix(in srgb, var(--line) 64%, black);
      box-shadow: none;
    }

    .month-bar b {
      color: var(--muted);
      font-size: 0.64rem;
      font-weight: 600;
      line-height: 1.05;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .exercise-stat-list,
    .unit-list,
    .weekday-stats {
      display: grid;
      gap: 9px;
      min-width: 0;
      max-width: 100%;
    }

    .exercise-stat-row,
    .unit-row,
    .weekday-chip {
      min-width: 0;
      border: 1px solid color-mix(in srgb, var(--line) 72%, var(--accent));
      background: color-mix(in srgb, var(--field) 56%, transparent);
    }

    .exercise-stat-row {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 18px;
    }

    .exercise-stat-row.rank-1 {
      border-color: color-mix(in srgb, var(--accent) 64%, var(--line));
      background:
        linear-gradient(90deg, rgba(255, 106, 0, 0.16), transparent 58%),
        color-mix(in srgb, var(--field) 58%, transparent);
    }

    .exercise-rank {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--line) 70%, var(--accent));
      border-radius: 12px;
      background: color-mix(in srgb, var(--soft) 78%, transparent);
      color: var(--accent-2);
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    .exercise-stat-row.rank-1 .exercise-rank {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: var(--accent-ink);
      box-shadow: 0 9px 22px var(--glow);
    }

    .exercise-stat-text {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .exercise-stat-text strong {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .exercise-stat-value {
      max-width: 38vw;
      color: var(--ink);
      font-size: 1.08rem;
      font-weight: 800;
      text-align: right;
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
    }

    .exercise-stat-meta,
    .unit-row span,
    .weekday-chip span {
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.3;
    }

    .unit-list {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .unit-row {
      position: relative;
      display: grid;
      gap: 7px;
      padding: 12px;
      border-radius: 18px;
      overflow: hidden;
    }

    .unit-row::after {
      content: "";
      position: absolute;
      inset: auto -18px -28px 44%;
      height: 70px;
      transform: rotate(-16deg);
      background: linear-gradient(90deg, rgba(255, 106, 0, 0.18), transparent);
      pointer-events: none;
    }

    .unit-value {
      font-size: clamp(1.55rem, 6.6vw, 2.22rem);
    }

    .weekday-stats {
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }

    .weekday-chip {
      display: grid;
      place-items: center;
      gap: 4px;
      min-height: 66px;
      padding: 8px 3px;
      border-radius: 16px;
      text-align: center;
    }

    .weekday-chip strong {
      font-size: clamp(0.98rem, 4.3vw, 1.26rem);
    }

    .weekday-chip.peak {
      border-color: color-mix(in srgb, var(--done) 58%, var(--line));
      background: linear-gradient(180deg, rgba(52, 199, 89, 0.16), color-mix(in srgb, var(--field) 58%, transparent));
    }

    .weekday-chip.empty {
      opacity: 0.52;
    }

    .empty-hero {
      min-height: 240px;
      place-items: center;
      text-align: center;
    }

    .sheet {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 40;
      background: var(--overlay);
      padding: 16px 16px calc(16px + var(--safe-bottom));
      align-items: end;
    }

    .sheet.show { display: grid; }

    .sheet-card {
      width: min(100%, 760px);
      max-height: min(76dvh, 620px);
      margin: 0 auto;
      border-radius: 24px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--card) 92%, white), var(--card));
      border: 1px solid var(--line);
      padding: 14px;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 10px;
      box-shadow: 0 18px 60px rgba(0,0,0,0.42);
    }

    .json-box {
      width: 100%;
      min-height: 220px;
      max-height: 100%;
      border-radius: 14px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.78rem;
      line-height: 1.45;
      white-space: pre;
      resize: vertical;
      overflow: auto;
    }

    .toast {
      position: fixed;
      left: 14px;
      right: 14px;
      bottom: calc(16px + var(--safe-bottom));
      z-index: 50;
      padding: 12px 14px;
      border-radius: 16px;
      background: var(--accent);
      color: var(--accent-ink);
      opacity: 0;
      transform: translateY(14px);
      pointer-events: none;
      transition: 0.18s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      font-weight: 600;
    }

    .toast span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }

    .toast button {
      min-height: 34px;
      flex: 0 0 auto;
      padding: 0 10px;
      border-color: color-mix(in srgb, var(--accent-ink) 44%, transparent);
      background: color-mix(in srgb, var(--accent) 72%, black);
      color: var(--accent-ink);
      font-size: 0.86rem;
    }

    @supports not (color: color-mix(in srgb, white, black)) {
      .top { background: var(--bg); }
      .bottom-menu-toggle,
      .bottom-menu-items button { background: var(--field); }
      .add-exercise,
      .add-day-button,
      .bottom-menu-items button.dark { background: var(--accent); }
      .timer-bar strong { text-shadow: 0 0 22px rgba(52, 199, 89, 0.28); }
      .set { border: 1px solid var(--accent); }
      .exercise { background: var(--soft); }
    }

    @media (max-width: 520px) {
      .top-inner {
        gap: 8px;
      }
    }

    @media (max-width: 420px) {
      body { padding-inline: 6px; }
      h1 { font-size: 0.78rem; }
      .top { margin-inline: 0; padding-inline: 6px; }
      .timer-bar { min-width: 82px; }
      .top-actions button { min-height: 38px; padding-inline: 12px; }
      .day-toggle { padding: 8px 10px; }
      .day-body,
      .add-day-card,

      .toolbar button { flex: 1 1 120px; min-height: 38px; }
      .install-card { grid-template-columns: 1fr; }
      .install-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .install-actions button { width: 100%; }
      .add-day-fields { grid-template-columns: 1fr; }
      .set-row { gap: 3px; }
      .set { min-height: 38px; }
      .stats-overview { padding: 12px; }
      .stats-overview-grid { gap: 6px; }
      .stat-number-card { padding: 9px 7px; }
      .stats-period { max-width: 52%; font-size: 0.72rem; }

      .empty-hero { padding: 12px; }

    @media (max-width: 340px) {

      .chart-title { display: grid; }

    @media (min-width: 720px) {
      body { padding-top: var(--top-height); }
      .day-body { padding: 0 15px 15px; }
      .week-days { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .day.open { grid-column: 1 / -1; }
      .chart-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .chart-card.wide { grid-column: 1 / -1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main id="app" class="app"></main>
  <div id="sheet" class="sheet" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'sport-notes.state.v6';
      const INSTALL_PROMPT_SESSION_KEY = 'sport-notes.install-prompt.v1';
      const OLD_KEYS = [];
      const SHORT = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
      let state;
      let view = 'week';
      let weekOffset = 0;
      let openDateKey = null;
      let showAddDayForm = false;
      let saveTimer = null;
      let toastTimer = null;
      let deferredInstallPrompt = null;
      let timerStartedAt = null;
      let timerInterval = null;
      let wakeLock = null;
      let wakeLockRequest = null;
      let longPressTimer = null;
      let longPressTarget = null;
      let longPressStartX = 0;
      let longPressStartY = 0;
      let swipeState = null;
      let ignoreNextClick = false;

      function uid() {
        return `${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
      }

      function todayKey() {
        return toDateKey(new Date());
      }

      function toDateKey(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
      }

      function parseDateKey(key) {
        const [y, m, d] = String(key).split('-').map(Number);
        return new Date(y, m - 1, d);
      }

      function isDateKey(value) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(String(value || ''))) return false;
        const date = parseDateKey(value);
        return toDateKey(date) === value;
      }

      function dateKeyToUtcDay(dateKey) {
        const [year, month, day] = String(dateKey).split('-').map(Number);
        return Math.floor(Date.UTC(year, month - 1, day) / 86400000);
      }

      function weekOffsetForDate(dateKey) {
        const currentStart = weekStartKeyForDate(todayKey());
        const targetStart = weekStartKeyForDate(dateKey);
        return Math.round((dateKeyToUtcDay(targetStart) - dateKeyToUtcDay(currentStart)) / 7);
      }

      function addDays(date, days) {
        const copy = new Date(date);
        copy.setDate(copy.getDate() + days);
        return copy;
      }

      function startOfWeek(date = new Date()) {
        const copy = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        const diff = (copy.getDay() + 6) % 7;
        copy.setDate(copy.getDate() - diff);
        return copy;
      }

      function weekStartKeyForDate(dateKey) {
        return toDateKey(startOfWeek(parseDateKey(dateKey)));
      }

      function weekStartKeyForOffset(offset = 0) {
        const start = startOfWeek(new Date());
        start.setDate(start.getDate() + offset * 7);
        return toDateKey(start);
      }

      function weekDates(startKey) {
        const start = parseDateKey(startKey);
        return Array.from({ length: 7 }, (_, i) => toDateKey(addDays(start, i)));
      }

      function slotForDate(dateKey) {
        return (parseDateKey(dateKey).getDay() + 6) % 7;
      }

      function formatDate(dateKey, long = false) {
        return new Intl.DateTimeFormat('ru-RU', long ? { day: 'numeric', month: 'long' } : { day: 'numeric', month: 'short' }).format(parseDateKey(dateKey));
      }

      function weekdayName(dateKey) {
        const name = new Intl.DateTimeFormat('ru-RU', { weekday: 'long' }).format(parseDateKey(dateKey));
        return name ? name.charAt(0).toUpperCase() + name.slice(1) : 'Тренировка';
      }

      function formatCompactDate(dateKey, includeYear = false) {
        const date = parseDateKey(dateKey);
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');
        if (!includeYear) return `${day}.${month}`;
        return `${day}.${month}.${String(date.getFullYear()).slice(-2)}`;
      }

      function formatWeekRange(startKey) {
        const dates = weekDates(startKey);
        return `${formatCompactDate(dates[0])}-${formatCompactDate(dates[6])}`;
      }

      function formatMonth(date) {
        return new Intl.DateTimeFormat('ru-RU', { month: 'long', year: 'numeric' }).format(date);
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function clamp(value, min, max) {
        const number = Number(value);
        if (!Number.isFinite(number)) return min;
        return Math.min(max, Math.max(min, number));
      }

      function plural(value, forms) {
        const number = Math.abs(Math.trunc(Number(value) || 0));
        const mod10 = number % 10;
        const mod100 = number % 100;
        if (mod10 === 1 && mod100 !== 11) return forms[0];
        if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return forms[1];
        return forms[2];
      }

      function formatCount(value, forms) {
        return `${formatNumber(value)} ${plural(value, forms)}`;
      }

      function emptyDay() {
        return { active: false, manual: false, label: '', exercises: [] };
      }

      function emptyWeekDays() {
        return Array.from({ length: 7 }, emptyDay);
      }

      function defaultState() {
        return {
          version: 6,
          id: uid(),
          theme: 'dark',
          weeks: {},
          sessions: {},
          updatedAt: new Date().toISOString()
        };
      }

      function loadState() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) return normalize(JSON.parse(saved));
        } catch (_) {}

        for (const key of OLD_KEYS) {
          try {
            const saved = localStorage.getItem(key);
            if (saved) return normalize(JSON.parse(saved));
          } catch (_) {}
        }

        return defaultState();
      }

      function normalize(raw) {
        const fallback = defaultState();
        const next = raw && typeof raw === 'object' ? raw : fallback;
        const currentWeek = weekStartKeyForDate(todayKey());
        const weeks = cleanWeeks(next.weeks);

        if (!Object.keys(weeks).length && Array.isArray(next.days)) {
          weeks[currentWeek] = makeWeek(next.days);
        }

        return {
          version: 6,
          id: next.id || uid(),
          theme: 'dark',
          weeks,
          sessions: cleanSessions(next.sessions),
          updatedAt: next.updatedAt || new Date().toISOString()
        };
      }

      function cleanWeeks(rawWeeks) {
        const weeks = {};
        if (!rawWeeks || typeof rawWeeks !== 'object' || Array.isArray(rawWeeks)) return weeks;
        Object.entries(rawWeeks).forEach(([startKey, week]) => {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(startKey)) return;
          weeks[startKey] = makeWeek(week?.days || emptyWeekDays());
          weeks[startKey].createdAt = week?.createdAt || weeks[startKey].createdAt;
          weeks[startKey].updatedAt = week?.updatedAt || weeks[startKey].updatedAt;
        });
        return weeks;
      }

      function makeWeek(days) {
        return {
          days: cleanDays(days),
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
      }

      function cleanDays(days) {
        const next = Array.isArray(days) ? days.slice(0, 7) : [];
        while (next.length < 7) next.push(emptyDay());
        return next.map(cleanDay);
      }

      function cleanDay(day) {
        if (typeof day === 'string') {
          const exercises = textToExercises(day);
          return { active: exercises.length > 0, manual: exercises.length > 0, label: '', exercises };
        }
        if (!day || typeof day !== 'object') return emptyDay();
        const exercises = (Array.isArray(day.exercises) ? day.exercises : []).map(cleanExercise).filter(Boolean);
        const label = String(day.label ?? '').trim().slice(0, 64);
        const manual = Boolean(day.manual || label || exercises.length);
        const active = manual && (typeof day.active === 'boolean' ? day.active : true);
        return { active, manual, label, exercises };
      }

      function cleanExercise(exercise) {
        if (typeof exercise === 'string') return parseLineToExercise(exercise);
        if (!exercise || typeof exercise !== 'object') return null;
        const name = String(exercise.name ?? '').trim();
        const unit = 'reps';
        let sets = Array.isArray(exercise.sets) ? exercise.sets : [];
        sets = sets.map(value => normalizeSetLabel(value, unit)).filter(Boolean);
        if (!sets.length) sets = [defaultSetValue(unit, name)];
        return { name, unit, sets };
      }

      function textToExercises(text) {
        return String(text || '')
          .split('\n')
          .map(line => line.trim())
          .filter(Boolean)
          .map(parseLineToExercise);
      }

      function parseLineToExercise(line) {
        const match = String(line).match(/^(.*?)(?:\s+[—–-]\s+)(.+)$/);
        const name = (match ? match[1] : line).trim();
        const tail = (match ? match[2] : '').trim();
        const unit = 'reps';
        const sets = tail ? splitSets(tail).map(value => normalizeSetLabel(value, unit)).filter(Boolean) : [defaultSetValue(unit, name)];
        return { name, unit, sets: sets.length ? sets : [defaultSetValue(unit, name)] };
      }

      function splitSets(tail) {
        if (!tail) return ['10'];
        const normalized = tail.replace(/[–—]/g, '-');
        if (!normalized.includes('-')) return [tail.trim()];
        const parts = normalized.split('-').map(v => v.trim()).filter(Boolean);
        return parts.length ? parts : [tail.trim()];
      }

      function inferUnit() {
        return 'reps';
      }

      function normalizeSetLabel(value, unit) {
        const raw = value && typeof value === 'object' ? value.label ?? value.value ?? '' : value;
        const text = String(raw ?? '').trim().replace(',', '.');
        const match = text.match(/\d+(?:\.\d+)?\+?/);
        if (match) return match[0];
        return defaultSetValue(unit, '');
      }

      function defaultSetValue() {
        return '10';
      }

      function cleanSessions(rawSessions) {
        const sessions = {};
        if (!rawSessions || typeof rawSessions !== 'object' || Array.isArray(rawSessions)) return sessions;
        Object.entries(rawSessions).forEach(([dateKey, session]) => {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(dateKey)) return;
          const done = {};
          const rawDone = session?.done && typeof session.done === 'object' ? session.done : {};
          Object.entries(rawDone).forEach(([key, value]) => {
            if (!/^\d+:\d+$/.test(key) || !value) return;
            done[key] = typeof value === 'object' ? value : true;
          });
          if (Object.keys(done).length) {
            sessions[dateKey] = { done, updatedAt: session?.updatedAt || new Date().toISOString() };
          }
        });
        return sessions;
      }

      function applyTheme() {
        document.documentElement.dataset.theme = 'dark';
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#0b0b0d');
      }

      function saveNow() {
        state.updatedAt = new Date().toISOString();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function scheduleSave() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(saveNow, 180);
      }

      function flushSave() {
        clearTimeout(saveTimer);
        saveTimer = null;
        saveNow();
      }

      function getWeek(startKey) {
        if (!state.weeks[startKey]) {
          state.weeks[startKey] = makeWeek(emptyWeekDays());
          scheduleSave();
        }
        return state.weeks[startKey];
      }

      function getExistingWeek(startKey) {
        return state.weeks[startKey] || null;
      }

      function weekHasManualDays(week) {
        return Boolean(week?.days?.some(isManualDay));
      }

      function getRenderableWeek(startKey) {
        const existing = getExistingWeek(startKey);
        if (existing) return existing;
        return copyPreviousWeek(startKey) || makeWeek(emptyWeekDays());
      }

      function copyPreviousWeek(startKey) {
        const previousKey = toDateKey(addDays(parseDateKey(startKey), -7));
        const previousWeek = getExistingWeek(previousKey);
        if (!weekHasManualDays(previousWeek)) return null;

        const dates = weekDates(startKey);
        const sourceDates = weekDates(previousKey);
        const copiedDays = dates.map((dateKey, index) => {
          const sourceDay = previousWeek.days?.[index];
          if (!isManualDay(sourceDay)) return emptyDay();
          const customTitle = customDayTitle(sourceDates[index], sourceDay);
          const day = cloneDay(sourceDay);
          day.active = true;
          day.manual = true;
          day.label = customTitle || weekdayName(dateKey);
          return day;
        });

        const week = makeWeek(copiedDays);
        state.weeks[startKey] = week;
        scheduleSave();
        return week;
      }

      function getDay(dateKey) {
        const week = getWeek(weekStartKeyForDate(dateKey));
        const slot = slotForDate(dateKey);
        if (!week.days[slot]) week.days[slot] = emptyDay();
        return week.days[slot];
      }

      function getSession(dateKey) {
        if (!state.sessions[dateKey]) state.sessions[dateKey] = { done: {}, updatedAt: new Date().toISOString() };
        if (!state.sessions[dateKey].done) state.sessions[dateKey].done = {};
        return state.sessions[dateKey];
      }

      function readSession(dateKey) {
        return state.sessions[dateKey] || { done: {} };
      }

      function customDayTitle(dateKey, day) {
        const label = String(day?.label || '').trim();
        return label && label !== weekdayName(dateKey) ? label : '';
      }

      function dayTitle(dateKey, day) {
        return customDayTitle(dateKey, day) || weekdayName(dateKey);
      }

      function isManualDay(day) {
        return Boolean(day?.manual && (day?.active || day?.exercises?.length || String(day?.label || '').trim()));
      }

      function hasDayContent(day) {
        return isManualDay(day);
      }

      function hasExistingManualDay(dateKey) {
        const week = getExistingWeek(weekStartKeyForDate(dateKey));
        return Boolean(week && isManualDay(week.days?.[slotForDate(dateKey)]));
      }

      function readExistingDay(dateKey) {
        const week = getExistingWeek(weekStartKeyForDate(dateKey));
        return week?.days?.[slotForDate(dateKey)] || null;
      }

      function dayProgress(dateKey) {
        const day = getDay(dateKey);
        if (!hasDayContent(day)) return { total: 0, checked: 0, percent: 0 };
        const done = readSession(dateKey).done;
        let total = 0;
        let checked = 0;
        day.exercises.forEach((ex, exIndex) => ex.sets.forEach((_, setIndex) => {
          total += 1;
          if (done[`${exIndex}:${setIndex}`]) checked += 1;
        }));
        return { total, checked, percent: total ? Math.round((checked / total) * 100) : 0 };
      }

      function isDayComplete(dateKey) {
        const progress = dayProgress(dateKey);
        return progress.total > 0 && progress.checked === progress.total;
      }

      function timerSeconds() {
        return timerStartedAt ? Math.floor((Date.now() - timerStartedAt) / 1000) : 0;
      }

      function formatTimer(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }

      function updateTimerDisplay() {
        const node = document.getElementById('timerDisplay');
        if (node) node.textContent = formatTimer(timerSeconds());
      }

      function shouldKeepScreenAwake() {
        return Boolean(timerStartedAt && document.visibilityState === 'visible' && navigator.wakeLock?.request);
      }

      async function requestWakeLock() {
        if (!shouldKeepScreenAwake()) return;
        if (wakeLock || wakeLockRequest) return;
        wakeLockRequest = navigator.wakeLock.request('screen')
          .then(lock => {
            if (!shouldKeepScreenAwake()) {
              lock.release?.().catch(() => {});
              return;
            }
            wakeLock = lock;
            lock.addEventListener('release', () => {
              if (wakeLock !== lock) return;
              wakeLock = null;
              if (shouldKeepScreenAwake()) window.setTimeout(requestWakeLock, 250);
            });
          })
          .catch(() => {})
          .finally(() => {
            wakeLockRequest = null;
          });
        await wakeLockRequest;
      }

      function releaseWakeLock() {
        const lock = wakeLock;
        wakeLock = null;
        lock?.release?.().catch(() => {});
      }

      function startTimer() {
        timerStartedAt = Date.now();
        clearInterval(timerInterval);
        timerInterval = setInterval(updateTimerDisplay, 1000);
        updateTimerDisplay();
        requestWakeLock();
      }

      function stopTimer() {
        timerStartedAt = null;
        clearInterval(timerInterval);
        timerInterval = null;
        releaseWakeLock();
        updateTimerDisplay();
      }

      function render() {
        if (view === 'summary') renderSummary();
        else renderWeek();
        updateTimerDisplay();
      }

      function resetScrollPosition() {
        window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
      }

      function renderTop(title, subtitle, options = {}) {
        const weekPicker = options.weekPicker ? `
          <span class="top-period" aria-label="Неделя ${escapeHtml(subtitle)}">
            <button class="week-picker-button" data-action="open-week-picker" type="button" aria-label="Выбрать неделю">
              <strong class="top-subtitle">${escapeHtml(subtitle)}</strong>
            </button>
            <input id="weekPicker" class="week-picker-input" data-field="week-picker" type="date" value="${escapeHtml(options.weekStart || todayKey())}" aria-label="Выбрать понедельник недели" tabindex="-1">
          </span>
        ` : subtitle ? `<strong class="top-subtitle">${escapeHtml(subtitle)}</strong>` : '';
        const headingClass = options.titleAsDate ? ' class="top-date-title"' : '';
        const heading = title ? `<h1${headingClass}>${escapeHtml(title)}</h1>` : '';
        const timer = options.showTimer === false ? '' : `
              <div class="timer-bar" aria-live="polite">
                <span>Секундомер</span>
                <strong id="timerDisplay">${formatTimer(timerSeconds())}</strong>
              </div>`;
        return `
          <header class="top">
            <div class="top-inner">
              <div class="top-title">
                ${heading}
                ${weekPicker}
              </div>
              ${timer}
            </div>
          </header>
        `;
      }

      function trashIcon() {
        return '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h16"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M6 7l1 14h10l1-14"></path><path d="M9 7V4h6v3"></path></svg>';
      }

      function renderBottomNav() {
        return `
          <nav class="bottom-menu" aria-label="Разделы">
            <div class="bottom-menu-items" id="bottomMenuItems">
              <button class="${view === 'week' ? 'dark' : ''}" data-action="view-week" type="button" aria-current="${view === 'week' ? 'page' : 'false'}" aria-label="Неделя" title="Неделя">📅</button>
              <button class="${view === 'summary' ? 'dark' : ''}" data-action="view-summary" type="button" aria-current="${view === 'summary' ? 'page' : 'false'}" aria-label="Статистика" title="Статистика">📊</button>
              <button data-action="data" type="button" aria-haspopup="dialog" aria-label="Настройки" title="Настройки">⚙️</button>
            </div>
            <button class="bottom-menu-toggle" data-action="toggle-menu" type="button" aria-expanded="false" aria-controls="bottomMenuItems" aria-label="Меню">☰</button>
          </nav>
        `;
      }

      function renderWeek() {
        const weekKey = weekStartKeyForOffset(weekOffset);
        const week = getRenderableWeek(weekKey);
        const dates = weekDates(weekKey);
        const visibleDates = dates.filter(dateKey => isManualDay(week.days[slotForDate(dateKey)]));
        const isEmpty = visibleDates.length === 0;
        if (isEmpty) showAddDayForm = true;

        if (weekOffset < 0) {
          openDateKey = '';
        } else if (visibleDates.length) {
          const today = todayKey();
          const defaultOpenDate = visibleDates.includes(today) ? today : visibleDates[0];
          if (openDateKey === null || (openDateKey && !visibleDates.includes(openDateKey))) {
            openDateKey = isDayComplete(defaultOpenDate) ? '' : defaultOpenDate;
          }
        } else {
          openDateKey = '';
        }

        document.getElementById('app').innerHTML = `
          ${renderTop('', formatWeekRange(weekKey), { weekPicker: true, weekStart: weekKey })}
          <section class="week-days">
            ${isEmpty ? '' : visibleDates.map(dateKey => renderDay(dateKey, week)).join('')}
            ${showAddDayForm ? `${renderInstallCard()}${renderAddDayForm(dates, week, isEmpty)}` : renderWeekBottomRow()}
          </section>
        `;
      }

      function renderInstallCard() {
        if (!shouldShowInstallPrompt()) return '';
        return `
          <article class="card install-card">
            <div class="install-copy">
              <strong>Сохрани приложение на рабочий стол</strong>
              <span>Откроется как отдельное приложение и будет быстрее доступно.</span>
            </div>
            <div class="install-actions">
              <button class="dark" data-action="install-app" type="button">Сохранить</button>
              <button data-action="dismiss-install" type="button" aria-label="Скрыть предложение">Не сейчас</button>
            </div>
          </article>
        `;
      }

      function renderWeekBottomRow() {
        return `
          ${renderInstallCard()}
          <div class="week-bottom-row">
            ${renderBottomNav()}
            ${renderAddDayButton()}
          </div>
        `;
      }

      function renderAddDayButton() {
        return `
          <button class="add-day-button" data-action="show-add-day" type="button">+ День</button>
        `;
      }

      function renderAddDayForm(dates, week, isFirstDay = false) {
        const availableDates = dates.filter(dateKey => !isManualDay(week.days[slotForDate(dateKey)]));
        const today = todayKey();
        const defaultDate = availableDates.includes(today) ? today : availableDates[0];

        return `
          <article class="card add-day-card">
            <div class="add-day-head">
              <h2>${isFirstDay ? 'Назначь первый тренировочный день' : 'Новый тренировочный день'}</h2>
              <span class="muted tiny">Выбери дату — название подставится по календарю. Никакие другие дни не появятся сами.</span>
            </div>
            ${availableDates.length ? `
              <form class="add-day-form" data-form="add-day">
                <div class="add-day-fields">
                  <label class="visually-hidden" for="addDayDate">Дата тренировочного дня</label>
                  <input id="addDayDate" class="add-day-date" data-field="add-day-date" name="dayDate" type="date" min="${dates[0]}" max="${dates[6]}" value="${defaultDate}" required autofocus>
                </div>
                <div class="add-day-actions">
                  <button class="dark" type="submit">${isFirstDay ? 'Создать первый день' : 'Добавить день'}</button>
                  ${isFirstDay ? '' : '<button data-action="hide-add-day" type="button">Отмена</button>'}
                </div>
              </form>
            ` : `
              <div class="empty">Все семь ручных дней этой недели уже добавлены.</div>
              <button data-action="hide-add-day" type="button">Закрыть</button>
            `}
          </article>
        `;
      }

      function renderDay(dateKey, week) {
        const slot = slotForDate(dateKey);
        const day = week.days[slot] || emptyDay();
        const progress = dayProgress(dateKey);
        const date = parseDateKey(dateKey);
        const dayNumber = String(date.getDate());
        const isCurrent = dateKey === todayKey();
        const isOpen = Boolean(openDateKey && dateKey === openDateKey);
        const complete = Boolean(progress.total && progress.checked === progress.total);
        const title = dayTitle(dateKey, day);
        const meta = progress.total ? `${progress.checked}/${progress.total} подходов` : 'нет подходов';
        return `
          <article class="card day ${isCurrent ? 'current' : ''} ${complete ? 'complete' : ''} ${isOpen ? 'open' : 'collapsed'}" data-swipe="day" data-date="${dateKey}" data-slot="${slot}" title="Смахни влево, чтобы удалить">
            <div class="swipe-actions">
              <button class="swipe-action swipe-delete" data-action="delete-day" data-date="${dateKey}" type="button" aria-label="Удалить день">${trashIcon()}</button>
              <button class="swipe-action swipe-cancel" data-action="close-swipe" type="button" aria-label="Закрыть свайп">×</button>
            </div>
            <div class="swipe-content">
              <div class="day-toggle" aria-label="${escapeHtml(title)}">
                <span class="day-head">
                  <label class="day-date-wrap" aria-label="Изменить дату: ${escapeHtml(formatDate(dateKey, true))}">
                    <span class="day-date" aria-hidden="true">
                      <strong>${escapeHtml(dayNumber)}</strong>
                    </span>
                    <input class="day-date-input" data-field="day-date" data-date="${dateKey}" type="date" value="${dateKey}" aria-label="Перенести день на другую дату">
                  </label>
                  <button class="day-open-button" data-action="open-day" data-date="${dateKey}" type="button" aria-expanded="${isOpen ? 'true' : 'false'}">
                    <span class="day-title">
                      <h2 data-day-title data-date="${dateKey}">${escapeHtml(title)}</h2>
                      <span class="day-meta">${escapeHtml(meta)}</span>
                    </span>
                  </button>
                </span>
              </div>
              ${isOpen ? `
                <div class="day-body">
                  <div class="day-body-top">
                    <div class="progress" role="progressbar" aria-label="Прогресс дня" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progress.percent}"><i style="--value:${progress.percent}%"></i></div>
                  </div>
                  ${day.exercises.length ? `<div class="exercises">${day.exercises.map((ex, exIndex) => renderExercise(dateKey, ex, exIndex)).join('')}</div>` : '<div class="empty">День создан. Добавь первое упражнение.</div>'}
                  <button class="add-exercise" data-action="add-exercise" data-date="${dateKey}" type="button">+ Упражнение</button>
                </div>
              ` : ''}
            </div>
          </article>
        `;
      }

      function renderExercise(dateKey, exercise, exIndex) {
        const session = readSession(dateKey);
        const allDone = exercise.sets.length > 0 && exercise.sets.every((_, setIndex) => session.done[`${exIndex}:${setIndex}`]);
        return `
          <div class="exercise ${allDone ? 'done' : ''}" data-swipe="exercise" data-date="${dateKey}" data-ex="${exIndex}" title="Смахни влево, чтобы удалить">
            <div class="swipe-actions">
              <button class="swipe-action swipe-delete" data-action="delete-exercise" data-date="${dateKey}" data-ex="${exIndex}" type="button" aria-label="Удалить упражнение">${trashIcon()}</button>
              <button class="swipe-action swipe-cancel" data-action="close-swipe" type="button" aria-label="Закрыть свайп">×</button>
            </div>
            <div class="swipe-content">
              <div class="exercise-head">
                <input class="exercise-name" data-field="exercise-name" data-date="${dateKey}" data-ex="${exIndex}" value="${escapeHtml(exercise.name)}" placeholder="Название упражнения" aria-label="Название упражнения">
              </div>
              <div class="set-row">
                <button class="small set-control" data-action="remove-set" data-date="${dateKey}" data-ex="${exIndex}" type="button" aria-label="Убрать подход" ${exercise.sets.length <= 1 ? 'disabled' : ''}>−</button>
                ${exercise.sets.map((label, setIndex) => renderSet(dateKey, exercise, label, exIndex, setIndex)).join('')}
                <button class="small set-control dark" data-action="add-set" data-date="${dateKey}" data-ex="${exIndex}" type="button" aria-label="Добавить подход">+</button>
              </div>
            </div>
          </div>
        `;
      }

      function renderSet(dateKey, exercise, label, exIndex, setIndex) {
        const done = Boolean(readSession(dateKey).done[`${exIndex}:${setIndex}`]);
        const display = formatSetLabel(exercise, label);
        const aria = `Подход ${setIndex + 1}: ${display}.`;
        return `
          <span class="set-item">
            <button class="set ${done ? 'done' : ''}" aria-label="${escapeHtml(aria)}" aria-pressed="${done ? 'true' : 'false'}" data-action="toggle" data-date="${dateKey}" data-ex="${exIndex}" data-set="${setIndex}" type="button">${escapeHtml(display)}</button>
          </span>
        `;
      }

      function formatSetLabel(exercise, label) {
        return String(label || defaultSetValue(exercise.unit, exercise.name));
      }

      function renderSummary() {
        const stats = buildSummaryStats();
        document.getElementById('app').innerHTML = `
          ${renderTop('Статистика', '', { showTimer: false, titleAsDate: true })}
          <section class="summary">
            ${stats.sets ? renderStatsDashboard(stats) : renderEmptyStats()}
          </section>
          ${renderInstallCard()}
          ${renderBottomNav()}
        `;
      }

      function renderStatsDashboard(stats) {
        return `
          ${renderStatsOverview(stats)}

          <div class="chart-grid">
            ${renderExerciseStats(stats.rows)}
            ${renderUnitList(stats.unitRows)}
            ${renderWeekdayBars(stats.weekdays)}
            ${renderMonthBars(stats.months)}
          </div>
        `;
      }

      function renderEmptyStats() {
        return `
          <article class="empty-hero">
            <div>
              <h2>Статистика пока пустая</h2>
              <p class="muted">Отмечай выполненные подходы в неделе — здесь появятся графики, объём и лидеры.</p>
            </div>
          </article>
        `;
      }

      function renderStatsOverview(stats) {
        const score = clamp(stats.completionPercent, 0, 100);
        const status = score >= 100 ? 'План закрыт. Можно фиксировать победу и повышать планку.' : score >= 70 ? 'Хороший темп: осталось добить последние подходы.' : score >= 35 ? 'База набрана. Следующий рывок решит неделю.' : 'Разгон начался. Отметь первые подходы и набери темп.';
        return `
          <article class="stats-overview">
            <div class="stats-overview-head">
              <div class="stats-hero-copy">
                <span class="chart-label">Athlete dashboard</span>
                <h2>Форма недели</h2>
                <p>${escapeHtml(status)}</p>
              </div>
              <span class="stats-period">${escapeHtml(stats.periodLabel)}</span>
            </div>
            <div class="stats-hero-score">
              <div class="stats-score-top">
                <span class="stats-score-label">Выполнение плана</span>
                <span class="stats-score-badge">${formatNumber(stats.sets)}/${formatNumber(stats.plannedSets || stats.sets)}</span>
              </div>
              <strong>${formatNumber(score)}<small>%</small></strong>
              <span class="stats-score-status">${escapeHtml(formatCount(stats.workouts, ['тренировка', 'тренировки', 'тренировок']))} · ${escapeHtml(formatCount(stats.reps, ['повторение', 'повторения', 'повторений']))}</span>
              <div class="stats-progress">
                <div class="stats-progress-top">
                  <span>Прогресс к цели</span>
                  <strong>${formatNumber(stats.completionPercent)}%</strong>
                </div>
                <div class="stats-progress-meter" role="presentation"><i style="--value:${score}%"></i></div>
              </div>
            </div>
            <div class="stats-overview-grid">
              ${renderNumberCard('Тренировки', formatNumber(stats.workouts), `${formatNumber(stats.activeDays)} ${plural(stats.activeDays, ['день', 'дня', 'дней'])} в плане`)}
              ${renderNumberCard('Подходы', formatNumber(stats.sets), `${formatNumber(stats.plannedSets)} запланировано`)}
              ${renderNumberCard('Повторения', formatNumber(stats.reps), 'выполненный объём')}
            </div>
          </article>
        `;
      }

      function renderNumberCard(label, value, note) {
        return `
          <div class="stat-number-card">
            <span>${escapeHtml(label)}</span>
            <strong>${escapeHtml(value)}</strong>
            <em>${escapeHtml(note)}</em>
          </div>
        `;
      }

      function renderMonthBars(months) {
        if (!months.length) return '';
        return `
          <article class="chart-card wide">
            <div class="chart-title">
              <div>
                <span class="chart-label">Динамика</span>
                <h2>Подходы по месяцам</h2>
              </div>
              <span class="bar-note">${escapeHtml(formatCount(months.length, ['месяц', 'месяца', 'месяцев']))}</span>
            </div>
            <div class="month-bars" style="--month-count:${months.length}">
              ${months.map(month => `
                <div class="month-bar ${month.sets ? '' : 'empty'}" title="${escapeHtml(month.title)}: ${formatCount(month.sets, ['подход', 'подхода', 'подходов'])}">
                  <span>${formatNumber(month.sets)}</span>
                  <i style="--value:${clamp(month.percent, 0, 100)}%"></i>
                  <b>${escapeHtml(month.shortLabel)}</b>
                </div>
              `).join('')}
            </div>
          </article>
        `;
      }

      function renderExerciseStats(rows) {
        if (!rows.length) return '';
        return `
          <article class="chart-card wide">
            <div class="chart-title">
              <div>
                <span class="chart-label">Упражнения</span>
                <h2>Лидеры по объёму</h2>
              </div>
              <span class="bar-note">${escapeHtml(formatCount(rows.length, ['упражнение', 'упражнения', 'упражнений']))}</span>
            </div>
            <div class="exercise-stat-list">
              ${rows.map((row, index) => `
                <div class="exercise-stat-row rank-${index + 1}">
                  <div class="exercise-rank">#${index + 1}</div>
                  <div class="exercise-stat-text">
                    <strong>${escapeHtml(row.name)}</strong>
                    <span class="exercise-stat-meta">${escapeHtml(formatCount(row.sets, ['подход', 'подхода', 'подходов']))}</span>
                  </div>
                  <div class="exercise-stat-value">${escapeHtml(formatUnits(row.units, row.sets))}</div>
                </div>
              `).join('')}
            </div>
          </article>
        `;
      }

      function renderUnitList(unitRows) {
        if (!unitRows.length) return '';
        return `
          <article class="chart-card">
            <div class="chart-title">
              <div>
                <span class="chart-label">Объём</span>
                <h2>По типам нагрузки</h2>
              </div>
            </div>
            <div class="unit-list">
              ${unitRows.map(row => `
                <div class="unit-row">
