                  <span>${escapeHtml(row.label)}</span>
                  <strong class="unit-value">${escapeHtml(formatNumber(row.value))}</strong>
                  <span>${escapeHtml(row.text)}</span>
                </div>
              `).join('')}
            </div>
          </article>
        `;
      }

      function renderWeekdayBars(weekdays) {
        const peak = Math.max(...weekdays.map(day => day.sets), 0);
        return `
          <article class="chart-card">
            <div class="chart-title">
              <div>
                <span class="chart-label">Ритм</span>
                <h2>Нагрузка по дням</h2>
              </div>
            </div>
            <div class="weekday-stats">
              ${weekdays.map(day => `
                <div class="weekday-chip ${day.sets ? '' : 'empty'} ${day.sets && day.sets === peak ? 'peak' : ''}" title="${escapeHtml(day.label)}: ${formatCount(day.sets, ['подход', 'подхода', 'подходов'])}">
                  <span>${escapeHtml(day.short)}</span>
                  <strong>${formatNumber(day.sets)}</strong>
                </div>
              `).join('')}
            </div>
          </article>
        `;
      }

      function buildSummaryStats() {
        const rows = new Map();
        const workouts = new Set();
        const months = new Map();
        const weekdays = SHORT.map(short => ({ short, label: short, sets: 0 }));
        let sets = 0;
        let reps = 0;
        let plannedSets = 0;
        let activeDays = 0;
        let firstDate = null;
        let lastDate = null;

        Object.entries(state.weeks || {}).forEach(([, week]) => {
          (week?.days || []).forEach(day => {
            if (!isManualDay(day)) return;
            activeDays += 1;
            (day.exercises || []).forEach(exercise => { plannedSets += exercise.sets?.length || 0; });
          });
        });

        Object.entries(state.sessions || {}).forEach(([dateKey, session]) => {
          const week = getExistingWeek(weekStartKeyForDate(dateKey));
          const day = week?.days?.[slotForDate(dateKey)] || emptyDay();
          if (!isManualDay(day)) return;
          const exercises = day.exercises || [];
          let dayDone = false;

          Object.entries(session?.done || {}).forEach(([key, value]) => {
            if (!value) return;
            const [exIndex, setIndex] = key.split(':').map(Number);
            const fallbackExercise = exercises[exIndex];
            const payload = typeof value === 'object' ? value : null;
            const exerciseName = payload?.exercise || fallbackExercise?.name || 'Упражнение';
            const fallbackLabel = fallbackExercise?.sets?.[setIndex] || defaultSetValue('reps', exerciseName);
            const label = payload?.label || fallbackLabel;
            const metric = normalizeMetric(payload?.metric || setMetric(label));
            const rowName = exerciseName || payload?.group || groupExerciseName(exerciseName);
            const rowKey = rowName.toLowerCase();
            const row = rows.get(rowKey) || makeSummaryRow(rowName);
            const monthKey = dateKey.slice(0, 7);
            const month = months.get(monthKey) || makeMonthRow(monthKey);
            const weekday = weekdays[slotForDate(dateKey)];

            row.sets += 1;
            addMetric(row.units, metric);
            rows.set(rowKey, row);

            month.sets += 1;
            addMetric(month.units, metric);
            months.set(monthKey, month);

            weekday.sets += 1;
            sets += 1;
            if (metric.unit === 'повт') reps += metric.value;
            dayDone = true;
          });

          if (dayDone) {
            workouts.add(dateKey);
            if (!firstDate || dateKey < firstDate) firstDate = dateKey;
            if (!lastDate || dateKey > lastDate) lastDate = dateKey;
          }
        });

        const sortedRows = Array.from(rows.values()).sort((a, b) => primaryVolume(b) - primaryVolume(a) || b.sets - a.sets || a.name.localeCompare(b.name, 'ru'));
        const monthRows = buildMonthSeries(months, firstDate, lastDate);
        const maxMonthSets = Math.max(...monthRows.map(month => month.sets), 1);
        monthRows.forEach(month => { month.percent = month.sets / maxMonthSets * 100; });
        const maxUnitValue = Math.max(reps, sets, 1);

        return {
          sets,
          reps,
          workouts: workouts.size,
          plannedSets,
          activeDays,
          completionPercent: plannedSets ? Math.min(100, Math.round(sets / plannedSets * 100)) : (sets ? 100 : 0),
          periodLabel: firstDate && lastDate ? `${formatCompactDate(firstDate, true)}-${formatCompactDate(lastDate, true)}` : 'нет выполненных подходов',
          rows: sortedRows,
          months: monthRows,
          weekdays,
          maxUnitValue,
          unitRows: buildUnitRows({ sets, reps })
        };
      }

      function makeSummaryRow(name) {
        return { name, sets: 0, units: {} };
      }

      function makeMonthRow(monthKey) {
        return {
          key: monthKey,
          title: monthTitle(monthKey),
          shortLabel: monthShortLabel(monthKey),
          sets: 0,
          units: {},
          percent: 0
        };
      }

      function buildMonthSeries(months, firstDate, lastDate) {
        if (!firstDate || !lastDate) return [];
        const rows = [];
        let cursor = firstDate.slice(0, 7);
        const end = lastDate.slice(0, 7);
        while (cursor <= end) {
          rows.push(months.get(cursor) || makeMonthRow(cursor));
          cursor = nextMonthKey(cursor);
        }
        return rows;
      }

      function nextMonthKey(monthKey) {
        const [year, month] = monthKey.split('-').map(Number);
        const date = new Date(year, month, 1);
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
      }

      function monthTitle(monthKey) {
        const [year, month] = monthKey.split('-').map(Number);
        return formatMonth(new Date(year, month - 1, 1));
      }

      function monthShortLabel(monthKey) {
        const [year, month] = monthKey.split('-').map(Number);
        const label = new Intl.DateTimeFormat('ru-RU', { month: 'short' }).format(new Date(year, month - 1, 1)).replace('.', '');
        return `${label} ${String(year).slice(2)}`;
      }

      function buildUnitRows(stats) {
        const rows = [];
        if (stats.reps) rows.push({ label: 'Повторения', value: stats.reps, text: formatCount(stats.reps, ['повторение', 'повторения', 'повторений']) });
        rows.push({ label: 'Подходы', value: stats.sets, text: formatCount(stats.sets, ['подход', 'подхода', 'подходов']) });
        return rows;
      }

      function setMetric(label) {
        const text = String(label || '').toLowerCase().replace(',', '.');
        const match = text.match(/\d+(?:\.\d+)?/);
        const value = match ? Number(match[0]) : 0;
        return { unit: 'повт', value };
      }

      function normalizeMetric(metric) {
        const value = Number(metric?.value || 0);
        const safeValue = Number.isFinite(value) ? value : 0;
        return { unit: 'повт', value: safeValue };
      }

      function addMetric(units, metric) {
        if (!metric.value) return;
        units[metric.unit] = (units[metric.unit] || 0) + metric.value;
      }

      function primaryVolume(row) {
        return row.units['повт'] || row.sets;
      }

      function formatUnits(units, fallbackSets = 0) {
        return units['повт'] ? `${formatNumber(units['повт'])} ${unitName('повт', units['повт'])}` : formatCount(fallbackSets, ['подход', 'подхода', 'подходов']);
      }

      function unitName(unit, value) {
        if (unit === 'повт') return plural(value, ['повторение', 'повторения', 'повторений']);
        return unit;
      }

      function groupExerciseName(name) {
        const cleaned = String(name || 'Упражнение')
          .replace(/\s+\+?\d+(?:[,.]\d+)?\s*кг/ig, '')
          .replace(/\s+/g, ' ')
          .trim();
        const lower = cleaned.toLowerCase();
        if (lower.startsWith('подтяг')) return 'Подтягивания';
        if (lower.startsWith('присед')) return 'Приседания';
        if (lower === 'брусья') return 'Брусья';
        return cleaned || 'Упражнение';
      }

      function makeDonePayload(exercise, label) {
        return {
          exercise: exercise?.name || 'Упражнение',
          group: groupExerciseName(exercise?.name),
          label: label || defaultSetValue(exercise?.unit || 'reps', exercise?.name),
          metric: setMetric(label),
          completedAt: new Date().toISOString()
        };
      }

      function formatNumber(value) {
        const number = Number(value || 0);
        if (Number.isInteger(number)) return String(number);
        return number.toLocaleString('ru-RU', { maximumFractionDigits: 1 });
      }

      function touchWeek(dateKey) {
        const week = getWeek(weekStartKeyForDate(dateKey));
        week.updatedAt = new Date().toISOString();
        return week;
      }

      function setDayActive(dateKey, active) {
        const day = getDay(dateKey);
        day.active = Boolean(active);
        if (!day.active) {
          day.manual = false;
          day.label = '';
          day.exercises = [];
          delete state.sessions[dateKey];
          stopTimer();
          if (openDateKey === dateKey) openDateKey = null;
        } else {
          day.manual = true;
          openDateKey = dateKey;
          showAddDayForm = false;
        }
        touchWeek(dateKey);
        saveNow();
        render();
      }

      function cloneDay(day) {
        return cleanDay(JSON.parse(JSON.stringify(day || emptyDay())));
      }

      function cloneData(value) {
        return value == null ? null : JSON.parse(JSON.stringify(value));
      }

      function addCustomDay(dateKey) {
        const weekKey = weekStartKeyForOffset(weekOffset);
        const dates = weekDates(weekKey);
        if (!isDateKey(dateKey) || !dates.includes(dateKey)) {
          toast('Выбери дату из этой недели');
          return;
        }
        if (hasExistingManualDay(dateKey)) {
          toast('На эту дату уже есть день');
          render();
          return;
        }

        const day = getDay(dateKey);
        day.active = true;
        day.manual = true;
        day.label = weekdayName(dateKey);
        day.exercises = Array.isArray(day.exercises) ? day.exercises : [];
        openDateKey = dateKey;
        showAddDayForm = false;
        touchWeek(dateKey);
        saveNow();
        render();
        setTimeout(() => document.querySelector(`[data-action="add-exercise"][data-date="${dateKey}"]`)?.focus(), 40);
      }

      function moveDayDate(fromDateKey, toDateKey) {
        if (!isDateKey(fromDateKey) || !isDateKey(toDateKey)) {
          toast('Некорректная дата');
          render();
          return;
        }
        if (fromDateKey === toDateKey) return;
        const sourceWeek = getExistingWeek(weekStartKeyForDate(fromDateKey));
        const sourceSlot = slotForDate(fromDateKey);
        const sourceDay = sourceWeek?.days?.[sourceSlot];
        if (!isManualDay(sourceDay)) {
          toast('День не найден');
          render();
          return;
        }
        if (hasExistingManualDay(toDateKey)) {
          toast('На эту дату уже есть день');
          render();
          return;
        }

        const targetWeek = getWeek(weekStartKeyForDate(toDateKey));
        const targetSlot = slotForDate(toDateKey);
        const targetDay = cloneDay(sourceDay);
        targetDay.label = customDayTitle(fromDateKey, sourceDay) || weekdayName(toDateKey);
        targetWeek.days[targetSlot] = targetDay;
        sourceWeek.days[sourceSlot] = emptyDay();

        if (state.sessions[fromDateKey]) {
          state.sessions[toDateKey] = state.sessions[fromDateKey];
          state.sessions[toDateKey].updatedAt = new Date().toISOString();
          delete state.sessions[fromDateKey];
        } else {
          delete state.sessions[toDateKey];
        }

        sourceWeek.updatedAt = new Date().toISOString();
        targetWeek.updatedAt = new Date().toISOString();
        openDateKey = toDateKey;
        weekOffset = weekOffsetForDate(toDateKey);
        showAddDayForm = false;
        saveNow();
        render();
        toast('День перенесён');
      }

      function updateExerciseName(dateKey, exIndex, name) {
        const day = getDay(dateKey);
        const exercise = day.exercises[exIndex];
        if (!exercise) return;
        exercise.name = String(name ?? '');
        exercise.unit = 'reps';
        updateDoneExercise(dateKey, exIndex);
        touchWeek(dateKey);
        scheduleSave();
      }

      function updateDoneExercise(dateKey, exIndex) {
        const session = state.sessions[dateKey];
        const exercise = getDay(dateKey).exercises[exIndex];
        if (!session?.done || !exercise) return;
        Object.entries(session.done).forEach(([key, value]) => {
          const [currentEx, setIndex] = key.split(':').map(Number);
          if (currentEx !== exIndex || !value || typeof value !== 'object') return;
          const label = exercise.sets[setIndex] || defaultSetValue(exercise.unit, exercise.name);
          value.exercise = exercise.name || 'Упражнение';
          value.group = groupExerciseName(exercise.name);
          value.label = label;
          value.metric = setMetric(label);
        });
        session.updatedAt = new Date().toISOString();
      }

      function updateDoneSet(dateKey, exIndex, setIndex) {
        const session = state.sessions[dateKey];
        const key = `${exIndex}:${setIndex}`;
        const value = session?.done?.[key];
        const exercise = getDay(dateKey).exercises[exIndex];
        if (!value || typeof value !== 'object' || !exercise) return;
        const label = exercise.sets[setIndex] || defaultSetValue(exercise.unit, exercise.name);
        value.exercise = exercise.name || 'Упражнение';
        value.group = groupExerciseName(exercise.name);
        value.label = label;
        value.metric = setMetric(label);
        session.updatedAt = new Date().toISOString();
      }

      function addExercise(dateKey) {
        const day = getDay(dateKey);
        day.active = true;
        day.manual = true;
        day.exercises.push({ name: '', unit: 'reps', sets: ['10'] });
        openDateKey = dateKey;
        touchWeek(dateKey);
        saveNow();
        render();
        setTimeout(() => {
          const inputs = document.querySelectorAll(`input[data-field="exercise-name"][data-date="${dateKey}"]`);
          inputs[inputs.length - 1]?.focus();
        }, 40);
      }

      function removeExercise(dateKey, exIndex) {
        const day = getDay(dateKey);
        if (!day.exercises[exIndex]) return;
        day.exercises.splice(exIndex, 1);
        shiftSessionAfterExerciseRemoval(dateKey, exIndex);
        touchWeek(dateKey);
        saveNow();
        render();
      }

      function deleteExerciseWithUndo(dateKey, exIndex) {
        const day = getDay(dateKey);
        const exercise = day.exercises[exIndex];
        if (!exercise) return;
        const snapshot = cloneData(exercise);
        const sessionSnapshot = cloneData(state.sessions[dateKey]);
        const name = snapshot.name || 'упражнение';
        removeExercise(dateKey, exIndex);
        toast(`Удалено: ${name}`, {
          label: 'Вернуть',
          onClick: () => restoreExercise(dateKey, exIndex, snapshot, sessionSnapshot)
        });
      }

      function restoreExercise(dateKey, exIndex, exerciseSnapshot, sessionSnapshot) {
        const day = getDay(dateKey);
        const index = clamp(exIndex, 0, day.exercises.length);
        day.active = true;
        day.manual = true;
        if (!day.label) day.label = weekdayName(dateKey);
        day.exercises.splice(index, 0, cleanExercise(exerciseSnapshot));
        if (sessionSnapshot) state.sessions[dateKey] = sessionSnapshot;
        else delete state.sessions[dateKey];
        openDateKey = dateKey;
        touchWeek(dateKey);
        saveNow();
        render();
      }

      function deleteDayWithUndo(dateKey) {
        const week = getExistingWeek(weekStartKeyForDate(dateKey));
        const slot = slotForDate(dateKey);
        const day = week?.days?.[slot];
        if (!isManualDay(day)) return;
        const daySnapshot = cloneDay(day);
        const sessionSnapshot = cloneData(state.sessions[dateKey]);
        const title = dayTitle(dateKey, day);
        setDayActive(dateKey, false);
        toast(`День удалён: ${title}`, {
          label: 'Вернуть',
          onClick: () => restoreDay(dateKey, daySnapshot, sessionSnapshot)
        });
      }

      function restoreDay(dateKey, daySnapshot, sessionSnapshot) {
        const week = getWeek(weekStartKeyForDate(dateKey));
        const slot = slotForDate(dateKey);
        week.days[slot] = cloneDay(daySnapshot);
        week.days[slot].active = true;
        week.days[slot].manual = true;
        week.days[slot].label = week.days[slot].label || weekdayName(dateKey);
        if (sessionSnapshot) state.sessions[dateKey] = sessionSnapshot;
        else delete state.sessions[dateKey];
        openDateKey = dateKey;
        weekOffset = weekOffsetForDate(dateKey);
        showAddDayForm = false;
        week.updatedAt = new Date().toISOString();
        saveNow();
        render();
      }

      function shiftSessionAfterExerciseRemoval(dateKey, removedExIndex) {
        const session = state.sessions[dateKey];
        if (!session?.done) return;
        const nextDone = {};
        Object.entries(session.done).forEach(([key, value]) => {
          const [exIndex, setIndex] = key.split(':').map(Number);
          if (exIndex < removedExIndex) nextDone[key] = value;
          if (exIndex > removedExIndex) nextDone[`${exIndex - 1}:${setIndex}`] = value;
        });
        session.done = nextDone;
        session.updatedAt = new Date().toISOString();
        if (!Object.keys(session.done).length) delete state.sessions[dateKey];
      }

      function updateLineSetCount(dateKey, exIndex, delta) {
        const day = getDay(dateKey);
        const exercise = day.exercises[exIndex];
        if (!exercise) return;
        exercise.unit = 'reps';
        if (delta > 0) exercise.sets.push(exercise.sets[exercise.sets.length - 1] || defaultSetValue(exercise.unit, exercise.name));
        if (delta < 0 && exercise.sets.length > 1) {
          exercise.sets.pop();
          cleanupSessionForDay(dateKey);
        }
        touchWeek(dateKey);
        saveNow();
        render();
      }

      function setSetValue(dateKey, exIndex, setIndex, value) {
        const day = getDay(dateKey);
        const exercise = day.exercises[exIndex];
        if (!exercise || !(setIndex in exercise.sets)) return;
        exercise.sets[setIndex] = normalizeSetLabel(value, exercise.unit);
        updateDoneSet(dateKey, exIndex, setIndex);
        touchWeek(dateKey);
        saveNow();
        render();
      }

      function adjustSetValue(dateKey, exIndex, setIndex, delta) {
        const day = getDay(dateKey);
        const exercise = day.exercises[exIndex];
        if (!exercise || !(setIndex in exercise.sets)) return;
        const current = Number(String(exercise.sets[setIndex]).match(/\d+(?:\.\d+)?/)?.[0] || 0);
        const next = Math.max(0, current + Number(delta || 0));
        setSetValue(dateKey, exIndex, setIndex, next);
      }

      function editSetValue(target) {
        const dateKey = target.dataset.date;
        const exIndex = Number(target.dataset.ex);
        const setIndex = Number(target.dataset.set);
        const exercise = getDay(dateKey).exercises[exIndex];
        if (!exercise || !(setIndex in exercise.sets)) return;
        exercise.unit = 'reps';
        const current = String(exercise.sets[setIndex] || defaultSetValue(exercise.unit, exercise.name));
        const next = prompt('Сколько повторений?', current);
        if (next === null) return;
        setSetValue(dateKey, exIndex, setIndex, next);
      }

      function editDayTitle(dateKey) {
        if (!isDateKey(dateKey)) return;
        const day = getDay(dateKey);
        if (!isManualDay(day)) return;
        const current = dayTitle(dateKey, day);
        const next = prompt('Название дня. Оставь пустым, чтобы вернуть день недели.', current);
        if (next === null) return;
        const title = String(next).trim().slice(0, 64);
        day.label = title && title !== weekdayName(dateKey) ? title : weekdayName(dateKey);
        day.manual = true;
        day.active = true;
        touchWeek(dateKey);
        saveNow();
        render();
      }

      function cleanupSessionForDay(dateKey) {
        const session = state.sessions[dateKey];
        if (!session?.done) return;
        const day = getDay(dateKey);
        Object.keys(session.done).forEach(key => {
          const [exIndex, setIndex] = key.split(':').map(Number);
          if (!day.active || !day.exercises[exIndex] || !(setIndex in day.exercises[exIndex].sets)) delete session.done[key];
        });
        session.updatedAt = new Date().toISOString();
        if (!Object.keys(session.done).length) delete state.sessions[dateKey];
      }

      function toggleSet(dateKey, exIndex, setIndex) {
        const session = getSession(dateKey);
        const key = `${exIndex}:${setIndex}`;
        const wasDone = Boolean(session.done[key]);
        if (wasDone) {
          delete session.done[key];
          stopTimer();
        } else {
          const exercise = getDay(dateKey).exercises[exIndex];
          const label = exercise?.sets?.[setIndex] || defaultSetValue(exercise?.unit || 'reps', exercise?.name);
          session.done[key] = makeDonePayload(exercise, label);
        }
        session.updatedAt = new Date().toISOString();
        if (!Object.keys(session.done).length) delete state.sessions[dateKey];
        saveNow();

        if (!wasDone && isDayComplete(dateKey)) {
          openDateKey = '';
          stopTimer();
          render();
          return;
        }

        render();
        if (!wasDone) startTimer();
      }

      function handleSubmit(form) {
        if (form.dataset.form !== 'add-day') return;
        const dateInput = form.elements.dayDate;
        const dateKey = String(dateInput?.value || '').trim();
        if (!isDateKey(dateKey)) {
          dateInput?.focus();
          toast('Выбери дату дня');
          return;
        }
        addCustomDay(dateKey);
      }

      function closeBottomMenus(exceptMenu) {
        document.querySelectorAll('.bottom-menu.open').forEach(menu => {
          if (exceptMenu && menu === exceptMenu) return;
          menu.classList.remove('open');
          menu.querySelector('.bottom-menu-toggle')?.setAttribute('aria-expanded', 'false');
        });
      }

      function handleAction(target) {
        const action = target.dataset.action;
        if (action === 'toggle-menu') {
          const menu = target.closest('.bottom-menu');
          const isOpen = menu?.classList.toggle('open');
          target.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
          closeBottomMenus(menu);
          return;
        }
        const menuItem = target.closest('.bottom-menu-items');
        if (menuItem) {
          const menu = target.closest('.bottom-menu');
          menu?.classList.remove('open');
          menu?.querySelector('.bottom-menu-toggle')?.setAttribute('aria-expanded', 'false');
        }
        if (action === 'view-week') {
          view = 'week';
          showAddDayForm = false;
          render();
          resetScrollPosition();
          return;
        }
        if (action === 'view-summary') {
          view = 'summary';
          render();
          resetScrollPosition();
          return;
        }
        if (action === 'open-week-picker') { openWeekPicker(); return; }
        if (action === 'open-day') { openDateKey = openDateKey === target.dataset.date ? '' : target.dataset.date; showAddDayForm = false; render(); return; }
        if (action === 'show-add-day') { showAddDayForm = true; openDateKey = ''; render(); return; }
        if (action === 'hide-add-day') {
          const weekKey = weekStartKeyForOffset(weekOffset);
          const dates = weekDates(weekKey);
          const week = getRenderableWeek(weekKey);
          const hasVisibleDays = dates.some(dateKey => isManualDay(week.days[slotForDate(dateKey)]));
          showAddDayForm = !hasVisibleDays;
          render();
          return;
        }
        if (action === 'data') { openDataSheet(); return; }
        if (action === 'install-app') { installApp(); return; }
        if (action === 'dismiss-install') { dismissInstallPrompt(); return; }
        if (action === 'close-sheet') { closeSheet(); return; }
        if (action === 'confirm-clear-app') { openClearAppConfirm(); return; }
        if (action === 'cancel-clear-app') { openDataSheet(); return; }
        if (action === 'clear-app') { clearAppData(); return; }
        if (action === 'copy-json') { copyJson(); return; }
        if (action === 'export-json') { exportJson(); return; }
        if (action === 'import-json') { importJson(); return; }
        if (action === 'close-swipe') { closeSwipe(target.closest('[data-swipe]')); return; }
        if (action === 'delete-day') { closeSwipe(target.closest('[data-swipe]')); deleteDayWithUndo(target.dataset.date); return; }
        if (action === 'delete-exercise') { closeSwipe(target.closest('[data-swipe]')); deleteExerciseWithUndo(target.dataset.date, Number(target.dataset.ex)); return; }
        if (action === 'add-exercise') { addExercise(target.dataset.date); return; }
        if (action === 'toggle') { toggleSet(target.dataset.date, Number(target.dataset.ex), Number(target.dataset.set)); return; }
        if (action === 'add-set' || action === 'remove-set') {
          updateLineSetCount(target.dataset.date, Number(target.dataset.ex), action === 'add-set' ? 1 : -1);
          return;
        }
        if (action === 'adjust-set') {
          adjustSetValue(target.dataset.date, Number(target.dataset.ex), Number(target.dataset.set), Number(target.dataset.delta));
          return;
        }
        if (action === 'edit-set') {
          editSetValue(target);
        }
      }

      function handleInput(target) {
        const field = target.dataset.field;
        if (field === 'exercise-name') {
          updateExerciseName(target.dataset.date, Number(target.dataset.ex), target.value);
        }
      }

      function handleChange(target) {
        const field = target.dataset.field;
        if (field === 'add-day-date') {
          addCustomDay(target.value);
          return;
        }
        if (field === 'week-picker') {
          selectWeek(target.value);
          return;
        }
        if (field === 'day-date') {
          moveDayDate(target.dataset.date, target.value);
          return;
        }
      }

      function handleBlur(target) {
        if (target.dataset.field !== 'exercise-name') return;
        flushSave();
        render();
      }

      function openWeekPicker() {
        const picker = document.getElementById('weekPicker');
        if (!picker) return;
        picker.focus({ preventScroll: true });
        if (typeof picker.showPicker === 'function') {
          picker.showPicker();
        } else {
          picker.click();
        }
      }

      function selectWeek(value) {
        if (!isDateKey(value)) {
          toast('Выбери дату недели');
          return;
        }
        weekOffset = weekOffsetForDate(value);
        openDateKey = null;
        showAddDayForm = false;
        render();
      }

      function openDataSheet() {
        flushSave();
        const sheet = document.getElementById('sheet');
        sheet.innerHTML = `
          <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
            <div class="title-row">
              <h2 id="sheetTitle">JSON</h2>
              <button data-action="close-sheet" type="button" aria-label="Закрыть настройки">Закрыть</button>
            </div>
            <div class="toolbar">
              <button class="dark" data-action="copy-json" type="button">Копировать</button>
              <button data-action="export-json" type="button">Скачать</button>
              <button data-action="import-json" type="button">Импорт</button>
              <button class="danger" data-action="confirm-clear-app" type="button">Очистить приложение</button>
            </div>
            <textarea id="jsonBox" class="json-box">${escapeHtml(JSON.stringify(state, null, 2))}</textarea>
          </div>
        `;
        sheet.classList.add('show');
        sheet.setAttribute('aria-hidden', 'false');
      }

      function openClearAppConfirm() {
        const sheet = document.getElementById('sheet');
        sheet.innerHTML = `
          <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
            <div class="title-row">
              <h2 id="sheetTitle">Очистить приложение</h2>
              <button data-action="cancel-clear-app" type="button" aria-label="Вернуться в настройки">Нет</button>
            </div>
            <p class="muted">Очистить все тренировки и память?</p>
            <div class="toolbar">
              <button class="danger" data-action="clear-app" type="button">Да</button>
              <button class="dark" data-action="cancel-clear-app" type="button">Нет</button>
            </div>
          </div>
        `;
        sheet.classList.add('show');
        sheet.setAttribute('aria-hidden', 'false');
      }

      function openInstallHelpSheet() {
        const ios = isIos();
        const text = ios
          ? 'На iPhone нажми «Поделиться» в Safari и выбери «На экран Домой».'
          : 'Если системное окно не появилось, открой меню браузера и выбери «Установить приложение» или «Добавить на главный экран».';
        const sheet = document.getElementById('sheet');
        sheet.innerHTML = `
          <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
            <div class="title-row">
              <h2 id="sheetTitle">Сохранить приложение</h2>
              <button data-action="close-sheet" type="button" aria-label="Закрыть подсказку">Закрыть</button>
            </div>
            <p class="muted">${escapeHtml(text)}</p>
            <div class="toolbar">
              <button class="dark" data-action="close-sheet" type="button">Понятно</button>
            </div>
          </div>
        `;
        sheet.classList.add('show');
        sheet.setAttribute('aria-hidden', 'false');
      }

      function closeSheet() {
        const sheet = document.getElementById('sheet');
        sheet.classList.remove('show');
        sheet.setAttribute('aria-hidden', 'true');
      }

      function clearAppData() {
        clearTimeout(saveTimer);
        saveTimer = null;
        [STORAGE_KEY, ...OLD_KEYS].forEach(key => {
          try { localStorage.removeItem(key); } catch (_) {}
        });
        state = defaultState();
        view = 'week';
        weekOffset = 0;
        openDateKey = null;
        showAddDayForm = false;
        stopTimer();
        applyTheme();
        saveNow();
        closeSheet();
        render();
        resetScrollPosition();
        toast('Приложение очищено');
      }

      async function copyJson() {
        const text = JSON.stringify(state, null, 2);
        try {
          await navigator.clipboard.writeText(text);
          toast('Скопировано');
        } catch (_) {
          const box = document.getElementById('jsonBox');
          box?.focus();
          box?.select();
          toast('Выделил текст');
        }
      }

      function exportJson() {
        flushSave();
        const text = JSON.stringify(state, null, 2);
        const blob = new Blob([text], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `sport-${todayKey()}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function importJson() {
        const box = document.getElementById('jsonBox');
        try {
          state = normalize(JSON.parse(box.value));
          applyTheme();
          saveNow();
          closeSheet();
          render();
          toast('Импортировано');
        } catch (_) {
          toast('JSON битый');
        }
      }

      function isStandaloneMode() {
        return window.matchMedia?.('(display-mode: standalone)').matches || window.navigator.standalone === true;
      }

      function isIos() {
        return /iphone|ipad|ipod/i.test(navigator.userAgent || '') || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      }

      function hasDismissedInstallPrompt() {
        try { return sessionStorage.getItem(INSTALL_PROMPT_SESSION_KEY) === todayKey(); } catch (_) { return false; }
      }

      function markInstallPromptDismissed() {
        try { sessionStorage.setItem(INSTALL_PROMPT_SESSION_KEY, todayKey()); } catch (_) {}
      }

      function shouldShowInstallPrompt() {
        return !isStandaloneMode() && !hasDismissedInstallPrompt();
      }

      function dismissInstallPrompt() {
        markInstallPromptDismissed();
        render();
      }

      async function installApp() {
        markInstallPromptDismissed();
        if (deferredInstallPrompt) {
          const promptEvent = deferredInstallPrompt;
          deferredInstallPrompt = null;
          try {
            await promptEvent.prompt();
            const choice = await promptEvent.userChoice;
            toast(choice?.outcome === 'accepted' ? 'Сохраняю приложение' : 'Можно сохранить позже');
            render();
            return;
          } catch (_) {
            toast('Показываю инструкцию');
          }
        }
        render();
        openInstallHelpSheet();
      }

      function setupInstallPrompt() {
        window.addEventListener('beforeinstallprompt', event => {
          event.preventDefault();
          deferredInstallPrompt = event;
          if (shouldShowInstallPrompt()) render();
        });
        window.addEventListener('appinstalled', () => {
          deferredInstallPrompt = null;
          markInstallPromptDismissed();
          toast('Приложение сохранено');
          render();
        });
      }

      function toast(message, action = null) {
        const node = document.getElementById('toast');
        node.textContent = '';

        const text = document.createElement('span');
        text.textContent = message;
        node.appendChild(text);

        if (action?.label && typeof action.onClick === 'function') {
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = action.label;
          button.addEventListener('click', event => {
            event.preventDefault();
            clearTimeout(toastTimer);
            node.classList.remove('show');
            action.onClick();
          });
          node.appendChild(button);
        }

        node.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => node.classList.remove('show'), action ? 4200 : 1600);
      }

      function registerServiceWorker() {
        if (!('serviceWorker' in navigator)) return;
        if (!window.isSecureContext && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js?v=1.0.28', { updateViaCache: 'none' })
            .then(registration => {
              registration.update().catch(() => {});
              if (registration.waiting) registration.waiting.postMessage({ type: 'SKIP_WAITING' });
              registration.addEventListener('updatefound', () => {
                const worker = registration.installing;
                if (!worker) return;
                worker.addEventListener('statechange', () => {
                  if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                    worker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              });
            })
            .catch(() => {});
        });
      }

      function clearLongPress() {
        clearTimeout(longPressTimer);
        longPressTimer = null;
        longPressTarget = null;
      }

      function swipePoint(event) {
        return { x: event.clientX ?? 0, y: event.clientY ?? 0 };
      }

      function swipeWidth(node) {
        const actions = node?.querySelector(':scope > .swipe-actions');
        return actions?.offsetWidth || 154;
      }

      function closeSwipe(node = null) {
        const targets = node ? [node] : Array.from(document.querySelectorAll('.swipe-open, .swiping'));
        targets.forEach(target => {
          target.classList.remove('swipe-open', 'swiping');
          target.style.removeProperty('--swipe-x');
        });
      }

      function closeOtherSwipes(node) {
        document.querySelectorAll('.swipe-open, .swiping').forEach(openNode => {
          if (openNode !== node) closeSwipe(openNode);
        });
      }

      function startSwipe(event) {
        if (event.button !== undefined && event.button !== 0) return;
        const node = event.target.closest('[data-swipe][data-date]');
        if (!node) {
          if (!event.target.closest('.toast')) closeSwipe();
          return;
        }
        if (event.target.closest('.swipe-actions')) return;
        const focusedField = event.target.closest('input, textarea, select');
        if (event.target.closest('label') || (focusedField && focusedField === document.activeElement)) return;
        const point = swipePoint(event);
        closeOtherSwipes(node);
        swipeState = {
          node,
          pointerId: event.pointerId,
          startX: point.x,
          startY: point.y,
          dx: 0,
          width: swipeWidth(node),
          swiping: false,
          wasOpen: node.classList.contains('swipe-open')
        };
      }

      function moveSwipe(event) {
        if (!swipeState || (event.pointerId !== undefined && event.pointerId !== swipeState.pointerId)) return;
        const point = swipePoint(event);
        const dx = point.x - swipeState.startX;
        const dy = point.y - swipeState.startY;
        if (!swipeState.swiping) {
          if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) {
            swipeState = null;
            return;
          }
          if (Math.abs(dx) < 10) return;
          swipeState.swiping = true;
          clearLongPress();
          swipeState.node.classList.add('swiping');
          swipeState.node.classList.remove('swipe-open');
          swipeState.node.setPointerCapture?.(swipeState.pointerId);
        }
        event.preventDefault();
        swipeState.dx = dx;
        const base = swipeState.wasOpen ? -swipeState.width : 0;
        const offset = clamp(base + dx, -swipeState.width, 0);
        swipeState.node.style.setProperty('--swipe-x', `${offset}px`);
      }

      function endSwipe(event) {
        if (!swipeState || (event.pointerId !== undefined && event.pointerId !== swipeState.pointerId)) return;
        const { node, dx, width, swiping, wasOpen } = swipeState;
        swipeState = null;
        if (!swiping) return;
        node.releasePointerCapture?.(event.pointerId);
        node.classList.remove('swiping');
        node.style.removeProperty('--swipe-x');
        const shouldOpen = wasOpen ? dx <= width * 0.35 : dx < -width * 0.35;
        node.classList.toggle('swipe-open', shouldOpen);
        if (Math.abs(dx) > 12) ignoreNextClick = true;
      }

      function longPressAction(target) {
        if (target.matches('.set[data-action="toggle"]')) return () => editSetValue(target);
        if (target.matches('[data-day-title][data-date]')) return () => editDayTitle(target.dataset.date);
        if (target.matches('.exercise[data-date][data-ex]')) {
          return () => deleteExerciseWithUndo(target.dataset.date, Number(target.dataset.ex));
        }
        if (target.matches('.day[data-date]')) {
          return () => deleteDayWithUndo(target.dataset.date);
        }
        return null;
      }

      function startLongPress(event) {
        if (event.button !== undefined && event.button !== 0) return;
        const target = event.target.closest('.set[data-action="toggle"], [data-day-title][data-date], .exercise[data-date][data-ex], .day[data-date]');
        if (!target) return;
        if (target.matches('[data-day-title][data-date]') && event.target.closest('input, textarea, select, label')) return;
        if (target.classList.contains('exercise') && event.target.closest('.set, .set-control, input, button, textarea, select, label')) return;
        if (target.classList.contains('day') && event.target.closest('.exercise, .day-date-wrap, [data-action="add-exercise"], input, textarea, select, button, label')) return;
        clearLongPress();
        longPressTarget = target;
        longPressStartX = event.clientX ?? event.touches?.[0]?.clientX ?? 0;
        longPressStartY = event.clientY ?? event.touches?.[0]?.clientY ?? 0;
        longPressTimer = setTimeout(() => {
          if (!longPressTarget) return;
          ignoreNextClick = true;
          const action = longPressAction(longPressTarget);
          clearLongPress();
          action?.();
        }, 620);
      }

      function moveLongPress(event) {
        if (!longPressTarget) return;
        const point = event.touches?.[0] || event;
        const x = point.clientX ?? longPressStartX;
        const y = point.clientY ?? longPressStartY;
        if (Math.abs(x - longPressStartX) > 12 || Math.abs(y - longPressStartY) > 12) clearLongPress();
      }

      document.addEventListener('pointerdown', event => { startSwipe(event); startLongPress(event); });
      document.addEventListener('pointermove', event => { moveSwipe(event); moveLongPress(event); });
      document.addEventListener('pointerup', event => { endSwipe(event); clearLongPress(); });
      document.addEventListener('pointercancel', event => { endSwipe(event); clearLongPress(); });
      document.addEventListener('contextmenu', event => {
        if (!event.target.closest('.set[data-action="toggle"], .exercise[data-date][data-ex], .day[data-date]')) return;
        event.preventDefault();
      });

      document.addEventListener('click', event => {
        if (ignoreNextClick) {
          ignoreNextClick = false;
          event.preventDefault();
          return;
        }
        const menu = event.target.closest('.bottom-menu');
        const target = event.target.closest('[data-action]');
        if (!menu) closeBottomMenus();
        if (!target) return;
        event.preventDefault();
        handleAction(target);
      });

      document.addEventListener('submit', event => {
        const form = event.target.closest('form[data-form]');
        if (!form) return;
        event.preventDefault();
        handleSubmit(form);
      });
      document.addEventListener('input', event => handleInput(event.target));
      document.addEventListener('change', event => handleChange(event.target));
      document.addEventListener('blur', event => handleBlur(event.target), true);
      window.addEventListener('pagehide', () => {
        flushSave();
        releaseWakeLock();
      });
      window.addEventListener('pageshow', requestWakeLock);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') {
          flushSave();
          releaseWakeLock();
        } else {
          requestWakeLock();
        }
      });

      setupInstallPrompt();
      registerServiceWorker();
      state = loadState();
      applyTheme();
      saveNow();
      render();
    })();
  </script>
</body>
</html>
