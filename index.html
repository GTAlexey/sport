<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Спорт">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Спорт">
  <meta name="description" content="Спортивные недели, кнопки-подходы и сводка прогресса.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>Спорт</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f4;
      --card: #ffffff;
      --ink: #151515;
      --muted: #77756f;
      --line: #e4e1da;
      --soft: #f1efe8;
      --accent: #111111;
      --done: #1f8f52;
      --danger: #c9342f;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 16px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100dvh;
      padding: 12px 12px calc(24px + var(--safe-bottom));
    }

    button, textarea, input { font: inherit; }

    button {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      color: var(--ink);
      padding: 0 14px;
      font-weight: 700;
      touch-action: manipulation;
    }

    button:active { transform: scale(0.98); }
    button.dark { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.danger { color: var(--danger); }
    button.small { min-height: 32px; padding: 0 10px; font-size: 0.9rem; }

    .app {
      width: min(100%, 760px);
      margin: 0 auto;
      display: grid;
      gap: 12px;
    }

    .top {
      position: sticky;
      top: 0;
      z-index: 10;
      margin: -12px -12px 0;
      padding: calc(12px + env(safe-area-inset-top, 0px)) 12px 10px;
      background: rgba(247, 247, 244, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(228, 225, 218, 0.8);
    }

    .top-inner {
      width: min(100%, 760px);
      margin: 0 auto;
      display: grid;
      gap: 10px;
    }

    .title-row,
    .week-row,
    .day-head,
    .exercise-head,
    .toolbar,
    .tabs,
    .stat-head,
    .stat-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 1.45rem; letter-spacing: -0.04em; }
    h2 { font-size: 1.06rem; letter-spacing: -0.02em; }
    h3 { font-size: 1rem; letter-spacing: -0.02em; }

    .muted { color: var(--muted); }
    .tiny { font-size: 0.82rem; line-height: 1.35; }
    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 5px 9px;
      background: var(--soft);
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 800;
      white-space: nowrap;
    }
    .pill.today { background: #111; color: #fff; }
    .pill.done { background: #e3f7ea; color: var(--done); }

    .tabs { justify-content: flex-start; }
    .tabs button { flex: 1 1 0; }

    .card {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      overflow: hidden;
    }

    .day {
      display: grid;
      gap: 10px;
      padding: 14px;
    }

    .day.today {
      border-color: #111;
      box-shadow: 0 8px 28px rgba(0,0,0,0.08);
    }

    textarea {
      width: 100%;
      min-height: 96px;
      border: 0;
      outline: 0;
      resize: vertical;
      border-radius: 14px;
      background: #fafaf8;
      color: var(--ink);
      padding: 12px;
      line-height: 1.42;
      font-size: 1rem;
      box-shadow: inset 0 0 0 1px var(--line);
    }

    textarea:focus { background: #fff; box-shadow: inset 0 0 0 2px #111; }

    .progress {
      height: 8px;
      border-radius: 999px;
      background: var(--soft);
      overflow: hidden;
    }
    .progress > i {
      display: block;
      height: 100%;
      width: var(--value, 0%);
      background: var(--done);
      border-radius: inherit;
    }

    .exercises {
      display: grid;
      gap: 8px;
    }

    .exercise {
      display: grid;
      gap: 8px;
      padding: 10px;
      border-radius: 15px;
      background: #fafaf8;
      border: 1px solid var(--line);
    }

    .exercise.done { background: #f0fbf4; border-color: #ccebd8; }

    .set-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .set {
      min-width: 44px;
      min-height: 40px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      padding: 0 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }

    .set.done {
      background: var(--done);
      color: #fff;
      border-color: var(--done);
      box-shadow: 0 5px 16px rgba(31, 143, 82, 0.28);
    }

    .empty {
      padding: 10px 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .toolbar { justify-content: flex-start; }

    .summary {
      display: grid;
      gap: 12px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .mini-card {
      display: grid;
      gap: 3px;
      padding: 12px;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid var(--line);
    }

    .mini-card strong {
      font-size: 1.45rem;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
    }

    .stat-list {
      display: grid;
      gap: 8px;
    }

    .stat-card {
      display: grid;
      gap: 10px;
      padding: 12px;
      border-radius: 18px;
      background: var(--card);
      border: 1px solid var(--line);
    }

    .stat-head strong {
      font-size: 1.28rem;
      letter-spacing: -0.035em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .stat-meta { justify-content: flex-start; color: var(--muted); }

    .week-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
    }

    .week-chip {
      flex: 0 0 auto;
      min-width: 74px;
      display: grid;
      gap: 2px;
      padding: 7px 9px;
      border-radius: 13px;
      background: #f0fbf4;
      color: var(--done);
      font-size: 0.76rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .week-chip.empty {
      background: var(--soft);
      color: var(--muted);
      opacity: 0.75;
    }

    .week-chip b { color: inherit; font-size: 0.72rem; }

    .sheet {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(0,0,0,0.22);
      padding: 16px;
      align-items: end;
    }
    .sheet.show { display: grid; }
    .sheet-card {
      width: min(100%, 760px);
      margin: 0 auto;
      border-radius: 22px;
      background: #fff;
      padding: 14px;
      display: grid;
      gap: 10px;
      box-shadow: 0 18px 60px rgba(0,0,0,0.22);
    }
    .json-box {
      min-height: 220px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.78rem;
      white-space: pre;
    }

    .toast {
      position: fixed;
      left: 14px;
      right: 14px;
      bottom: calc(14px + var(--safe-bottom));
      z-index: 50;
      padding: 12px 14px;
      border-radius: 16px;
      background: #111;
      color: #fff;
      opacity: 0;
      transform: translateY(14px);
      pointer-events: none;
      transition: 0.18s ease;
      text-align: center;
      font-weight: 700;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (min-width: 720px) {
      body { padding-top: 18px; }
      .day { padding: 16px; }
      .week-days { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .day.today { grid-column: 1 / -1; }
      .summary-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main id="app" class="app"></main>
  <div id="sheet" class="sheet" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'sport-notes.state.v3';
      const OLD_SIMPLE_KEY = 'sport-notes.state.v2';
      const OLD_KEY = 'sport-week-planner.state.v1';
      const SHORT = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
      const SAMPLE = [
        'Подтягивания прямым +5 кг — 4-4-4-4-4\nБрусья +5 кг — 8-8-8-8\nШея статика — 30-30-30-30 сек\nПланка — 90 сек',
        '',
        'Отжимания в стойке — 4-4-4-4-4\nВис на турнике — 70+ сек\nСведения лопаток — 20-20\nПриседания с отягощением — 20-20-20\nГолени — 30-30-30',
        '',
        'Подтягивания обратным — 6-6-6-6-6\nОтжимания на кулаках — 12-12-12-12\nПриседания — 35-35\nПланка — 90 сек',
        '',
        ''
      ];

      let state;
      let view = 'week';
      let weekOffset = 0;
      let monthOffset = 0;
      let saveTimer = null;
      let toastTimer = null;

      function uid() {
        return `${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
      }

      function todayKey() {
        return toDateKey(new Date());
      }

      function toDateKey(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
      }

      function parseDateKey(key) {
        const [y, m, d] = String(key).split('-').map(Number);
        return new Date(y, m - 1, d);
      }

      function addDays(date, days) {
        const copy = new Date(date);
        copy.setDate(copy.getDate() + days);
        return copy;
      }

      function startOfWeek(date = new Date()) {
        const copy = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        const diff = (copy.getDay() + 6) % 7;
        copy.setDate(copy.getDate() - diff);
        return copy;
      }

      function weekStartKeyForDate(dateKey) {
        return toDateKey(startOfWeek(parseDateKey(dateKey)));
      }

      function weekStartKeyForOffset(offset = 0) {
        const start = startOfWeek(new Date());
        start.setDate(start.getDate() + offset * 7);
        return toDateKey(start);
      }

      function weekDates(startKey) {
        const start = parseDateKey(startKey);
        return Array.from({ length: 7 }, (_, i) => toDateKey(addDays(start, i)));
      }

      function prevWeekKey(startKey) {
        return toDateKey(addDays(parseDateKey(startKey), -7));
      }

      function slotForDate(dateKey) {
        return (parseDateKey(dateKey).getDay() + 6) % 7;
      }

      function formatDate(dateKey, long = false) {
        return new Intl.DateTimeFormat('ru-RU', long ? { day: 'numeric', month: 'long' } : { day: 'numeric', month: 'short' }).format(parseDateKey(dateKey));
      }

      function formatMonth(date) {
        return new Intl.DateTimeFormat('ru-RU', { month: 'long', year: 'numeric' }).format(date);
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function cleanDays(days) {
        const next = Array.isArray(days) ? days.slice(0, 7).map(v => String(v ?? '')) : [];
        while (next.length < 7) next.push('');
        return next;
      }

      function makeWeek(days) {
        return {
          days: cleanDays(days),
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
      }

      function defaultState() {
        const startKey = weekStartKeyForDate(todayKey());
        return {
          version: 3,
          id: uid(),
          weeks: { [startKey]: makeWeek(SAMPLE) },
          sessions: {},
          updatedAt: new Date().toISOString()
        };
      }

      function loadState() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) return normalize(JSON.parse(saved));
        } catch (_) {}

        try {
          const saved = localStorage.getItem(OLD_SIMPLE_KEY);
          if (saved) return normalize(JSON.parse(saved));
        } catch (_) {}

        const migrated = migrateOldState();
        if (migrated) return migrated;

        return defaultState();
      }

      function normalize(raw) {
        const fallback = defaultState();
        const next = raw && typeof raw === 'object' ? raw : fallback;
        const currentWeek = weekStartKeyForDate(todayKey());
        const weeks = cleanWeeks(next.weeks);

        if (!Object.keys(weeks).length) {
          weeks[currentWeek] = makeWeek(cleanDays(next.days || SAMPLE));
        }

        return {
          version: 3,
          id: next.id || uid(),
          weeks,
          sessions: cleanSessions(next.sessions),
          updatedAt: next.updatedAt || new Date().toISOString()
        };
      }

      function cleanWeeks(rawWeeks) {
        const weeks = {};
        if (!rawWeeks || typeof rawWeeks !== 'object' || Array.isArray(rawWeeks)) return weeks;
        Object.entries(rawWeeks).forEach(([startKey, week]) => {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(startKey)) return;
          weeks[startKey] = makeWeek(week?.days || SAMPLE);
          weeks[startKey].createdAt = week?.createdAt || weeks[startKey].createdAt;
          weeks[startKey].updatedAt = week?.updatedAt || weeks[startKey].updatedAt;
        });
        return weeks;
      }

      function cleanSessions(rawSessions) {
        const sessions = {};
        if (!rawSessions || typeof rawSessions !== 'object' || Array.isArray(rawSessions)) return sessions;
        Object.entries(rawSessions).forEach(([dateKey, session]) => {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(dateKey)) return;
          const done = {};
          const rawDone = session?.done && typeof session.done === 'object' ? session.done : {};
          Object.entries(rawDone).forEach(([key, value]) => {
            if (!/^\d+:\d+$/.test(key) || !value) return;
            done[key] = typeof value === 'object' ? value : true;
          });
          if (Object.keys(done).length) {
            sessions[dateKey] = { done, updatedAt: session?.updatedAt || new Date().toISOString() };
          }
        });
        return sessions;
      }

      function migrateOldState() {
        try {
          const saved = localStorage.getItem(OLD_KEY);
          if (!saved) return null;
          const old = JSON.parse(saved);
          const days = cleanDays(old?.program?.days?.map(oldDayToText));
          const sessions = {};
          Object.entries(old?.sessionsByDateKey || {}).forEach(([dateKey, session]) => {
            const done = {};
            (session?.exercises || []).forEach((ex, exIndex) => {
              (ex?.sets || []).forEach((set, setIndex) => {
                if (set?.completed) {
                  const label = oldSetLabel(set);
                  done[`${exIndex}:${setIndex}`] = makeDonePayload(ex?.name || 'Упражнение', label);
                }
              });
            });
            if (Object.keys(done).length) sessions[dateKey] = { done, updatedAt: new Date().toISOString() };
          });
          return normalize({ days, sessions });
        } catch (_) {
          return null;
        }
      }

      function oldDayToText(day) {
        if (!day || day.kind !== 'workout') return '';
        return (day.exercises || []).map(ex => {
          const sets = (ex.sets || []).map(oldSetLabel).join('-');
          return `${ex.name || 'Упражнение'}${sets ? ` — ${sets}` : ''}`;
        }).join('\n');
      }

      function oldSetLabel(set) {
        if (set?.targetReps !== null && set?.targetReps !== undefined) return String(set.targetReps);
        if (set?.targetDurationMin !== null && set?.targetDurationMin !== undefined) return `${set.targetDurationMin} мин`;
        if (set?.targetDistanceKm !== null && set?.targetDistanceKm !== undefined) return `${set.targetDistanceKm} км`;
        return '✓';
      }

      function saveNow() {
        state.updatedAt = new Date().toISOString();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function scheduleSave() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(saveNow, 180);
      }

      function flushSave() {
        clearTimeout(saveTimer);
        saveTimer = null;
        saveNow();
      }

      function copyBaseDaysFor(startKey) {
        const previous = state.weeks[prevWeekKey(startKey)];
        if (previous) return previous.days;
        const earlier = Object.keys(state.weeks).filter(key => key < startKey).sort().pop();
        if (earlier) return state.weeks[earlier].days;
        const latest = Object.keys(state.weeks).sort().pop();
        if (latest) return state.weeks[latest].days;
        return SAMPLE;
      }

      function getWeek(startKey) {
        if (!state.weeks[startKey]) {
          state.weeks[startKey] = makeWeek(copyBaseDaysFor(startKey));
          scheduleSave();
        }
        return state.weeks[startKey];
      }

      function getExistingWeek(startKey) {
        return state.weeks[startKey] || null;
      }

      function getSession(dateKey) {
        if (!state.sessions[dateKey]) state.sessions[dateKey] = { done: {}, updatedAt: new Date().toISOString() };
        if (!state.sessions[dateKey].done) state.sessions[dateKey].done = {};
        return state.sessions[dateKey];
      }

      function readSession(dateKey) {
        return state.sessions[dateKey] || { done: {} };
      }

      function parseDayText(text) {
        return String(text || '')
          .split('\n')
          .map(line => line.trim())
          .filter(Boolean)
          .map(parseLine);
      }

      function parseLine(line) {
        const match = line.match(/^(.*?)(?:\s+[—–-]\s+)(.+)$/);
        const name = (match ? match[1] : line).trim();
        const tail = (match ? match[2] : '').trim();
        const sets = tail ? splitSets(tail) : ['✓'];
        return { raw: line, name, sets };
      }

      function splitSets(tail) {
        if (!tail) return ['✓'];
        const normalized = tail.replace(/[–—]/g, '-');
        if (!normalized.includes('-')) return [tail.trim()];
        const parts = normalized.split('-').map(v => v.trim()).filter(Boolean);
        if (!parts.length) return [tail.trim()];
        const suffix = tail.match(/\s(сек|с|мин|км|м)$/i)?.[1];
        return parts.map((part, index) => {
          if (index === parts.length - 1 || !suffix || /[а-яa-z]/i.test(part)) return part;
          return `${part} ${suffix}`;
        });
      }

      function dayProgress(dateKey) {
        const week = getWeek(weekStartKeyForDate(dateKey));
        const exercises = parseDayText(week.days[slotForDate(dateKey)]);
        const done = readSession(dateKey).done;
        let total = 0;
        let checked = 0;
        exercises.forEach((ex, exIndex) => ex.sets.forEach((_, setIndex) => {
          total += 1;
          if (done[`${exIndex}:${setIndex}`]) checked += 1;
        }));
        return { total, checked, percent: total ? Math.round((checked / total) * 100) : 0 };
      }

      function render() {
        if (view === 'summary') renderSummary();
        else renderWeek();
      }

      function renderTop(title, subtitle) {
        return `
          <header class="top">
            <div class="top-inner">
              <div class="title-row">
                <div>
                  <h1>${escapeHtml(title)}</h1>
                  <p class="muted tiny">${escapeHtml(subtitle)}</p>
                </div>
                <button class="dark" data-action="today" type="button">Сегодня</button>
              </div>
              <div class="tabs">
                <button class="${view === 'week' ? 'dark' : ''}" data-action="view-week" type="button">Неделя</button>
                <button class="${view === 'summary' ? 'dark' : ''}" data-action="view-summary" type="button">Сводка</button>
              </div>
            </div>
          </header>
        `;
      }

      function renderWeek() {
        const weekKey = weekStartKeyForOffset(weekOffset);
        const week = getWeek(weekKey);
        const dates = weekDates(weekKey);
        const start = dates[0];
        const end = dates[6];
        document.getElementById('app').innerHTML = `
          ${renderTop('Спорт', `${formatDate(start)} — ${formatDate(end)}`)}
          <section class="week-row">
            <button data-action="prev" type="button">←</button>
            <span class="pill">${weekOffset === 0 ? 'текущая неделя' : weekOffset > 0 ? `+${weekOffset} нед.` : `${weekOffset} нед.`}</span>
            <button data-action="next" type="button">→</button>
            <button data-action="data" type="button">JSON</button>
          </section>
          <section class="week-days">
            ${dates.map(dateKey => renderDay(dateKey, week)).join('')}
          </section>
        `;
        resizeTextareas();
      }

      function renderDay(dateKey, week) {
        const slot = slotForDate(dateKey);
        const weekKey = weekStartKeyForDate(dateKey);
        const text = week.days[slot] || '';
        const exercises = parseDayText(text);
        const progress = dayProgress(dateKey);
        const isToday = dateKey === todayKey();
        return `
          <article class="card day ${isToday ? 'today' : ''}" data-date="${dateKey}" data-week="${weekKey}" data-slot="${slot}">
            <div class="day-head">
              <div>
                <h2>${SHORT[slot]} · ${formatDate(dateKey, true)}</h2>
                <p class="muted tiny">${progress.checked}/${progress.total || 0} подходов</p>
              </div>
              ${isToday ? '<span class="pill today">сегодня</span>' : progress.total && progress.checked === progress.total ? '<span class="pill done">готово</span>' : '<span class="pill">план</span>'}
            </div>
            <div class="progress"><i style="--value:${progress.percent}%"></i></div>
            <textarea data-field="day" data-week="${weekKey}" data-slot="${slot}" rows="3" placeholder="Напиши как в заметках:\nПодтягивания — 4-4-4-4-4\nПланка — 90 сек">${escapeHtml(text)}</textarea>
            ${exercises.length ? `<div class="exercises">${exercises.map((ex, exIndex) => renderExercise(dateKey, ex, exIndex)).join('')}</div>` : '<div class="empty">Пусто. Просто напиши упражнения выше.</div>'}
          </article>
        `;
      }

      function renderExercise(dateKey, exercise, exIndex) {
        const session = readSession(dateKey);
        const allDone = exercise.sets.every((_, setIndex) => session.done[`${exIndex}:${setIndex}`]);
        return `
          <div class="exercise ${allDone ? 'done' : ''}">
            <div class="exercise-head">
              <h3>${escapeHtml(exercise.name)}</h3>
              <div class="toolbar">
                <button class="small" data-action="add-set" data-date="${dateKey}" data-ex="${exIndex}" type="button">+ подход</button>
                <button class="small danger" data-action="remove-set" data-date="${dateKey}" data-ex="${exIndex}" type="button">−</button>
              </div>
            </div>
            <div class="set-row">
              ${exercise.sets.map((label, setIndex) => renderSet(dateKey, label, exIndex, setIndex)).join('')}
            </div>
          </div>
        `;
      }

      function renderSet(dateKey, label, exIndex, setIndex) {
        const done = Boolean(readSession(dateKey).done[`${exIndex}:${setIndex}`]);
        return `<button class="set ${done ? 'done' : ''}" aria-pressed="${done ? 'true' : 'false'}" data-action="toggle" data-date="${dateKey}" data-ex="${exIndex}" data-set="${setIndex}" type="button">${done ? '✓ ' : ''}${escapeHtml(label)}</button>`;
      }

      function monthDate(offset = 0) {
        const date = new Date();
        date.setDate(1);
        date.setHours(0, 0, 0, 0);
        date.setMonth(date.getMonth() + offset);
        return date;
      }

      function sameMonth(dateKey, month) {
        const date = parseDateKey(dateKey);
        return date.getFullYear() === month.getFullYear() && date.getMonth() === month.getMonth();
      }

      function renderSummary() {
        const month = monthDate(monthOffset);
        const stats = buildMonthStats(month);
        document.getElementById('app').innerHTML = `
          ${renderTop('Сводка', formatMonth(month))}
          <section class="week-row">
            <button data-action="prev-month" type="button">←</button>
            <span class="pill">${escapeHtml(formatMonth(month))}</span>
            <button data-action="next-month" type="button">→</button>
            <button data-action="data" type="button">JSON</button>
          </section>
          <section class="summary">
            <div class="summary-grid">
              <div class="mini-card"><span class="muted tiny">Тренировки</span><strong>${stats.workouts}</strong></div>
              <div class="mini-card"><span class="muted tiny">Подходы</span><strong>${stats.sets}</strong></div>
              <div class="mini-card"><span class="muted tiny">Повторы</span><strong>${formatNumber(stats.reps)}</strong></div>
            </div>
            ${stats.rows.length ? `<div class="stat-list">${stats.rows.map(row => renderStatRow(row, stats.weekKeys)).join('')}</div>` : '<article class="card day"><h2>Пока пусто</h2><p class="muted">Нажми цифры подходов в неделе — здесь появится объём.</p></article>'}
          </section>
        `;
      }

      function buildMonthStats(month) {
        const rows = new Map();
        const workouts = new Set();
        const weekKeys = weeksInMonth(month);
        let sets = 0;
        let reps = 0;

        Object.entries(state.sessions).forEach(([dateKey, session]) => {
          if (!sameMonth(dateKey, month)) return;
          const weekKey = weekStartKeyForDate(dateKey);
          const week = getExistingWeek(weekKey);
          if (!week) return;
          const exercises = parseDayText(week.days[slotForDate(dateKey)]);
          let dayDone = false;

          Object.entries(session.done || {}).forEach(([key, value]) => {
            if (!value) return;
            const [exIndex, setIndex] = key.split(':').map(Number);
            const fallbackExercise = exercises[exIndex];
            const fallbackLabel = fallbackExercise?.sets?.[setIndex] || '';
            const payload = typeof value === 'object' ? value : null;
            const exerciseName = payload?.exercise || fallbackExercise?.name || 'Упражнение';
            const label = payload?.label || fallbackLabel || '✓';
            const metric = normalizeMetric(payload?.metric || setMetric(label));
            const groupName = payload?.group || groupExerciseName(exerciseName);
            const rowKey = groupName.toLowerCase();
            const row = rows.get(rowKey) || makeStatRow(groupName);

            row.sets += 1;
            row.variants.add(exerciseName);
            addMetric(row.units, metric);
            if (!row.weeks[weekKey]) row.weeks[weekKey] = { sets: 0, units: {} };
            row.weeks[weekKey].sets += 1;
            addMetric(row.weeks[weekKey].units, metric);
            rows.set(rowKey, row);

            sets += 1;
            if (metric.unit === 'повт') reps += metric.value;
            dayDone = true;
          });

          if (dayDone) workouts.add(dateKey);
        });

        return {
          workouts: workouts.size,
          sets,
          reps,
          weekKeys,
          rows: Array.from(rows.values()).sort((a, b) => primaryVolume(b) - primaryVolume(a) || b.sets - a.sets || a.name.localeCompare(b.name, 'ru'))
        };
      }

      function weeksInMonth(month) {
        const start = new Date(month.getFullYear(), month.getMonth(), 1);
        const end = new Date(month.getFullYear(), month.getMonth() + 1, 0);
        const keys = [];
        let cursor = startOfWeek(start);
        while (cursor <= end) {
          keys.push(toDateKey(cursor));
          cursor = addDays(cursor, 7);
        }
        return keys;
      }

      function makeStatRow(name) {
        return { name, sets: 0, units: {}, variants: new Set(), weeks: {} };
      }

      function setMetric(label) {
        const text = String(label || '').toLowerCase().replace(',', '.');
        const match = text.match(/\d+(?:\.\d+)?/);
        const value = match ? Number(match[0]) : 0;
        let unit = 'повт';
        if (/сек|\bс\b/.test(text)) unit = 'сек';
        else if (/мин/.test(text)) unit = 'мин';
        else if (/км/.test(text)) unit = 'км';
        else if (/\bм\b/.test(text) && !/кг/.test(text)) unit = 'м';
        return { unit, value };
      }

      function normalizeMetric(metric) {
        const value = Number(metric?.value || 0);
        const unit = metric?.unit || 'повт';
        return { unit, value: Number.isFinite(value) ? value : 0 };
      }

      function addMetric(units, metric) {
        if (!metric.value) return;
        units[metric.unit] = (units[metric.unit] || 0) + metric.value;
      }

      function primaryVolume(row) {
        return row.units['повт'] || row.units['сек'] || row.units['мин'] || row.units['км'] || row.units['м'] || row.sets;
      }

      function groupExerciseName(name) {
        const cleaned = String(name || 'Упражнение')
          .replace(/\s+\+?\d+(?:[,.]\d+)?\s*кг/ig, '')
          .replace(/\s+/g, ' ')
          .trim();
        const lower = cleaned.toLowerCase();
        if (lower.startsWith('подтяг')) return 'Подтягивания';
        if (lower.startsWith('присед')) return 'Приседания';
        if (lower === 'брусья') return 'Брусья';
        return cleaned || 'Упражнение';
      }

      function makeDonePayload(exerciseName, label) {
        return {
          exercise: exerciseName,
          group: groupExerciseName(exerciseName),
          label,
          metric: setMetric(label),
          completedAt: new Date().toISOString()
        };
      }

      function renderStatRow(row, weekKeys) {
        const variants = Array.from(row.variants).filter(name => groupExerciseName(name) !== row.name);
        return `
          <article class="stat-card">
            <div class="stat-head">
              <div>
                <h3>${escapeHtml(row.name)}</h3>
                <p class="muted tiny">${row.sets} подх.${variants.length ? ` · ${escapeHtml(variants.join(', '))}` : ''}</p>
              </div>
              <strong>${escapeHtml(formatUnits(row.units, row.sets))}</strong>
            </div>
            <div class="week-chips">
              ${weekKeys.map(weekKey => renderWeekChip(weekKey, row.weeks[weekKey])).join('')}
            </div>
          </article>
        `;
      }

      function renderWeekChip(weekKey, data) {
        const hasData = data && data.sets;
        const text = hasData ? formatUnits(data.units, data.sets) : '—';
        return `<span class="week-chip ${hasData ? '' : 'empty'}"><b>${formatDate(weekKey)}</b>${escapeHtml(text)}</span>`;
      }

      function formatUnits(units, fallbackSets = 0) {
        const order = ['повт', 'сек', 'мин', 'км', 'м'];
        const parts = order
          .filter(unit => units[unit])
          .map(unit => `${formatNumber(units[unit])} ${unit}`);
        return parts.length ? parts.join(' + ') : `${fallbackSets} подх.`;
      }

      function formatNumber(value) {
        const number = Number(value || 0);
        if (Number.isInteger(number)) return String(number);
        return number.toLocaleString('ru-RU', { maximumFractionDigits: 1 });
      }

      function updateLineSetCount(dateKey, exIndex, delta) {
        const week = getWeek(weekStartKeyForDate(dateKey));
        const slot = slotForDate(dateKey);
        const lines = String(week.days[slot] || '').split('\n');
        const nonEmpty = lines.map((line, index) => ({ line, index })).filter(item => item.line.trim());
        const target = nonEmpty[exIndex];
        if (!target) return;
        const parsed = parseLine(target.line.trim());
        const sets = parsed.sets.slice();
        if (delta > 0) sets.push(sets[sets.length - 1] || '10');
        if (delta < 0 && sets.length > 1) sets.pop();
        lines[target.index] = `${parsed.name} — ${sets.join('-')}`;
        week.days[slot] = lines.join('\n');
        week.updatedAt = new Date().toISOString();
        saveNow();
        render();
      }

      function toggleSet(dateKey, exIndex, setIndex) {
        const session = getSession(dateKey);
        const key = `${exIndex}:${setIndex}`;
        if (session.done[key]) {
          delete session.done[key];
        } else {
          const week = getWeek(weekStartKeyForDate(dateKey));
          const exercise = parseDayText(week.days[slotForDate(dateKey)])[exIndex];
          const label = exercise?.sets?.[setIndex] || '✓';
          session.done[key] = makeDonePayload(exercise?.name || 'Упражнение', label);
        }
        session.updatedAt = new Date().toISOString();
        if (!Object.keys(session.done).length) delete state.sessions[dateKey];
        saveNow();
        render();
      }

      function handleAction(target) {
        const action = target.dataset.action;
        if (action === 'view-week') { view = 'week'; render(); return; }
        if (action === 'view-summary') { view = 'summary'; render(); return; }
        if (action === 'prev') { weekOffset -= 1; render(); return; }
        if (action === 'next') { weekOffset += 1; render(); return; }
        if (action === 'prev-month') { monthOffset -= 1; render(); return; }
        if (action === 'next-month') { monthOffset += 1; render(); return; }
        if (action === 'today') { view = 'week'; weekOffset = 0; monthOffset = 0; render(); setTimeout(() => document.querySelector('.day.today')?.scrollIntoView({ block: 'start', behavior: 'smooth' }), 40); return; }
        if (action === 'data') { openDataSheet(); return; }
        if (action === 'close-sheet') { closeSheet(); return; }
        if (action === 'copy-json') { copyJson(); return; }
        if (action === 'export-json') { exportJson(); return; }
        if (action === 'import-json') { importJson(); return; }
        if (action === 'toggle') {
          toggleSet(target.dataset.date, Number(target.dataset.ex), Number(target.dataset.set));
          return;
        }
        if (action === 'add-set' || action === 'remove-set') {
          updateLineSetCount(target.dataset.date, Number(target.dataset.ex), action === 'add-set' ? 1 : -1);
        }
      }

      function handleInput(target) {
        if (target.dataset.field !== 'day') return;
        const week = getWeek(target.dataset.week);
        week.days[Number(target.dataset.slot)] = target.value;
        week.updatedAt = new Date().toISOString();
        resizeTextarea(target);
        scheduleSave();
      }

      function handleTextareaBlur(target) {
        if (target.dataset.field !== 'day') return;
        flushSave();
        render();
      }

      function resizeTextarea(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = `${Math.max(96, textarea.scrollHeight)}px`;
      }

      function resizeTextareas() {
        document.querySelectorAll('textarea[data-field="day"]').forEach(resizeTextarea);
      }

      function openDataSheet() {
        flushSave();
        const sheet = document.getElementById('sheet');
        sheet.innerHTML = `
          <div class="sheet-card">
            <div class="title-row">
              <h2>JSON</h2>
              <button data-action="close-sheet" type="button">Закрыть</button>
            </div>
            <div class="toolbar">
              <button class="dark" data-action="copy-json" type="button">Копировать</button>
              <button data-action="export-json" type="button">Скачать</button>
              <button data-action="import-json" type="button">Импорт</button>
            </div>
            <textarea id="jsonBox" class="json-box">${escapeHtml(JSON.stringify(state, null, 2))}</textarea>
          </div>
        `;
        sheet.classList.add('show');
        sheet.setAttribute('aria-hidden', 'false');
      }

      function closeSheet() {
        const sheet = document.getElementById('sheet');
        sheet.classList.remove('show');
        sheet.setAttribute('aria-hidden', 'true');
      }

      async function copyJson() {
        const text = JSON.stringify(state, null, 2);
        try {
          await navigator.clipboard.writeText(text);
          toast('Скопировано');
        } catch (_) {
          const box = document.getElementById('jsonBox');
          box?.focus();
          box?.select();
          toast('Выделил текст');
        }
      }

      function exportJson() {
        flushSave();
        const text = JSON.stringify(state, null, 2);
        const blob = new Blob([text], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `sport-${todayKey()}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function importJson() {
        const box = document.getElementById('jsonBox');
        try {
          state = normalize(JSON.parse(box.value));
          saveNow();
          closeSheet();
          render();
          toast('Импортировано');
        } catch (_) {
          toast('JSON битый');
        }
      }

      function toast(message) {
        const node = document.getElementById('toast');
        node.textContent = message;
        node.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => node.classList.remove('show'), 1600);
      }

      function registerServiceWorker() {
        if (!('serviceWorker' in navigator)) return;
        if (!window.isSecureContext && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
      }

      document.addEventListener('click', event => {
        const target = event.target.closest('[data-action]');
        if (!target) return;
        event.preventDefault();
        handleAction(target);
      });

      document.addEventListener('input', event => handleInput(event.target));
      document.addEventListener('blur', event => handleTextareaBlur(event.target), true);
      window.addEventListener('pagehide', flushSave);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSave(); });
      window.addEventListener('resize', () => requestAnimationFrame(resizeTextareas));

      registerServiceWorker();
      state = loadState();
      getWeek(weekStartKeyForOffset(0));
      saveNow();
      render();
    })();
  </script>
</body>
</html>
