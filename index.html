<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="🏆 Спорт">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="🏆 Спорт">
  <meta name="description" content="Спортивные недели, кнопки-подходы и статистика прогресса.">
  <link rel="manifest" href="manifest.webmanifest?v=1.0.14">
  <link rel="icon" href="icon.svg?v=1.0.14" type="image/svg+xml">
  <link rel="icon" href="icon-192.png?v=1.0.14" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icon-180.png?v=1.0.14">
  <title>🏆 Спорт</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0d;
      --bg-2: #121214;
      --card: #1c1c1e;
      --card-strong: #242428;
      --field: #2c2c2e;
      --ink: #f5f5f7;
      --muted: #a1a1a6;
      --line: #3a3a3c;
      --soft: #171719;
      --accent: #ff6a00;
      --accent-2: #ff8a1f;
      --accent-ink: #fff7f0;
      --done: #34c759;
      --danger: #ff6b5f;
      --shadow: rgba(0, 0, 0, 0.32);
      --glow: rgba(255, 106, 0, 0.18);
      --overlay: rgba(0, 0, 0, 0.62);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 16px;
    }

    * { box-sizing: border-box; }

    * { -webkit-tap-highlight-color: transparent; }

    * {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    *::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    ::selection {
      background: color-mix(in srgb, var(--accent) 35%, transparent);
      color: var(--ink);
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 20% -14%, rgba(255, 106, 0, 0.16), transparent 30rem),
        radial-gradient(circle at 100% 4%, rgba(255, 138, 31, 0.1), transparent 24rem),
        linear-gradient(180deg, var(--bg-2), var(--bg));
      color: var(--ink);
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100dvh;
      padding: 12px 10px calc(136px + var(--safe-bottom));
    }

    button, textarea, input, select { font: inherit; }

    button, input, select, textarea { -webkit-appearance: none; appearance: none; }

    button {
      min-height: 44px;
      border: 1px solid color-mix(in srgb, var(--line) 86%, white);
      border-radius: 14px;
      background: color-mix(in srgb, var(--field) 88%, black);
      color: var(--ink);
      padding: 0 14px;
      font-weight: 590;
      letter-spacing: -0.012em;
      touch-action: manipulation;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.035) inset;
      user-select: none;
    }

    button:active { transform: scale(0.98); }

    @media (hover: hover) and (pointer: fine) {
      button:hover {
        border-color: color-mix(in srgb, var(--accent) 34%, var(--line));
        background: color-mix(in srgb, var(--field) 92%, var(--accent));
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18), 0 1px 0 rgba(255, 255, 255, 0.04) inset;
      }

      button.dark:hover {
        border-color: var(--accent-2);
        box-shadow: 0 9px 24px var(--glow);
      }

      button.danger:hover {
        border-color: color-mix(in srgb, var(--danger) 46%, var(--line));
        background: color-mix(in srgb, var(--field) 86%, var(--danger));
      }
    }
    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 36%, transparent);
      outline-offset: 2px;
    }
    button.dark {
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 88%, black), var(--accent-2));
      color: var(--accent-ink);
      border-color: color-mix(in srgb, var(--accent) 60%, transparent);
      box-shadow: 0 7px 18px var(--glow);
    }
    button.danger { color: var(--danger); }
    button.small { min-height: 44px; padding: 0 12px; font-size: 0.86rem; }
    button.ghost { background: color-mix(in srgb, var(--soft) 78%, black); }

    select {
      padding-right: 30px;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position:
        calc(100% - 15px) 52%,
        calc(100% - 10px) 52%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }

    input, textarea, select {
      border: 1px solid var(--line);
      outline: 0;
      background: var(--field);
      color: var(--ink);
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
    }

    .app {
      width: min(100%, 760px);
      margin: 0 auto;
      display: grid;
      gap: 10px;
    }

    .week-days {
      display: grid;
      gap: 10px;
    }

    .top {
      position: sticky;
      top: 0;
      z-index: 10;
      margin: -8px 0 0;
      padding: calc(7px + env(safe-area-inset-top, 0px)) 0 7px;
      background:
        radial-gradient(circle at 50% -30%, var(--glow), transparent 24rem),
        linear-gradient(180deg, color-mix(in srgb, var(--bg-2) 97%, transparent), color-mix(in srgb, var(--bg-2) 82%, transparent));
      backdrop-filter: blur(20px) saturate(1.2);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
      border-bottom: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
    }

    .top-inner,
    .bottom-inner {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    .top-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
      padding-inline: 2px;
    }

    .title-row,
    .top-actions,
    .week-row,
    .day-head,
    .exercise-head,
    .toolbar,
    .stat-head,
    .stat-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .top-actions { justify-content: flex-end; }

    h1, h2, h3, p { margin: 0; }
    h1 {
      color: var(--ink);
      font-size: clamp(1.75rem, 7.8vw, 2.9rem);
      line-height: 0.92;
      letter-spacing: -0.075em;
      font-weight: 700;
      text-shadow: 0 0 22px var(--glow);
    }
    h2 { font-size: 1rem; letter-spacing: -0.02em; font-weight: 600; }
    h3 { font-size: 0.96rem; letter-spacing: -0.02em; font-weight: 600; }

    .top-title {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      overflow: hidden;
    }

    .top-title h1 {
      flex: 0 0 auto;
    }

    .top-period {
      min-width: 0;
      display: inline-grid;
      grid-template-columns: 24px minmax(0, max-content) 24px;
      align-items: center;
      gap: 3px;
    }

    .top-week-button {
      min-width: 24px;
      min-height: 34px;
      width: 24px;
      height: 34px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      color: var(--muted);
      font-size: 1.5rem;
      line-height: 1;
    }

    .top-week-button:active {
      transform: scale(0.94);
    }

    .top-week-button:hover {
      border: 0;
      background: transparent;
      box-shadow: none;
      color: var(--ink);
    }

    .top-subtitle {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--accent-ink);
      font-size: clamp(1rem, 4.3vw, 1.36rem);
      line-height: 1;
      letter-spacing: -0.045em;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 18px var(--glow);
    }

    .muted { color: var(--muted); }
    .tiny { font-size: 0.82rem; line-height: 1.35; }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .timer-bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-width: 94px;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    .timer-bar span {
      display: none;
    }

    .timer-bar strong {
      font-size: clamp(1.8rem, 8vw, 3rem);
      line-height: 0.92;
      letter-spacing: -0.075em;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      text-shadow: 0 0 22px var(--glow);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 8px;
      background: var(--soft);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 500;
      white-space: nowrap;
    }

    .pill.done { background: color-mix(in srgb, var(--done) 17%, var(--card)); color: var(--done); }

    .card {
      border: 1px solid color-mix(in srgb, var(--line) 88%, white);
      border-radius: 16px;
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--card) 92%, white), var(--card));
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2), 0 1px 0 rgba(255, 255, 255, 0.035) inset;
    }

    .day {
      display: grid;
    }

    .day.current {
      border-color: color-mix(in srgb, var(--accent) 68%, var(--line));
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28), 0 0 0 1px color-mix(in srgb, var(--accent) 20%, transparent) inset;
    }

    .day-toggle {
      width: 100%;
      min-height: 58px;
      padding: 9px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 0;
      background: transparent;
      color: inherit;
      text-align: left;
    }

    .day .day-head {
      width: 100%;
      flex-wrap: nowrap;
      justify-content: flex-start;
      gap: 7px;
    }

    .day-open-button {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 48px;
      padding: 0;
      border: 0;
      border-radius: 12px;
      background: transparent;
      box-shadow: none;
      text-align: left;
      display: grid;
      align-items: center;
    }

    .day-open-button:active { transform: none; }

    .day-date-wrap {
      position: relative;
      flex: 0 0 44px;
      width: 44px;
      min-height: 48px;
      border-radius: 14px;
    }

    .day-date {
      width: 100%;
      min-height: 48px;
      display: grid;
      place-items: center;
      padding: 5px 4px;
      border-radius: inherit;
      background: color-mix(in srgb, var(--field) 72%, black);
      border: 1px solid color-mix(in srgb, var(--line) 82%, white);
      box-shadow: 0 1px 0 rgba(255,255,255,0.035) inset;
      text-align: center;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }

    .day-date-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      color-scheme: dark;
      font-size: 16px;
    }

    .day-date-wrap:focus-within .day-date {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent), 0 1px 0 rgba(255,255,255,0.035) inset;
    }

    .day-date b,
    .day-date em {
      color: var(--muted);
      font-size: 0.62rem;
      line-height: 1;
      font-style: normal;
      font-weight: 650;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .day-date strong {
      color: var(--accent-ink);
      font-size: 1.34rem;
      line-height: 0.95;
      letter-spacing: -0.055em;
      font-weight: 750;
    }

    .day-title {
      min-width: 0;
      display: grid;
      gap: 3px;
    }

    .day-title h2 {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .day-meta {
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .day-status {
      flex: 0 0 auto;
      min-width: 42px;
      justify-content: center;
      color: var(--accent-ink);
      background: color-mix(in srgb, var(--accent) 17%, var(--soft));
      font-variant-numeric: tabular-nums;
    }

    .day-status.done {
      background: color-mix(in srgb, var(--done) 17%, var(--card));
      color: var(--done);
    }

    .add-day-card {
      display: grid;
      gap: 12px;
      padding: 14px;
    }

    .add-day-head {
      display: grid;
      gap: 4px;
    }

    .add-day-head h2 {
      color: var(--accent-ink);
    }

    .add-day-form {
      display: grid;
      gap: 10px;
    }

    .add-day-fields {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }

    .add-day-field,
    .add-day-date {
      min-height: 50px;
      width: 100%;
      border-radius: 16px;
      padding: 0 14px;
      font-size: 1rem;
      letter-spacing: -0.015em;
    }

    .add-day-date {
      padding: 0 10px;
      color-scheme: dark;
      font-variant-numeric: tabular-nums;
    }

    .add-day-actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .add-day-actions button {
      width: 100%;
    }

    .empty-week-card {
      display: grid;
      gap: 12px;
      padding: 16px;
    }

    .empty-week-card h2 {
      color: var(--accent-ink);
    }

    .empty-week-card p {
      color: var(--muted);
      line-height: 1.42;
    }

    .day-body {
      display: grid;
      gap: 9px;
      padding: 0 11px 11px;
      border-top: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
    }

    .day-body-top {
      display: grid;
      gap: 7px;
      padding-top: 9px;
    }

    .progress {
      height: 6px;
      border-radius: 999px;
      background: var(--soft);
      overflow: hidden;
    }

    .progress > i {
      display: block;
      height: 100%;
      width: var(--value, 0%);
      background: linear-gradient(90deg, var(--done), color-mix(in srgb, var(--done) 68%, var(--accent)));
      border-radius: inherit;
      box-shadow: 0 0 16px color-mix(in srgb, var(--done) 34%, transparent);
      transition: width 0.22s ease;
    }

    .exercises {
      display: grid;
      gap: 7px;
    }

    .exercise {
      display: grid;
      gap: 7px;
      padding: 8px;
      border-radius: 15px;
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--field) 84%, white), color-mix(in srgb, var(--field) 72%, var(--soft)));
      border: 1px solid color-mix(in srgb, var(--line) 86%, white);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.16);
    }

    .exercise.done { background: linear-gradient(180deg, color-mix(in srgb, var(--done) 16%, var(--card)), color-mix(in srgb, var(--done) 10%, var(--card))); border-color: color-mix(in srgb, var(--done) 42%, var(--line)); }

    .exercise-name {
      flex: 1 1 160px;
      min-width: 0;
      min-height: 34px;
      border: 0;
      border-bottom: 1px solid color-mix(in srgb, var(--line) 72%, transparent);
      border-radius: 0;
      background: transparent;
      padding: 0 2px;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: -0.015em;
      box-shadow: none;
    }

    .exercise-name:focus {
      border-color: var(--accent);
      box-shadow: none;
    }

    .set-row {
      --set-gap: clamp(3px, 1.15vw, 7px);
      --set-control-size: clamp(28px, 8.2vw, 36px);
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: var(--set-gap);
      overflow: visible;
      padding-bottom: 0;
      min-width: 0;
    }

    .set-item {
      flex: 1 1 0;
      min-width: 0;
      display: inline-grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 6px;
      align-items: center;
      padding: 0;
      border-radius: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .set-control {
      flex: 0 0 var(--set-control-size);
      width: var(--set-control-size);
      min-width: 0;
      min-height: var(--set-control-size);
      height: var(--set-control-size);
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      color: var(--muted);
      font-size: clamp(1rem, 4.7vw, 1.25rem);
      line-height: 1;
    }

    .set-control.dark,
    .set-control.dark:hover,
    .set-control:hover,
    .set-control:focus-visible {
      outline: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
      color: var(--muted);
    }

    .set-control:disabled {
      opacity: 0.32;
      cursor: default;
    }

    .set {
      width: 100%;
      min-width: 0;
      min-height: var(--set-control-size);
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--line) 84%, white);
      background: linear-gradient(180deg, color-mix(in srgb, var(--field) 92%, white), var(--field));
      color: var(--ink);
      padding: 0 clamp(4px, 1.8vw, 12px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: clamp(0.78rem, 3.35vw, 0.96rem);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .set.done {
      background: var(--done);
      color: #fff;
      border-color: var(--done);
      box-shadow: 0 5px 16px color-mix(in srgb, var(--done) 38%, transparent);
    }

    .empty {
      padding: 10px 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .toolbar { justify-content: flex-start; }

    .add-exercise,
    .make-training,
    .add-day-button {
      width: 100%;
      background: var(--field);
    }

    .bottom-tabs {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      display: grid;
      gap: 8px;
      padding: 10px 12px calc(10px + var(--safe-bottom));
      background:
        radial-gradient(circle at 50% 0, rgba(255, 106, 0, 0.14), transparent 18rem),
        color-mix(in srgb, var(--bg) 94%, transparent);
      backdrop-filter: blur(18px) saturate(1.16);
      -webkit-backdrop-filter: blur(18px) saturate(1.16);
      border-top: 1px solid color-mix(in srgb, var(--line) 90%, transparent);
      box-shadow: 0 -18px 44px rgba(0, 0, 0, 0.36);
    }

    .bottom-inner {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .bottom-tabs button {
      min-height: 46px;
      font-size: 1rem;
    }

    .summary {
      display: grid;
      gap: 14px;
    }

    .summary-hero,
    .metric-card,
    .chart-card,
    .empty-hero {
      position: relative;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--line) 82%, var(--accent));
      background:
        radial-gradient(circle at 12% 0, color-mix(in srgb, var(--accent) 20%, transparent), transparent 13rem),
        linear-gradient(180deg, color-mix(in srgb, var(--card-strong) 88%, white), var(--card));
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.28), 0 1px 0 rgba(255, 255, 255, 0.04) inset;
    }

    .summary-hero {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 16px;
      align-items: center;
      min-height: 186px;
      padding: 16px;
      border-radius: 28px;
    }

    .activity-ring {
      --value: 0;
      width: 138px;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      padding: 12px;
      background:
        conic-gradient(var(--done) calc(var(--value) * 1%), color-mix(in srgb, var(--line) 68%, black) 0),
        radial-gradient(circle, color-mix(in srgb, var(--accent) 24%, transparent), transparent 64%);
      box-shadow: 0 0 34px color-mix(in srgb, var(--done) 20%, transparent);
    }

    .ring-core {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 2px;
      background: linear-gradient(180deg, var(--card), var(--bg));
      border: 1px solid color-mix(in srgb, var(--line) 70%, white);
    }

    .ring-core strong {
      font-size: 2rem;
      letter-spacing: -0.06em;
      font-variant-numeric: tabular-nums;
    }

    .ring-core span,

      text-shadow: 0 0 28px var(--glow);
    }

    .hero-caption {

    .summary-grid {
      display: grid;

    }

    .metric-card {
      display: grid;

    .metric-meter,
    .rank-meter,
    .unit-meter {

    }

    .metric-meter i,
    .rank-meter i,
    .unit-meter i {

      width: var(--value, 0%);

      border-radius: inherit;

    .chart-title {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 10px;
    }

    .month-bars {
      min-height: 156px;
      display: flex;
      align-items: end;
      gap: 8px;
      padding: 8px 2px 0;
      overflow-x: auto;

    }

    .month-bar {
      flex: 1 0 42px;
      min-width: 42px;
      height: 148px;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 7px;

    .month-bar i {
      width: 100%;
      min-height: 8px;
      height: var(--value, 0%);
      border-radius: 999px 999px 7px 7px;
      background: linear-gradient(180deg, var(--accent-2), var(--accent));
      box-shadow: 0 0 20px var(--glow);
      transition: height 0.22s ease;

    .month-bar b,

    }

    .rank-list,
    .unit-list {
      display: grid;
      gap: 10px;
    }

    .rank-row,
    .unit-row {
      display: grid;
      gap: 7px;
    }

    .rank-top,
    .unit-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
    }

    .rank-top strong,
    .unit-top strong {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rank-top span,
    .unit-top span {
      color: var(--muted);
      font-weight: 500;
      font-size: 0.86rem;
      white-space: nowrap;

    .weekday-bars {
      min-height: 136px;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 7px;
      align-items: end;

    .weekday-bar {
      height: 128px;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 7px;
      align-items: end;

    .weekday-bar i {
      width: 100%;
      min-height: 8px;
      height: var(--value, 0%);
      border-radius: 999px 999px 7px 7px;
      background: linear-gradient(180deg, var(--done), color-mix(in srgb, var(--done) 48%, var(--accent)));
      opacity: var(--alpha, 1);
      transition: height 0.22s ease, opacity 0.22s ease;

    .empty-hero {
      min-height: 220px;
      place-items: center;

    .sheet {
      display: none;
      position: fixed;

      padding: 16px 16px calc(16px + var(--safe-bottom));

    .sheet-card {
      width: min(100%, 760px);
      max-height: min(76dvh, 620px);
      margin: 0 auto;
      border-radius: 24px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--card) 92%, white), var(--card));
      border: 1px solid var(--line);
      padding: 14px;

      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 10px;
      box-shadow: 0 18px 60px rgba(0,0,0,0.42);

    .json-box {
      width: 100%;
      min-height: 220px;
      max-height: 100%;
      border-radius: 14px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.78rem;
      line-height: 1.45;
      white-space: pre;
      resize: vertical;
      overflow: auto;
    }

    .toast {
      position: fixed;
      left: 14px;
      right: 14px;
      bottom: calc(142px + var(--safe-bottom));
      z-index: 50;
      padding: 12px 14px;
      border-radius: 16px;
      background: var(--accent);
      color: var(--accent-ink);
      opacity: 0;
      transform: translateY(14px);
      pointer-events: none;
