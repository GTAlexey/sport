      text-align: center;
      font-weight: 600;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    @supports not (color: color-mix(in srgb, white, black)) {
      .top, .bottom-tabs { background: var(--bg); }
      .exercise { background: var(--soft); }
    }

    @media (max-width: 520px) {
      .top-inner {
        gap: 8px;
      }
    }

    @media (max-width: 420px) {
      body { padding-inline: 6px; }
      h1 { font-size: 0.78rem; }
      .top { margin-inline: 0; padding-inline: 0; }
      .top-subtitle { font-size: clamp(0.92rem, 4.5vw, 1.08rem); }
      .timer-bar { min-width: 82px; }
      .top-actions button { min-height: 38px; padding-inline: 12px; }
      .day-toggle { padding: 8px 10px; }
      .day-body,
      .add-day-card,
      .empty-week-card { padding-inline: 12px; }
      .exercise { padding: 7px; border-radius: 14px; }
      .exercise-head { flex-wrap: nowrap; }
      .exercise-name { width: 100%; }
      .toolbar button { flex: 1 1 120px; min-height: 38px; }
      .add-day-fields,
      .add-day-actions { grid-template-columns: 1fr; }
      .set-row { gap: 3px; }
      .set { min-height: 38px; }
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .summary-hero { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 12px; }
      .summary-hero-copy { justify-items: center; }
      .hero-caption { justify-content: center; }
      .activity-ring { width: 116px; }
    }

    @media (max-width: 340px) {
      .bottom-tabs { padding-inline: 8px; }
      .bottom-inner { gap: 6px; }
      .bottom-tabs button { font-size: 0.9rem; padding-inline: 6px; }
      .bottom-inner { grid-template-columns: 1fr; }
      .bottom-tabs button { min-height: 42px; }
      .summary-grid { grid-template-columns: 1fr; }
    }

    @media (min-width: 720px) {
      body { padding-top: 18px; }
      .day-body { padding: 0 16px 16px; }
      .week-days { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .day.open { grid-column: 1 / -1; }
      .summary-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .chart-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .chart-card.wide { grid-column: 1 / -1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main id="app" class="app"></main>
  <div id="sheet" class="sheet" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'sport-notes.state.v6';
      const OLD_KEYS = [];
      const SHORT = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
      let state;
      let view = 'week';
      let weekOffset = 0;
      let openDateKey = null;
      let showAddDayForm = false;
      let saveTimer = null;
      let toastTimer = null;
      let timerStartedAt = null;
      let timerInterval = null;
      let longPressTimer = null;
      let longPressTarget = null;
      let longPressStartX = 0;
      let longPressStartY = 0;
      let ignoreNextClick = false;

      function uid() {
        return `${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
      }

      function todayKey() {
        return toDateKey(new Date());
      }

      function toDateKey(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
      }

      function parseDateKey(key) {
        const [y, m, d] = String(key).split('-').map(Number);
        return new Date(y, m - 1, d);
      }

      function isDateKey(value) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(String(value || ''))) return false;
        const date = parseDateKey(value);
        return toDateKey(date) === value;
      }

      function dateKeyToUtcDay(dateKey) {
        const [year, month, day] = String(dateKey).split('-').map(Number);
        return Math.floor(Date.UTC(year, month - 1, day) / 86400000);
      }

      function weekOffsetForDate(dateKey) {
        const currentStart = weekStartKeyForDate(todayKey());
        const targetStart = weekStartKeyForDate(dateKey);
        return Math.round((dateKeyToUtcDay(targetStart) - dateKeyToUtcDay(currentStart)) / 7);
      }

      function addDays(date, days) {
        const copy = new Date(date);
        copy.setDate(copy.getDate() + days);
        return copy;
      }

      function startOfWeek(date = new Date()) {
        const copy = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        const diff = (copy.getDay() + 6) % 7;
        copy.setDate(copy.getDate() - diff);
        return copy;
      }

      function weekStartKeyForDate(dateKey) {
        return toDateKey(startOfWeek(parseDateKey(dateKey)));
      }

      function weekStartKeyForOffset(offset = 0) {
        const start = startOfWeek(new Date());
        start.setDate(start.getDate() + offset * 7);
        return toDateKey(start);
      }

      function weekDates(startKey) {
        const start = parseDateKey(startKey);
        return Array.from({ length: 7 }, (_, i) => toDateKey(addDays(start, i)));
      }

      function slotForDate(dateKey) {
        return (parseDateKey(dateKey).getDay() + 6) % 7;
      }

      function formatDate(dateKey, long = false) {
        return new Intl.DateTimeFormat('ru-RU', long ? { day: 'numeric', month: 'long' } : { day: 'numeric', month: 'short' }).format(parseDateKey(dateKey));
      }

      function weekdayName(dateKey) {
        const name = new Intl.DateTimeFormat('ru-RU', { weekday: 'long' }).format(parseDateKey(dateKey));
        return name ? name.charAt(0).toUpperCase() + name.slice(1) : 'Тренировка';
      }

      function formatCompactDate(dateKey) {
        const date = parseDateKey(dateKey);
        return `${String(date.getDate()).padStart(2, '0')}.${String(date.getMonth() + 1).padStart(2, '0')}`;
      }

      function formatWeekRange(startKey) {
        const dates = weekDates(startKey);
        return `${formatCompactDate(dates[0])}-${formatCompactDate(dates[6])}`;
      }

      function formatMonth(date) {
        return new Intl.DateTimeFormat('ru-RU', { month: 'long', year: 'numeric' }).format(date);
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function clamp(value, min, max) {
        const number = Number(value);
        if (!Number.isFinite(number)) return min;
        return Math.min(max, Math.max(min, number));
      }

      function plural(value, forms) {
        const number = Math.abs(Math.trunc(Number(value) || 0));
        const mod10 = number % 10;
        const mod100 = number % 100;
        if (mod10 === 1 && mod100 !== 11) return forms[0];
        if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return forms[1];
        return forms[2];
      }

      function formatCount(value, forms) {
        return `${formatNumber(value)} ${plural(value, forms)}`;
      }

      function emptyDay() {
        return { active: false, manual: false, label: '', exercises: [] };
      }

      function emptyWeekDays() {
        return Array.from({ length: 7 }, emptyDay);
      }

      function defaultState() {
        return {
          version: 6,
          id: uid(),
          theme: 'dark',
          weeks: {},
          sessions: {},
          updatedAt: new Date().toISOString()
        };
      }

      function loadState() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) return normalize(JSON.parse(saved));
        } catch (_) {}

        for (const key of OLD_KEYS) {
          try {
            const saved = localStorage.getItem(key);
            if (saved) return normalize(JSON.parse(saved));
          } catch (_) {}
        }

        return defaultState();
      }

      function normalize(raw) {
        const fallback = defaultState();
        const next = raw && typeof raw === 'object' ? raw : fallback;
        const currentWeek = weekStartKeyForDate(todayKey());
        const weeks = cleanWeeks(next.weeks);

        if (!Object.keys(weeks).length && Array.isArray(next.days)) {
          weeks[currentWeek] = makeWeek(next.days);
        }

        return {
          version: 6,
          id: next.id || uid(),
          theme: 'dark',
          weeks,
          sessions: cleanSessions(next.sessions),
          updatedAt: next.updatedAt || new Date().toISOString()
        };
      }

      function cleanWeeks(rawWeeks) {
        const weeks = {};
        if (!rawWeeks || typeof rawWeeks !== 'object' || Array.isArray(rawWeeks)) return weeks;
        Object.entries(rawWeeks).forEach(([startKey, week]) => {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(startKey)) return;
          weeks[startKey] = makeWeek(week?.days || emptyWeekDays());
          weeks[startKey].createdAt = week?.createdAt || weeks[startKey].createdAt;
          weeks[startKey].updatedAt = week?.updatedAt || weeks[startKey].updatedAt;
        });
        return weeks;
      }

      function makeWeek(days) {
        return {
          days: cleanDays(days),
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
      }

      function cleanDays(days) {
        const next = Array.isArray(days) ? days.slice(0, 7) : [];
        while (next.length < 7) next.push(emptyDay());
        return next.map(cleanDay);
      }

      function cleanDay(day) {
        if (typeof day === 'string') {
          const exercises = textToExercises(day);
          return { active: exercises.length > 0, manual: exercises.length > 0, label: '', exercises };
        }
        if (!day || typeof day !== 'object') return emptyDay();
        const exercises = (Array.isArray(day.exercises) ? day.exercises : []).map(cleanExercise).filter(Boolean);
        const label = String(day.label ?? '').trim().slice(0, 64);
        const manual = Boolean(day.manual || label || exercises.length);
        const active = manual && (typeof day.active === 'boolean' ? day.active : true);
        return { active, manual, label, exercises };
      }

      function cleanExercise(exercise) {
        if (typeof exercise === 'string') return parseLineToExercise(exercise);
        if (!exercise || typeof exercise !== 'object') return null;
        const name = String(exercise.name ?? '').trim();
        const unit = 'reps';
        let sets = Array.isArray(exercise.sets) ? exercise.sets : [];
        sets = sets.map(value => normalizeSetLabel(value, unit)).filter(Boolean);
        if (!sets.length) sets = [defaultSetValue(unit, name)];
        return { name, unit, sets };
      }

      function textToExercises(text) {
        return String(text || '')
          .split('\n')
          .map(line => line.trim())
          .filter(Boolean)
          .map(parseLineToExercise);
      }

      function parseLineToExercise(line) {
        const match = String(line).match(/^(.*?)(?:\s+[—–-]\s+)(.+)$/);
        const name = (match ? match[1] : line).trim();
        const tail = (match ? match[2] : '').trim();
        const unit = 'reps';
        const sets = tail ? splitSets(tail).map(value => normalizeSetLabel(value, unit)).filter(Boolean) : [defaultSetValue(unit, name)];
        return { name, unit, sets: sets.length ? sets : [defaultSetValue(unit, name)] };
      }

      function splitSets(tail) {
        if (!tail) return ['10'];
        const normalized = tail.replace(/[–—]/g, '-');
        if (!normalized.includes('-')) return [tail.trim()];
        const parts = normalized.split('-').map(v => v.trim()).filter(Boolean);
        return parts.length ? parts : [tail.trim()];
      }

      function inferUnit() {
        return 'reps';
      }

      function normalizeSetLabel(value, unit) {
        const raw = value && typeof value === 'object' ? value.label ?? value.value ?? '' : value;
        const text = String(raw ?? '').trim().replace(',', '.');
        const match = text.match(/\d+(?:\.\d+)?\+?/);
        if (match) return match[0];
        return defaultSetValue(unit, '');
      }

      function defaultSetValue() {
        return '10';
      }

      function cleanSessions(rawSessions) {
        const sessions = {};
        if (!rawSessions || typeof rawSessions !== 'object' || Array.isArray(rawSessions)) return sessions;
        Object.entries(rawSessions).forEach(([dateKey, session]) => {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(dateKey)) return;
          const done = {};
          const rawDone = session?.done && typeof session.done === 'object' ? session.done : {};
          Object.entries(rawDone).forEach(([key, value]) => {
            if (!/^\d+:\d+$/.test(key) || !value) return;
            done[key] = typeof value === 'object' ? value : true;
          });
          if (Object.keys(done).length) {
            sessions[dateKey] = { done, updatedAt: session?.updatedAt || new Date().toISOString() };
          }
        });
        return sessions;
      }

      function applyTheme() {
        document.documentElement.dataset.theme = 'dark';
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#0b0b0d');
      }

      function saveNow() {
        state.updatedAt = new Date().toISOString();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function scheduleSave() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(saveNow, 180);
      }

      function flushSave() {
        clearTimeout(saveTimer);
        saveTimer = null;
        saveNow();
      }

      function getWeek(startKey) {
        if (!state.weeks[startKey]) {
          state.weeks[startKey] = makeWeek(emptyWeekDays());
          scheduleSave();
        }
        return state.weeks[startKey];
      }

      function getExistingWeek(startKey) {
        return state.weeks[startKey] || null;
      }

      function getDay(dateKey) {
        const week = getWeek(weekStartKeyForDate(dateKey));
        const slot = slotForDate(dateKey);
        if (!week.days[slot]) week.days[slot] = emptyDay();
        return week.days[slot];
      }

      function getSession(dateKey) {
        if (!state.sessions[dateKey]) state.sessions[dateKey] = { done: {}, updatedAt: new Date().toISOString() };
        if (!state.sessions[dateKey].done) state.sessions[dateKey].done = {};
        return state.sessions[dateKey];
      }

      function readSession(dateKey) {
        return state.sessions[dateKey] || { done: {} };
      }

      function isManualDay(day) {
        return Boolean(day?.manual && (day?.active || day?.exercises?.length || String(day?.label || '').trim()));
      }

      function hasDayContent(day) {
        return isManualDay(day);
      }

      function hasExistingManualDay(dateKey) {
        const week = getExistingWeek(weekStartKeyForDate(dateKey));
        return Boolean(week && isManualDay(week.days?.[slotForDate(dateKey)]));
      }

      function readExistingDay(dateKey) {
        const week = getExistingWeek(weekStartKeyForDate(dateKey));
        return week?.days?.[slotForDate(dateKey)] || null;
      }

      function dayProgress(dateKey) {
        const day = getDay(dateKey);
        if (!hasDayContent(day)) return { total: 0, checked: 0, percent: 0 };
        const done = readSession(dateKey).done;
        let total = 0;
        let checked = 0;
        day.exercises.forEach((ex, exIndex) => ex.sets.forEach((_, setIndex) => {
          total += 1;
          if (done[`${exIndex}:${setIndex}`]) checked += 1;
        }));
        return { total, checked, percent: total ? Math.round((checked / total) * 100) : 0 };
      }

      function isDayComplete(dateKey) {
        const progress = dayProgress(dateKey);
        return progress.total > 0 && progress.checked === progress.total;
      }

      function timerSeconds() {
        return timerStartedAt ? Math.floor((Date.now() - timerStartedAt) / 1000) : 0;
      }

      function formatTimer(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }

      function updateTimerDisplay() {
        const node = document.getElementById('timerDisplay');
        if (node) node.textContent = formatTimer(timerSeconds());
      }

      function startTimer() {
        timerStartedAt = Date.now();
        clearInterval(timerInterval);
        timerInterval = setInterval(updateTimerDisplay, 1000);
        updateTimerDisplay();
      }

      function stopTimer() {
        timerStartedAt = null;
        clearInterval(timerInterval);
        timerInterval = null;
        updateTimerDisplay();
      }

      function render() {
        if (view === 'summary') renderSummary();
        else renderWeek();
        updateTimerDisplay();
      }

      function renderTop(title, subtitle, options = {}) {
        const weekControls = options.weekControls ? `
          <span class="top-period">
            <button class="top-week-button" data-action="prev" type="button" aria-label="Предыдущая неделя">‹</button>
            <strong class="top-subtitle">${escapeHtml(subtitle)}</strong>
            <button class="top-week-button" data-action="next" type="button" aria-label="Следующая неделя">›</button>
          </span>
        ` : `<strong class="top-subtitle">${escapeHtml(subtitle)}</strong>`;
        return `
          <header class="top">
            <div class="top-inner">
              <div class="top-title">
                <h1>${escapeHtml(title)}</h1>
                ${weekControls}
              </div>
              <div class="timer-bar" aria-live="polite">
                <span>Секундомер</span>
                <strong id="timerDisplay">${formatTimer(timerSeconds())}</strong>
              </div>
            </div>
          </header>
        `;
      }

      function renderBottomNav() {
        const tabs = `
          <div class="bottom-inner">
            <button class="${view === 'week' ? 'dark' : ''}" data-action="view-week" type="button" aria-current="${view === 'week' ? 'page' : 'false'}">Неделя</button>
            <button class="${view === 'summary' ? 'dark' : ''}" data-action="view-summary" type="button" aria-current="${view === 'summary' ? 'page' : 'false'}">Статистика</button>
            <button data-action="data" type="button" aria-haspopup="dialog">Настройки</button>
          </div>
        `;

        if (view === 'summary') {
          return `
            <nav class="bottom-tabs" aria-label="Разделы">
              ${tabs}
            </nav>
          `;
        }

        return `
          <nav class="bottom-tabs" aria-label="Разделы">
            ${tabs}
          </nav>
        `;
      }

      function renderWeek() {
        const weekKey = weekStartKeyForOffset(weekOffset);
        const week = getExistingWeek(weekKey) || makeWeek(emptyWeekDays());
        const dates = weekDates(weekKey);
        const visibleDates = dates.filter(dateKey => isManualDay(week.days[slotForDate(dateKey)]));
        const isEmpty = visibleDates.length === 0;
        if (isEmpty) showAddDayForm = true;

        if (visibleDates.length) {
          const today = todayKey();
          const defaultOpenDate = visibleDates.includes(today) ? today : visibleDates[0];
          if (openDateKey === null || (openDateKey && !visibleDates.includes(openDateKey))) openDateKey = defaultOpenDate;
        } else {
          openDateKey = '';
        }

        document.getElementById('app').innerHTML = `
          ${renderTop('🏆 Спорт', formatWeekRange(weekKey), { weekControls: true })}
          <section class="week-days">
            ${isEmpty ? '' : visibleDates.map(dateKey => renderDay(dateKey, week)).join('')}
            ${showAddDayForm ? renderAddDayForm(dates, week, isEmpty) : renderAddDayButton()}
          </section>
          ${renderBottomNav()}
        `;
      }

      function renderAddDayButton() {
        return `
          <button class="add-day-button dark" data-action="show-add-day" type="button">+ Добавить день</button>
        `;
      }

      function renderAddDayForm(dates, week, isFirstDay = false) {
        const availableDates = dates.filter(dateKey => !isManualDay(week.days[slotForDate(dateKey)]));
        const today = todayKey();
        const defaultDate = availableDates.includes(today) ? today : availableDates[0];

        return `
          <article class="card add-day-card">
            <div class="add-day-head">
              <h2>${isFirstDay ? 'Назначь первый тренировочный день' : 'Новый тренировочный день'}</h2>
              <span class="muted tiny">Выбери дату — название подставится по календарю. Никакие другие дни не появятся сами.</span>
            </div>
            ${availableDates.length ? `
              <form class="add-day-form" data-form="add-day">
                <div class="add-day-fields">
                  <label class="visually-hidden" for="addDayDate">Дата тренировочного дня</label>
                  <input id="addDayDate" class="add-day-date" name="dayDate" type="date" min="${dates[0]}" max="${dates[6]}" value="${defaultDate}" required autofocus>
                </div>
                <div class="add-day-actions">
                  <button class="dark" type="submit">${isFirstDay ? 'Создать первый день' : 'Добавить день'}</button>
                  ${isFirstDay ? '' : '<button data-action="hide-add-day" type="button">Отмена</button>'}
                </div>
              </form>
            ` : `
              <div class="empty">Все семь ручных дней этой недели уже добавлены.</div>
              <button data-action="hide-add-day" type="button">Закрыть</button>
            `}
          </article>
        `;
      }

      function renderDay(dateKey, week) {
        const slot = slotForDate(dateKey);
        const day = week.days[slot] || emptyDay();
        const progress = dayProgress(dateKey);
        const date = parseDateKey(dateKey);
        const dayNumber = String(date.getDate());
        const isCurrent = dateKey === todayKey();
        const isOpen = Boolean(openDateKey && dateKey === openDateKey);
        const complete = Boolean(progress.total && progress.checked === progress.total);
        const title = weekdayName(dateKey);
        const meta = progress.total ? `${progress.checked}/${progress.total} подходов` : 'нет подходов';
        const status = complete ? 'готово' : '';
        return `
          <article class="card day ${isCurrent ? 'current' : ''} ${isOpen ? 'open' : 'collapsed'}" data-date="${dateKey}" data-slot="${slot}" title="Удерживай карточку дня, чтобы удалить">
            <div class="day-toggle" aria-label="${escapeHtml(title)}">
              <span class="day-head">
                <label class="day-date-wrap" aria-label="Изменить дату: ${escapeHtml(formatDate(dateKey, true))}">
                  <span class="day-date" aria-hidden="true">
                    <strong>${escapeHtml(dayNumber)}</strong>
                  </span>
                  <input class="day-date-input" data-field="day-date" data-date="${dateKey}" type="date" value="${dateKey}" aria-label="Перенести день на другую дату">
                </label>
                <button class="day-open-button" data-action="open-day" data-date="${dateKey}" type="button" aria-expanded="${isOpen ? 'true' : 'false'}">
                  <span class="day-title">
                    <h2>${escapeHtml(title)}</h2>
                    <span class="day-meta">${escapeHtml(meta)}</span>
                  </span>
                </button>
                ${status ? `<span class="pill day-status done">${escapeHtml(status)}</span>` : ''}
              </span>
            </div>
            ${isOpen ? `
              <div class="day-body">
                <div class="day-body-top">
                  <div class="progress" role="progressbar" aria-label="Прогресс дня" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progress.percent}"><i style="--value:${progress.percent}%"></i></div>
                </div>
                ${day.exercises.length ? `<div class="exercises">${day.exercises.map((ex, exIndex) => renderExercise(dateKey, ex, exIndex)).join('')}</div>` : '<div class="empty">День создан. Добавь первое упражнение.</div>'}
                <button class="add-exercise" data-action="add-exercise" data-date="${dateKey}" type="button">+ упражнение</button>
              </div>
            ` : ''}
          </article>
        `;
      }

      function renderExercise(dateKey, exercise, exIndex) {
        const session = readSession(dateKey);
        const allDone = exercise.sets.length > 0 && exercise.sets.every((_, setIndex) => session.done[`${exIndex}:${setIndex}`]);
        return `
          <div class="exercise ${allDone ? 'done' : ''}" data-date="${dateKey}" data-ex="${exIndex}" title="Удерживай карточку упражнения, чтобы удалить">
            <div class="exercise-head">
              <input class="exercise-name" data-field="exercise-name" data-date="${dateKey}" data-ex="${exIndex}" value="${escapeHtml(exercise.name)}" placeholder="Название упражнения" aria-label="Название упражнения">
            </div>
            <div class="set-row">
              <button class="small set-control" data-action="remove-set" data-date="${dateKey}" data-ex="${exIndex}" type="button" aria-label="Убрать подход" ${exercise.sets.length <= 1 ? 'disabled' : ''}>−</button>
              ${exercise.sets.map((label, setIndex) => renderSet(dateKey, exercise, label, exIndex, setIndex)).join('')}
              <button class="small set-control dark" data-action="add-set" data-date="${dateKey}" data-ex="${exIndex}" type="button" aria-label="Добавить подход">+</button>
            </div>
          </div>
        `;
      }

      function renderSet(dateKey, exercise, label, exIndex, setIndex) {
        const done = Boolean(readSession(dateKey).done[`${exIndex}:${setIndex}`]);
        const display = formatSetLabel(exercise, label);
        const aria = `Подход ${setIndex + 1}: ${display}.`;
        return `
          <span class="set-item">
            <button class="set ${done ? 'done' : ''}" aria-label="${escapeHtml(aria)}" aria-pressed="${done ? 'true' : 'false'}" data-action="toggle" data-date="${dateKey}" data-ex="${exIndex}" data-set="${setIndex}" type="button">${escapeHtml(display)}</button>
          </span>
        `;
      }

      function formatSetLabel(exercise, label) {
        return String(label || defaultSetValue(exercise.unit, exercise.name));
      }

      function renderSummary() {
        const stats = buildSummaryStats();
        document.getElementById('app').innerHTML = `
          ${renderTop('Статистика', 'весь период')}
          <section class="summary">
            ${stats.sets ? renderStatsDashboard(stats) : renderEmptyStats()}
          </section>
          ${renderBottomNav()}
        `;
      }

      function renderStatsDashboard(stats) {
        const topExercise = stats.rows[0]?.name || 'пока нет лидера';
        return `
          <article class="summary-hero">
            <div class="activity-ring" role="img" aria-label="Выполнено ${stats.completionPercent}% запланированных подходов" style="--value:${clamp(stats.completionPercent, 0, 100)}">
              <div class="ring-core">
                <strong>${stats.completionPercent}%</strong>
                <span>выполнено</span>
              </div>
            </div>
            <div class="summary-hero-copy">
              <span class="chart-label">${escapeHtml(stats.periodLabel)}</span>
              <strong class="impact-number">${formatNumber(stats.sets)}</strong>
              <h2>${formatCount(stats.sets, ['выполненный подход', 'выполненных подхода', 'выполненных подходов'])}</h2>
              <div class="hero-caption">
                <span class="pill">${formatCount(stats.workouts, ['тренировка', 'тренировки', 'тренировок'])}</span>
                <span class="pill">лидер: ${escapeHtml(topExercise)}</span>
              </div>
            </div>
          </article>

            <div class="summary-grid">
              ${renderMetricCard('Тренировки', formatNumber(stats.workouts), `${formatCount(stats.activeDays, ['активный день', 'активных дня', 'активных дней'])} в плане`, stats.activeDays ? stats.workouts / stats.activeDays * 100 : 100)}
              ${renderMetricCard('Подходы', formatNumber(stats.sets), `${formatNumber(stats.plannedSets)} в плане`, stats.completionPercent)}
              ${renderMetricCard('Повторения', formatNumber(stats.reps), 'только выполненный объём', stats.maxUnitValue ? stats.reps / stats.maxUnitValue * 100 : 0)}
            </div>


          <div class="chart-grid">
            ${renderMonthBars(stats.months)}
            ${renderRankList(stats.rows)}
            ${renderUnitList(stats.unitRows)}
            ${renderWeekdayBars(stats.weekdays)}
          </div>
        `;
      }

      function renderEmptyStats() {
        return `
          <article class="empty-hero">
            <div>
              <h2>Статистика пока пустая</h2>
              <p class="muted">Отмечай выполненные подходы в неделе — здесь появятся графики, объём и лидеры.</p>
            </div>
          </article>
        `;
      }

      function renderMetricCard(label, value, note, percent) {
        return `
          <article class="metric-card">
            <span class="chart-label">${escapeHtml(label)}</span>
            <strong>${escapeHtml(value)}</strong>
            <p class="muted tiny">${escapeHtml(note)}</p>
            <div class="metric-meter" role="presentation"><i style="--value:${clamp(percent, 0, 100)}%"></i></div>
          </article>
        `;
      }

      function renderMonthBars(months) {
        if (!months.length) return '';
        return `
          <article class="chart-card wide">
            <div class="chart-title">
              <div>
                <span class="chart-label">Динамика</span>
                <h2>Подходы по месяцам</h2>
              </div>
              <span class="bar-note">скролл вправо</span>
            </div>
            <div class="month-bars">
              ${months.map(month => `
                <div class="month-bar" title="${escapeHtml(month.title)}: ${formatCount(month.sets, ['подход', 'подхода', 'подходов'])}">
                  <i style="--value:${clamp(month.percent, 0, 100)}%"></i>
                  <b>${escapeHtml(month.shortLabel)}</b>
                </div>
              `).join('')}
            </div>
          </article>
        `;
      }

      function renderRankList(rows) {
        const topRows = rows.slice(0, 7);
        if (!topRows.length) return '';
        const max = Math.max(...topRows.map(primaryVolume), 1);
        return `
          <article class="chart-card">
            <div class="chart-title">
              <div>
                <span class="chart-label">Рейтинг</span>
                <h2>Топ упражнений</h2>
              </div>
            </div>
            <div class="rank-list">
              ${topRows.map(row => {
                const percent = primaryVolume(row) / max * 100;
                const variants = row.variants?.size > 1 ? ` · ${row.variants.size} варианта` : '';
                return `
                  <div class="rank-row">
                    <div class="rank-top">
                      <strong>${escapeHtml(row.name)}</strong>
                      <span>${escapeHtml(`${formatUnits(row.units, row.sets)}${variants}`)}</span>
                    </div>
                    <div class="rank-meter" role="presentation"><i style="--value:${clamp(percent, 0, 100)}%"></i></div>
                  </div>
                `;
              }).join('')}
            </div>
          </article>
        `;
      }

      function renderUnitList(unitRows) {
        if (!unitRows.length) return '';
        const max = Math.max(...unitRows.map(row => row.value), 1);
        return `
          <article class="chart-card">
            <div class="chart-title">
              <div>
                <span class="chart-label">Объём</span>
                <h2>По типам нагрузки</h2>
              </div>
            </div>
            <div class="unit-list">
              ${unitRows.map(row => `
                <div class="unit-row">
                  <div class="unit-top">
                    <strong>${escapeHtml(row.label)}</strong>
                    <span>${escapeHtml(row.text)}</span>
                  </div>
                  <div class="unit-meter"><i style="--value:${clamp(row.value / max * 100, 0, 100)}%"></i></div>
                </div>
              `).join('')}
            </div>
          </article>
        `;
      }

      function renderWeekdayBars(weekdays) {
        const max = Math.max(...weekdays.map(day => day.sets), 1);
        return `
          <article class="chart-card">
            <div class="chart-title">
              <div>
                <span class="chart-label">Ритм</span>
                <h2>Нагрузка по дням</h2>
              </div>
            </div>
            <div class="weekday-bars">
              ${weekdays.map(day => `
                <div class="weekday-bar" title="${escapeHtml(day.label)}: ${formatCount(day.sets, ['подход', 'подхода', 'подходов'])}">
                  <i style="--value:${clamp(day.sets / max * 100, 0, 100)}%; --alpha:${day.sets ? 1 : 0.28}"></i>
                  <b>${escapeHtml(day.short)}</b>
                </div>
              `).join('')}
            </div>
          </article>
        `;
      }

      function buildSummaryStats() {
        const rows = new Map();
        const workouts = new Set();
        const months = new Map();
        const weekdays = SHORT.map(short => ({ short, label: short, sets: 0 }));
        let sets = 0;
        let reps = 0;
        let plannedSets = 0;
        let activeDays = 0;
        let firstDate = null;
        let lastDate = null;

        Object.entries(state.weeks || {}).forEach(([, week]) => {
          (week?.days || []).forEach(day => {
            if (!isManualDay(day)) return;
            activeDays += 1;
            (day.exercises || []).forEach(exercise => { plannedSets += exercise.sets?.length || 0; });
          });
        });

        Object.entries(state.sessions || {}).forEach(([dateKey, session]) => {
          const week = getExistingWeek(weekStartKeyForDate(dateKey));
          const day = week?.days?.[slotForDate(dateKey)] || emptyDay();
          if (!isManualDay(day)) return;
          const exercises = day.exercises || [];
          let dayDone = false;

          Object.entries(session?.done || {}).forEach(([key, value]) => {
            if (!value) return;
            const [exIndex, setIndex] = key.split(':').map(Number);
            const fallbackExercise = exercises[exIndex];
            const payload = typeof value === 'object' ? value : null;
            const exerciseName = payload?.exercise || fallbackExercise?.name || 'Упражнение';
            const fallbackLabel = fallbackExercise?.sets?.[setIndex] || defaultSetValue('reps', exerciseName);
            const label = payload?.label || fallbackLabel;
            const metric = normalizeMetric(payload?.metric || setMetric(label));
            const groupName = payload?.group || groupExerciseName(exerciseName);
            const rowKey = groupName.toLowerCase();
            const row = rows.get(rowKey) || makeSummaryRow(groupName);
            const monthKey = dateKey.slice(0, 7);
            const month = months.get(monthKey) || makeMonthRow(monthKey);
            const weekday = weekdays[slotForDate(dateKey)];

            row.sets += 1;
            row.variants.add(exerciseName);
            addMetric(row.units, metric);
            rows.set(rowKey, row);

            month.sets += 1;
            addMetric(month.units, metric);
            months.set(monthKey, month);

            weekday.sets += 1;
            sets += 1;
            if (metric.unit === 'повт') reps += metric.value;
            dayDone = true;
          });

          if (dayDone) {
            workouts.add(dateKey);
            if (!firstDate || dateKey < firstDate) firstDate = dateKey;
            if (!lastDate || dateKey > lastDate) lastDate = dateKey;
          }
        });

        const sortedRows = Array.from(rows.values()).sort((a, b) => primaryVolume(b) - primaryVolume(a) || b.sets - a.sets || a.name.localeCompare(b.name, 'ru'));
        const monthRows = buildMonthSeries(months, firstDate, lastDate);
        const maxMonthSets = Math.max(...monthRows.map(month => month.sets), 1);
        monthRows.forEach(month => { month.percent = month.sets / maxMonthSets * 100; });
        const maxUnitValue = Math.max(reps, sets, 1);

        return {
          sets,
          reps,
          workouts: workouts.size,
          plannedSets,
          activeDays,
          completionPercent: plannedSets ? Math.min(100, Math.round(sets / plannedSets * 100)) : (sets ? 100 : 0),
          periodLabel: firstDate && lastDate ? `с ${formatDate(firstDate)} по ${formatDate(lastDate)}` : 'нет выполненных подходов',
          rows: sortedRows,
          months: monthRows,
          weekdays,
          maxUnitValue,
          unitRows: buildUnitRows({ sets, reps })
        };
      }

      function makeSummaryRow(name) {
        return { name, sets: 0, units: {}, variants: new Set() };
      }

      function makeMonthRow(monthKey) {
        return {
          key: monthKey,
          title: monthTitle(monthKey),
          shortLabel: monthShortLabel(monthKey),
          sets: 0,
          units: {},
          percent: 0
        };
      }

      function buildMonthSeries(months, firstDate, lastDate) {
        if (!firstDate || !lastDate) return [];
        const rows = [];
        let cursor = firstDate.slice(0, 7);
        const end = lastDate.slice(0, 7);
        while (cursor <= end) {
          rows.push(months.get(cursor) || makeMonthRow(cursor));
          cursor = nextMonthKey(cursor);
        }
        return rows;
      }

      function nextMonthKey(monthKey) {
        const [year, month] = monthKey.split('-').map(Number);
        const date = new Date(year, month, 1);
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
      }

      function monthTitle(monthKey) {
        const [year, month] = monthKey.split('-').map(Number);
        return formatMonth(new Date(year, month - 1, 1));
      }

      function monthShortLabel(monthKey) {
        const [year, month] = monthKey.split('-').map(Number);
        const label = new Intl.DateTimeFormat('ru-RU', { month: 'short' }).format(new Date(year, month - 1, 1)).replace('.', '');
        return `${label} ${String(year).slice(2)}`;
      }

      function buildUnitRows(stats) {
        const rows = [];
        if (stats.reps) rows.push({ label: 'Повторения', value: stats.reps, text: formatCount(stats.reps, ['повторение', 'повторения', 'повторений']) });
        rows.push({ label: 'Подходы', value: stats.sets, text: formatCount(stats.sets, ['подход', 'подхода', 'подходов']) });
        return rows;
      }

      function setMetric(label) {
        const text = String(label || '').toLowerCase().replace(',', '.');
        const match = text.match(/\d+(?:\.\d+)?/);
        const value = match ? Number(match[0]) : 0;
        return { unit: 'повт', value };
      }

      function normalizeMetric(metric) {
        const value = Number(metric?.value || 0);
        const safeValue = Number.isFinite(value) ? value : 0;
        return { unit: 'повт', value: safeValue };
      }

      function addMetric(units, metric) {
        if (!metric.value) return;
        units[metric.unit] = (units[metric.unit] || 0) + metric.value;
      }

      function primaryVolume(row) {
        return row.units['повт'] || row.sets;
      }

      function formatUnits(units, fallbackSets = 0) {
        return units['повт'] ? `${formatNumber(units['повт'])} ${unitName('повт', units['повт'])}` : formatCount(fallbackSets, ['подход', 'подхода', 'подходов']);
      }

      function unitName(unit, value) {
        if (unit === 'повт') return plural(value, ['повторение', 'повторения', 'повторений']);
        return unit;
      }

      function groupExerciseName(name) {
        const cleaned = String(name || 'Упражнение')
          .replace(/\s+\+?\d+(?:[,.]\d+)?\s*кг/ig, '')
          .replace(/\s+/g, ' ')
          .trim();
        const lower = cleaned.toLowerCase();
        if (lower.startsWith('подтяг')) return 'Подтягивания';
        if (lower.startsWith('присед')) return 'Приседания';
        if (lower === 'брусья') return 'Брусья';
        return cleaned || 'Упражнение';
      }

      function makeDonePayload(exercise, label) {
        return {
          exercise: exercise?.name || 'Упражнение',
          group: groupExerciseName(exercise?.name),
          label: label || defaultSetValue(exercise?.unit || 'reps', exercise?.name),
          metric: setMetric(label),
          completedAt: new Date().toISOString()
        };
      }

      function formatNumber(value) {
        const number = Number(value || 0);
        if (Number.isInteger(number)) return String(number);
        return number.toLocaleString('ru-RU', { maximumFractionDigits: 1 });
      }

      function touchWeek(dateKey) {
        const week = getWeek(weekStartKeyForDate(dateKey));
        week.updatedAt = new Date().toISOString();
        return week;
      }

      function setDayActive(dateKey, active) {
        const day = getDay(dateKey);
        day.active = Boolean(active);
        if (!day.active) {
          day.manual = false;
          day.label = '';
          day.exercises = [];
          delete state.sessions[dateKey];
          stopTimer();
          if (openDateKey === dateKey) openDateKey = null;
        } else {
          day.manual = true;
          openDateKey = dateKey;
          showAddDayForm = false;
        }
        touchWeek(dateKey);
        saveNow();
        render();
      }

      function cloneDay(day) {
        return cleanDay(JSON.parse(JSON.stringify(day || emptyDay())));
      }

      function addCustomDay(dateKey) {
        const weekKey = weekStartKeyForOffset(weekOffset);
        const dates = weekDates(weekKey);
        if (!isDateKey(dateKey) || !dates.includes(dateKey)) {
          toast('Выбери дату из этой недели');
          return;
        }
        if (hasExistingManualDay(dateKey)) {
          toast('На эту дату уже есть день');
          render();
          return;
        }

        const day = getDay(dateKey);
        day.active = true;
        day.manual = true;
        day.label = weekdayName(dateKey);
        day.exercises = Array.isArray(day.exercises) ? day.exercises : [];
        openDateKey = dateKey;
        showAddDayForm = false;
        touchWeek(dateKey);
        saveNow();
        render();
        setTimeout(() => document.querySelector(`[data-action="add-exercise"][data-date="${dateKey}"]`)?.focus(), 40);
      }

      function moveDayDate(fromDateKey, toDateKey) {
        if (!isDateKey(fromDateKey) || !isDateKey(toDateKey)) {
          toast('Некорректная дата');
          render();
          return;
        }
        if (fromDateKey === toDateKey) return;
        const sourceWeek = getExistingWeek(weekStartKeyForDate(fromDateKey));
        const sourceSlot = slotForDate(fromDateKey);
        const sourceDay = sourceWeek?.days?.[sourceSlot];
        if (!isManualDay(sourceDay)) {
          toast('День не найден');
          render();
          return;
        }
        if (hasExistingManualDay(toDateKey)) {
          toast('На эту дату уже есть день');
          render();
          return;
        }

        const targetWeek = getWeek(weekStartKeyForDate(toDateKey));
        const targetSlot = slotForDate(toDateKey);
        targetWeek.days[targetSlot] = cloneDay(sourceDay);
        targetWeek.days[targetSlot].label = weekdayName(toDateKey);
        sourceWeek.days[sourceSlot] = emptyDay();

        if (state.sessions[fromDateKey]) {
          state.sessions[toDateKey] = state.sessions[fromDateKey];
          state.sessions[toDateKey].updatedAt = new Date().toISOString();
          delete state.sessions[fromDateKey];
        } else {
          delete state.sessions[toDateKey];
        }

        sourceWeek.updatedAt = new Date().toISOString();
        targetWeek.updatedAt = new Date().toISOString();
        openDateKey = toDateKey;
        weekOffset = weekOffsetForDate(toDateKey);
        showAddDayForm = false;
        saveNow();
        render();
        toast('День перенесён');
      }

      function updateExerciseName(dateKey, exIndex, name) {
        const day = getDay(dateKey);
        const exercise = day.exercises[exIndex];
        if (!exercise) return;
        exercise.name = String(name ?? '');
        exercise.unit = 'reps';
        updateDoneExercise(dateKey, exIndex);
        touchWeek(dateKey);
        scheduleSave();
      }

      function updateDoneExercise(dateKey, exIndex) {
        const session = state.sessions[dateKey];
        const exercise = getDay(dateKey).exercises[exIndex];
        if (!session?.done || !exercise) return;
        Object.entries(session.done).forEach(([key, value]) => {
          const [currentEx, setIndex] = key.split(':').map(Number);
          if (currentEx !== exIndex || !value || typeof value !== 'object') return;
          const label = exercise.sets[setIndex] || defaultSetValue(exercise.unit, exercise.name);
          value.exercise = exercise.name || 'Упражнение';
          value.group = groupExerciseName(exercise.name);
          value.label = label;
          value.metric = setMetric(label);
        });
        session.updatedAt = new Date().toISOString();
      }

      function updateDoneSet(dateKey, exIndex, setIndex) {
        const session = state.sessions[dateKey];
        const key = `${exIndex}:${setIndex}`;
        const value = session?.done?.[key];
        const exercise = getDay(dateKey).exercises[exIndex];
        if (!value || typeof value !== 'object' || !exercise) return;
        const label = exercise.sets[setIndex] || defaultSetValue(exercise.unit, exercise.name);
        value.exercise = exercise.name || 'Упражнение';
        value.group = groupExerciseName(exercise.name);
        value.label = label;
        value.metric = setMetric(label);
        session.updatedAt = new Date().toISOString();
      }

      function addExercise(dateKey) {
        const day = getDay(dateKey);
        day.active = true;
        day.manual = true;
        day.exercises.push({ name: '', unit: 'reps', sets: ['10'] });
        openDateKey = dateKey;
        touchWeek(dateKey);
        saveNow();
        render();
        setTimeout(() => {
          const inputs = document.querySelectorAll(`input[data-field="exercise-name"][data-date="${dateKey}"]`);
          inputs[inputs.length - 1]?.focus();
        }, 40);
      }

      function removeExercise(dateKey, exIndex) {
        const day = getDay(dateKey);
        if (!day.exercises[exIndex]) return;
        day.exercises.splice(exIndex, 1);
        shiftSessionAfterExerciseRemoval(dateKey, exIndex);
        touchWeek(dateKey);
        saveNow();
        render();
      }

      function shiftSessionAfterExerciseRemoval(dateKey, removedExIndex) {
        const session = state.sessions[dateKey];
        if (!session?.done) return;
        const nextDone = {};
        Object.entries(session.done).forEach(([key, value]) => {
          const [exIndex, setIndex] = key.split(':').map(Number);
          if (exIndex < removedExIndex) nextDone[key] = value;
          if (exIndex > removedExIndex) nextDone[`${exIndex - 1}:${setIndex}`] = value;
        });
        session.done = nextDone;
        session.updatedAt = new Date().toISOString();
        if (!Object.keys(session.done).length) delete state.sessions[dateKey];
      }

      function updateLineSetCount(dateKey, exIndex, delta) {
        const day = getDay(dateKey);
        const exercise = day.exercises[exIndex];
        if (!exercise) return;
        exercise.unit = 'reps';
        if (delta > 0) exercise.sets.push(exercise.sets[exercise.sets.length - 1] || defaultSetValue(exercise.unit, exercise.name));
        if (delta < 0 && exercise.sets.length > 1) {
          exercise.sets.pop();
          cleanupSessionForDay(dateKey);
        }
        touchWeek(dateKey);
        saveNow();
        render();
      }

      function setSetValue(dateKey, exIndex, setIndex, value) {
        const day = getDay(dateKey);
        const exercise = day.exercises[exIndex];
        if (!exercise || !(setIndex in exercise.sets)) return;
        exercise.sets[setIndex] = normalizeSetLabel(value, exercise.unit);
        updateDoneSet(dateKey, exIndex, setIndex);
        touchWeek(dateKey);
        saveNow();
        render();
      }

      function adjustSetValue(dateKey, exIndex, setIndex, delta) {
        const day = getDay(dateKey);
        const exercise = day.exercises[exIndex];
        if (!exercise || !(setIndex in exercise.sets)) return;
        const current = Number(String(exercise.sets[setIndex]).match(/\d+(?:\.\d+)?/)?.[0] || 0);
        const next = Math.max(0, current + Number(delta || 0));
        setSetValue(dateKey, exIndex, setIndex, next);
      }

      function editSetValue(target) {
        const dateKey = target.dataset.date;
        const exIndex = Number(target.dataset.ex);
        const setIndex = Number(target.dataset.set);
        const exercise = getDay(dateKey).exercises[exIndex];
        if (!exercise || !(setIndex in exercise.sets)) return;
        exercise.unit = 'reps';
        const current = String(exercise.sets[setIndex] || defaultSetValue(exercise.unit, exercise.name));
        const next = prompt('Сколько повторений?', current);
        if (next === null) return;
        setSetValue(dateKey, exIndex, setIndex, next);
      }

      function cleanupSessionForDay(dateKey) {
        const session = state.sessions[dateKey];
        if (!session?.done) return;
        const day = getDay(dateKey);
        Object.keys(session.done).forEach(key => {
          const [exIndex, setIndex] = key.split(':').map(Number);
          if (!day.active || !day.exercises[exIndex] || !(setIndex in day.exercises[exIndex].sets)) delete session.done[key];
        });
        session.updatedAt = new Date().toISOString();
        if (!Object.keys(session.done).length) delete state.sessions[dateKey];
      }

      function toggleSet(dateKey, exIndex, setIndex) {
        const session = getSession(dateKey);
        const key = `${exIndex}:${setIndex}`;
        const wasDone = Boolean(session.done[key]);
        if (wasDone) {
          delete session.done[key];
          stopTimer();
        } else {
          const exercise = getDay(dateKey).exercises[exIndex];
          const label = exercise?.sets?.[setIndex] || defaultSetValue(exercise?.unit || 'reps', exercise?.name);
          session.done[key] = makeDonePayload(exercise, label);
        }
        session.updatedAt = new Date().toISOString();
        if (!Object.keys(session.done).length) delete state.sessions[dateKey];
        saveNow();

        if (!wasDone && isDayComplete(dateKey)) {
          stopTimer();
          render();
          return;
        }

        render();
        if (!wasDone) startTimer();
      }

      function handleSubmit(form) {
        if (form.dataset.form !== 'add-day') return;
        const dateInput = form.elements.dayDate;
        const dateKey = String(dateInput?.value || '').trim();
        if (!isDateKey(dateKey)) {
          dateInput?.focus();
          toast('Выбери дату дня');
          return;
        }
        addCustomDay(dateKey);
      }

      function handleAction(target) {
        const action = target.dataset.action;
        if (action === 'view-week') { view = 'week'; showAddDayForm = false; render(); return; }
        if (action === 'view-summary') { view = 'summary'; render(); return; }
        if (action === 'prev') { weekOffset -= 1; openDateKey = null; showAddDayForm = false; render(); return; }
        if (action === 'next') { weekOffset += 1; openDateKey = null; showAddDayForm = false; render(); return; }
        if (action === 'open-day') { openDateKey = openDateKey === target.dataset.date ? '' : target.dataset.date; showAddDayForm = false; render(); return; }
        if (action === 'show-add-day') { showAddDayForm = true; openDateKey = ''; render(); return; }
        if (action === 'hide-add-day') {
          const weekKey = weekStartKeyForOffset(weekOffset);
          const dates = weekDates(weekKey);
          const week = getExistingWeek(weekKey) || makeWeek(emptyWeekDays());
          const hasVisibleDays = dates.some(dateKey => isManualDay(week.days[slotForDate(dateKey)]));
          showAddDayForm = !hasVisibleDays;
          render();
          return;
        }
        if (action === 'data') { openDataSheet(); return; }
        if (action === 'close-sheet') { closeSheet(); return; }
        if (action === 'copy-json') { copyJson(); return; }
        if (action === 'export-json') { exportJson(); return; }
        if (action === 'import-json') { importJson(); return; }
        if (action === 'add-exercise') { addExercise(target.dataset.date); return; }
        if (action === 'toggle') { toggleSet(target.dataset.date, Number(target.dataset.ex), Number(target.dataset.set)); return; }
        if (action === 'add-set' || action === 'remove-set') {
          updateLineSetCount(target.dataset.date, Number(target.dataset.ex), action === 'add-set' ? 1 : -1);
          return;
        }
        if (action === 'adjust-set') {
          adjustSetValue(target.dataset.date, Number(target.dataset.ex), Number(target.dataset.set), Number(target.dataset.delta));
          return;
        }
        if (action === 'edit-set') {
          editSetValue(target);
        }
      }

      function handleInput(target) {
        const field = target.dataset.field;
        if (field === 'exercise-name') {
          updateExerciseName(target.dataset.date, Number(target.dataset.ex), target.value);
        }
      }

      function handleChange(target) {
        const field = target.dataset.field;
        if (field === 'day-date') {
          moveDayDate(target.dataset.date, target.value);
          return;
        }
      }

      function handleBlur(target) {
        if (target.dataset.field !== 'exercise-name') return;
        flushSave();
        render();
      }

      function openDataSheet() {
        flushSave();
        const sheet = document.getElementById('sheet');
        sheet.innerHTML = `
          <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
            <div class="title-row">
              <h2 id="sheetTitle">JSON</h2>
              <button data-action="close-sheet" type="button" aria-label="Закрыть настройки">Закрыть</button>
            </div>
            <div class="toolbar">
              <button class="dark" data-action="copy-json" type="button">Копировать</button>
              <button data-action="export-json" type="button">Скачать</button>
              <button data-action="import-json" type="button">Импорт</button>
            </div>
            <textarea id="jsonBox" class="json-box">${escapeHtml(JSON.stringify(state, null, 2))}</textarea>
          </div>
        `;
        sheet.classList.add('show');
        sheet.setAttribute('aria-hidden', 'false');
      }

      function closeSheet() {
        const sheet = document.getElementById('sheet');
        sheet.classList.remove('show');
        sheet.setAttribute('aria-hidden', 'true');
      }

      async function copyJson() {
        const text = JSON.stringify(state, null, 2);
        try {
          await navigator.clipboard.writeText(text);
          toast('Скопировано');
        } catch (_) {
          const box = document.getElementById('jsonBox');
          box?.focus();
          box?.select();
          toast('Выделил текст');
        }
      }

      function exportJson() {
        flushSave();
        const text = JSON.stringify(state, null, 2);
        const blob = new Blob([text], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `sport-${todayKey()}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function importJson() {
        const box = document.getElementById('jsonBox');
        try {
          state = normalize(JSON.parse(box.value));
          applyTheme();
          saveNow();
          closeSheet();
          render();
          toast('Импортировано');
        } catch (_) {
          toast('JSON битый');
        }
      }

      function toast(message) {
        const node = document.getElementById('toast');
        node.textContent = message;
        node.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => node.classList.remove('show'), 1600);
      }

      function registerServiceWorker() {
        if (!('serviceWorker' in navigator)) return;
        if (!window.isSecureContext && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js?v=1.0.14', { updateViaCache: 'none' })
            .then(registration => {
              registration.update().catch(() => {});
              if (registration.waiting) registration.waiting.postMessage({ type: 'SKIP_WAITING' });
              registration.addEventListener('updatefound', () => {
                const worker = registration.installing;
                if (!worker) return;
                worker.addEventListener('statechange', () => {
                  if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                    worker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              });
            })
            .catch(() => {});
        });
      }

      function clearLongPress() {
        clearTimeout(longPressTimer);
        longPressTimer = null;
        longPressTarget = null;
      }

      function longPressAction(target) {
        if (target.matches('.set[data-action="toggle"]')) return () => editSetValue(target);
        if (target.matches('.exercise[data-date][data-ex]')) {
          const name = getDay(target.dataset.date).exercises[Number(target.dataset.ex)]?.name || 'упражнение';
          return () => {
            removeExercise(target.dataset.date, Number(target.dataset.ex));
            toast(`Удалено: ${name}`);
          };
        }
        if (target.matches('.day[data-date]')) {
          const title = weekdayName(target.dataset.date);
          return () => {
            setDayActive(target.dataset.date, false);
            toast(`День удалён: ${title}`);
          };
        }
        return null;
      }

      function startLongPress(event) {
        if (event.button !== undefined && event.button !== 0) return;
        const target = event.target.closest('.set[data-action="toggle"], .exercise[data-date][data-ex], .day[data-date]');
        if (!target) return;
        if (target.classList.contains('exercise') && event.target.closest('.set, .set-control, input, button, textarea, select, label')) return;
        if (target.classList.contains('day') && event.target.closest('.exercise, .day-date-wrap, [data-action="add-exercise"], input, textarea, select, label')) return;
        clearLongPress();
        longPressTarget = target;
        longPressStartX = event.clientX ?? event.touches?.[0]?.clientX ?? 0;
        longPressStartY = event.clientY ?? event.touches?.[0]?.clientY ?? 0;
        longPressTimer = setTimeout(() => {
          if (!longPressTarget) return;
          ignoreNextClick = true;
          const action = longPressAction(longPressTarget);
          clearLongPress();
          action?.();
        }, 620);
      }

      function moveLongPress(event) {
        if (!longPressTarget) return;
        const point = event.touches?.[0] || event;
        const x = point.clientX ?? longPressStartX;
        const y = point.clientY ?? longPressStartY;
        if (Math.abs(x - longPressStartX) > 12 || Math.abs(y - longPressStartY) > 12) clearLongPress();
      }

      document.addEventListener('pointerdown', startLongPress);
      document.addEventListener('pointermove', moveLongPress);
      document.addEventListener('pointerup', clearLongPress);
      document.addEventListener('pointercancel', clearLongPress);
      document.addEventListener('contextmenu', event => {
        if (!event.target.closest('.set[data-action="toggle"], .exercise[data-date][data-ex], .day[data-date]')) return;
        event.preventDefault();
      });

      document.addEventListener('click', event => {
        const target = event.target.closest('[data-action]');
        if (!target) return;
        event.preventDefault();
        if (ignoreNextClick) {
          ignoreNextClick = false;
          return;
        }
        handleAction(target);
      });

      document.addEventListener('submit', event => {
        const form = event.target.closest('form[data-form]');
        if (!form) return;
        event.preventDefault();
        handleSubmit(form);
      });
      document.addEventListener('input', event => handleInput(event.target));
      document.addEventListener('change', event => handleChange(event.target));
      document.addEventListener('blur', event => handleBlur(event.target), true);
      window.addEventListener('pagehide', flushSave);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSave(); });

      registerServiceWorker();
      state = loadState();
      applyTheme();
      saveNow();
      render();
    })();
  </script>
</body>
</html>
